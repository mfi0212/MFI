document.addEventListener('contextmenu', e => e.preventDefault());
function getInitial(name) {
  return name.trim()[0]?.toUpperCase() || "?";
}

function renderAll() {
  const container = document.getElementById("sectionsContainer");
  container.innerHTML = "";

  siteGroups.forEach(group => {
    const section = document.createElement("div");
    section.className = "section";

    const h2 = document.createElement("h2");
    h2.textContent = group.heading;
    section.appendChild(h2);

    group.sites.forEach(site => {
      const a = document.createElement("a");
      a.href = site.url;
      a.target = "_parent";
      a.className = "site-item";

      const initial = getInitial(site.name);

      a.innerHTML = `
        <div class="letter-icon">${initial}</div>
        <div class="site-info">
          <h3>${site.name}</h3>
          <p>${site.desc}</p>
        </div>
      `;

      section.appendChild(a);
    });

    container.appendChild(section);
  });
}

function renderFiltered(query = "") {
  const q = query.toLowerCase().trim();
  const container = document.getElementById("sectionsContainer");
  const noResults = document.getElementById("noResults");

  container.innerHTML = "";

  if (!q) {
    renderAll();
    noResults.style.display = "none";
    return;
  }

  let found = false;

  siteGroups.forEach(group => {
    const matches = group.sites.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.desc.toLowerCase().includes(q) ||
      s.url.toLowerCase().includes(q)
    );

    if (!matches.length) return;

    found = true;

    const section = document.createElement("div");
    section.className = "section";

    const h2 = document.createElement("h2");
    h2.textContent = group.heading;
    section.appendChild(h2);

    matches.forEach(site => {
      const a = document.createElement("a");
      a.href = site.url;
      a.target = "_parent";
      a.className = "site-item";

      const initial = getInitial(site.name);

      a.innerHTML = `
        <div class="letter-icon">${initial}</div>
        <div class="site-info">
          <h3>${site.name}</h3>
          <p>${site.desc}</p>
        </div>
      `;

      section.appendChild(a);
    });

    container.appendChild(section);
  });

  noResults.style.display = found ? "none" : "block";
}

function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    alert("Back button clicked!\n\n(In a real app this would take you to previous screen or home.)");
  }
}

function clearSearch() {
  const input = document.getElementById("searchInput");
  input.value = "";
  renderFiltered("");
  input.focus();
}

/* ========== THEME SWITCHER ========== */
function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem("bsmfi-theme", theme);

  // Update active button
  document.querySelectorAll(".themeoptions button").forEach(btn => {
    btn.classList.remove("active");
  });
  const activeBtn = document.getElementById("btn-" + theme);
  if (activeBtn) activeBtn.classList.add("active");
}

// Load saved theme or default to dark
(function initTheme() {
  const saved = localStorage.getItem("bsmfi-theme") || "dark";
  setTheme(saved);
})();

renderAll();

document.getElementById("searchInput").addEventListener("input", e => {
  renderFiltered(e.target.value);
});
