  <script>
    const users = {
      "9919": {
        name: "Tony Montana",
        links: [
          { title: "Premium Offer A", desc: "Best deal for you", url: "https://example.com/a" },
          { title: "Special Package B", desc: "Limited time", url: "https://example.com/b" },
          { title: "VIP Access C", desc: "Members only", url: "https://example.com/c" }
        ]
      },
    };
document.addEventListener('contextmenu', e => e.preventDefault());
    function check() {
      const pass = document.getElementById("pass").value.trim();
      const error = document.getElementById("error");
      const linksDiv = document.getElementById("links");

      if (users[pass]) {
        error.style.display = "none";
        const u = users[pass];
        let html = `<p class="welcome">Welcome, ${u.name}</p>`;

        u.links.forEach(l => {
          html += `
            <div class="card">
              <div class="info">
                <h3>${l.title}</h3>
                <p>${l.desc}</p>
              </div>
              <a href="${l.url}" target="_blank" class="btn">Open</a>

        });

        linksDiv.innerHTML = html;
        linksDiv.style.display = "block";
      } else {
        linksDiv.style.display = "none";
        error.style.display = "block";
      }
    }

    document.getElementById("pass").addEventListener("keypress", e => {
      if (e.key === "Enter") check();
    });
  </script>
