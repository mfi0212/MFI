  function switchTab(index) {
    currentTab = index;

    // update nav active state
    for (let i = 0; i < 5; i++) {
      document.getElementById(`nav-${i}`).classList.toggle('active', i === index);
    }

    // middle content
    document.getElementById('main-content').innerHTML = tabContents[index];

    // right calculator panel
    renderCalcPanel();
  }

  function renderCalcPanel() {
    const panel = document.getElementById('calc-panel');
    const rate = fees[currentTab];
    const formUrl = formLinks[currentTab];

    if (rate !== null) {
      // normal calculator
      panel.innerHTML = `
        <div class="calc-header">${tabNames[currentTab]}</div>

        <div class="amount-box">
          <input id="amount-input" type="number" placeholder="Enter amount..." oninput="calculateFee()">
        </div>

        <div class="calc-result">
          <div class="result-row">
            <span class="label">Amount Fee (${rate}%)</span>
            <span class="value" id="fee-amount">₹0.00</span>
          </div>
        </div>

        <div class="pay-note">You must pay the fee first</div>

      

        <a href="${formUrl}" target="_self" class="btn btn-apply">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/><path d="M5 5v14h14v-7h2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7v2H5z"/></svg>
          Apply Now
        </a>
      `;
      // set default
      setTimeout(() => {
        const input = document.getElementById('amount-input');
        if (input) {
          input.value = 1000;
          calculateFee();
        }
      }, 10);
    } 
    else if (currentTab === 3) {
      // Pre-Saver
      panel.innerHTML = `
        <div class="special-panel">
          <h3>Welcome to Pre-Saver</h3>
          <p>By using Pre-saver you can save the particular upcoming offer (or) amounts on a particular date.</p>
          <a href="${formUrl}" target="_self" class="btn btn-apply" style="margin-top:10px;">
            Apply Now
          </a>
        </div>
      `;
    } 
    else {
      // Lendlink Mid
      panel.innerHTML = `
        <div class="special-panel">
          <h3>By Chloennaouii</h3>
          <p>Turn your money into income with Lendlink - Mid.</p>
          <a href="${formUrl}" target="_blank" class="btn btn-apply" style="margin-top:10px;">
            Explore Now
          </a>
        </div>

  }

  function calculateFee() {
    const input = document.getElementById('amount-input');
    if (!input) return;
    const amount = parseFloat(input.value) || 0;
    const rate = fees[currentTab];
    const fee = (amount * rate / 100);
    const feeEl = document.getElementById('fee-amount');
    if (feeEl) feeEl.textContent = '₹' + fee.toFixed(2);
  }
