<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>BS&MFI Services | ProgramX</title> <link rel="icon" type="image/x-icon" href="mfi.logo.png"> <style> * { margin: 0; padding: 0; box-sizing: border-box;scrollbar-width: thin; font-family: 'Segoe UI', system-ui, sans-serif; } * { -webkit-tap-highlight-color: transparent; } body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #2c2c2c; color: #e0e0e0; padding: 10px; } .card { width: 100%; max-width: 760px; overflow: hidden; } .header { background: #222; color: #f0f0f0; padding: 5px; text-align: center; margin: 10px 0; border-radius: 10px; } .header h1 { font-size: 1.45rem; margin-bottom: 6px; letter-spacing: 0.5px; } .header p { opacity: 0.8; font-size: 0.92rem; color: #bbb; } .dates { background: #2a2a2a; border-radius: 10px; padding: 14px 16px; margin-bottom: 22px; font-size: 0.93rem; line-height: 1.65; border: 1px solid #404040; } .dates strong { color: #c0c0c0; } label { display: block; margin-bottom: 8px; font-weight: 600; color: #ccc; font-size: 0.95rem; } input[type="password"] { width: 100%; padding: 13px 15px; border: 1px solid #555; border-radius: 8px; font-size: 1rem; margin-bottom: 18px; background: #2a2a2a; color: #eee; } input[type="password"]:focus { outline: none; border-color: #888; } input[type="password"]::placeholder { color: #777; } .btn { width: 100%; padding: 13px; border: none; border-radius: 8px; font-size: 1.02rem; font-weight: 600; cursor: pointer; transition: all 0.2s; } .btn-primary { background: #555; color: #fff; } .btn-primary:hover { background: #666; } .btn-success { background: #4a7c59; color: #fff; margin-top: 12px; } .btn-success:hover { background: #3d6b4a; } .btn-issue { background: #6b4a4a; color: #fff; margin-top: 10px; } .btn-issue:hover { background: #7a5555; } .result { margin-top: 22px; padding: 18px; border-radius: 10px; text-align: center; font-weight: 500; display: none; line-height: 1.5; } .success { background: #2d3b32; color: #a8d5b5; border: 1px solid #3d5c45; } .error { background: #3b2d2d; color: #e0a0a0; border: 1px solid #5c3d3d; } .info { background: #3b372d; color: #d5c8a8; border: 1px solid #5c543d; } .ended { background: #2a2a2a; color: #999; border: 1px solid #444; } .offer-box { margin-top: 18px; text-align: center; display: none; } .offer-box img { max-width: 100%; border-radius: 10px; border: 2px solid #555; margin-bottom: 14px; box-shadow: 0 6px 15px rgba(0,0,0,0.4); } .eligible-note { font-size: 0.88rem; color: #aaa; margin: 12px 0 6px; font-style: italic; } .matter { font-size: 0.9rem; color: #bbb; margin-top: 10px; line-height: 1.5; } .issue-box { display: none; margin-top: 16px; padding: 14px; background: #2a2a2a; border-radius: 8px; border: 1px solid #555; text-align: left; font-size: 0.9rem; color: #ccc; } .issue-box textarea { width: 100%; height: 80px; margin-top: 8px; padding: 10px; border-radius: 6px; border: 1px solid #555; background: #222; color: #eee; resize: vertical; } .issue-box button { margin-top: 10px; width: auto; padding: 8px 18px; font-size: 0.9rem; } </style> </head> <body> <div class="card"> <div class="header"> <h1>ProgramX</h1> <p>For Eligible Members</p> </div> <div class="content"> <div class="dates"> <div><strong>Offer Starts:</strong> <span id="startDateDisplay"></span></div> <div><strong>Offer Ends:</strong> <span id="endDateDisplay"></span></div> </div> <label for="password">Enter Password</label> <input type="password" id="password" placeholder="Enter secret password" autocomplete="off"> <button class="btn btn-primary" onclick="checkEligibility()">Verify Eligibility</button> <div id="result" class="result"></div> <!-- Offer shown only after successful verification --> <div id="offerBox" class="offer-box"> <img src="offer.png" alt="Special Offer"> <p class="eligible-note">This offer is strictly for eligible members only.</p> <button class="btn btn-success" onclick="applyOffer()">Apply Now</button> <button class="btn btn-issue" onclick="showIssueForm()">Can't Apply? Report Issue</button> <div id="issueBox" class="issue-box"> <strong>Facing problem while applying?</strong> <p style="margin-top:6px; font-size:0.85rem; color:#aaa;"> Describe the issue you are facing. Our support team will help you. </p> <textarea id="issueText" placeholder="Describe your issue here..."></textarea> <button class="btn btn-primary" onclick="submitIssue()">Submit Issue</button> </div> </div> </div> </div>
<script>
    const CORRECT_PASSWORD = "CUbd(t";
    const OFFER_START = new Date("2026-08-30T00:00:00");
    const OFFER_END   = new Date("2026-08-31T23:59:59");
    document.addEventListener('contextmenu', e => e.preventDefault());
    function formatDate(date) {
      return date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    document.getElementById("startDateDisplay").textContent = formatDate(OFFER_START);
    document.getElementById("endDateDisplay").textContent = formatDate(OFFER_END);

    function checkEligibility() {
      const password = document.getElementById("password").value.trim();
      const resultBox = document.getElementById("result");
      const offerBox = document.getElementById("offerBox");
      const issueBox = document.getElementById("issueBox");
      const now = new Date();

      resultBox.className = "result";
      resultBox.style.display = "block";
      offerBox.style.display = "none";
      issueBox.style.display = "none";

      // Offer not started
      if (now < OFFER_START) {
        resultBox.classList.add("info");
        resultBox.innerHTML = `Offer has not started yet.<br>Starts on <strong>${formatDate(OFFER_START)}</strong>`;
        return;
      }

      // Offer ended
      if (now > OFFER_END) {
        resultBox.classList.add("ended");
        resultBox.innerHTML = `<strong>Offer has ended</strong><br>The offer closed on <strong>${formatDate(OFFER_END)}</strong>`;
        return;
      }

      // Empty password
      if (password === "") {
        resultBox.classList.add("error");
        resultBox.textContent = "Enter the password.";
        return;
      }

      // Correct password
      if (password === CORRECT_PASSWORD) {
        resultBox.classList.add("success");
        resultBox.innerHTML = `
          verified..! click Apply Now to claim the offer.<br>
          <strong>1000/2 months</strong> was the fee for this offer.
        `;
        offerBox.style.display = "block";
      } else {
        resultBox.classList.add("error");
        resultBox.innerHTML = `Incorrect password.<br>You are not eligible for this offer.`;
      }
    }

    function applyOffer() {
      alert("We are redirecting you to form");
      window.open('https://forms.gle/NGHx7TJLW8m5KPQd6','_self')
    }

    function showIssueForm() {
      alert("We are redirecting you to form");
      window.open('https://forms.gle/nbLS2uJXTB5dDbkp6','_self')
    }

    function submitIssue() {
      const text = document.getElementById("issueText").value.trim();
      if (text === "") {
        alert("Describe your issue before submitting.");
        return;
      }
      alert("Your issue has been submitted successfully.\nOur support team will get back to you shortly.");
      document.getElementById("issueText").value = "";
      document.getElementById("issueBox").style.display = "none";
    }

    // Enter key support
    document.getElementById("password").addEventListener("keypress", function(e) {
      if (e.key === "Enter") checkEligibility();
    });
  </script>
</body>
</html>
