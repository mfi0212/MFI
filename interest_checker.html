<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSL | Interest Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
	 font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 26px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: blue;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s, transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      background: #f0f7ff;
      border-radius: 10px;
      border-left: 5px solid blue;
      display: none;
    }

    .result h3 {
      color: blue;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .result p {
      margin: 6px 0;
      font-size: 15px;
      color: #333;
    }
    footer {
      font-size: 12px;
      text-align: center;
      color: var(--muted);
      padding: 15px;
      border-top: 1px solid var(--border);
    }
    .result .highlight {
      font-size: 20px;
      font-weight: 700;
      color: blue;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interest Calculator</h1>

    <div class="form-group">
      <input type="number" id="principal" placeholder="Enter lending amount" min="0" step="any">
    </div>

    <div class="form-group">
      <input type="number" id="rate" placeholder="Enter interest rate" min="0" step="0.01">
    </div>

    <button class="btn" onclick="calculateInterest()">
      Calculate Interest
    </button>

    <div class="result" id="result">
      <h3>Result</h3>
      <p>Interest Amount: <span class="highlight" id="interest">0</span></p>
      <p>Total Amount: <span class="highlight" id="total">0</span></p>
    </div>
    <footer>VSL, All right reserved. <br> Version(v.02.22.9)</footer>
  </div>

  <script>
    function calculateInterest() {
      const principal = parseFloat(document.getElementById('principal').value);
      const rate = parseFloat(document.getElementById('rate').value);
      const time = parseFloat(document.getElementById('time').value);
      const type = document.getElementById('type').value;

      if (isNaN(principal) || isNaN(rate) || isNaN(time) || principal <= 0 || rate < 0 || time <= 0) {
        alert("Please enter valid positive numbers for all fields.");
        return;
      }

      let interest, total;

      if (type === "simple") {
        // Simple Interest = (P × R × T) / 100
        interest = (principal * rate * time) / 100;
        total = principal + interest;
      } else {
        // Compound Interest = P × (1 + R/100)^T - P
        total = principal * Math.pow((1 + rate / 100), time);
        interest = total - principal;
      }

      document.getElementById('interest').textContent = interest.toFixed(2);
      document.getElementById('total').textContent = total.toFixed(2);
      document.getElementById('result').style.display = 'block';
    }
  </script>
</body>
</html>
