<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>BsRora - Atdo</title> <link rel="icon" href="https://i.ibb.co/ZpVQQ2Kp/mfi-logo.png" /> <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;900&display=swap" rel="stylesheet"> <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap" rel="stylesheet"> <style> @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap'); * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif;scrollbar-width: none; letter-spacing: 0.3px; } body { font-family: 'Roboto', sans-serif; background: #000000; display: flex; justify-content: center; color: #e0e0e0; scrollbar-width: none; scrollbar-color: gray transparent; height: 100vh; } * { -webkit-tap-highlight-color: transparent; } body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } .chat-container { width: 100%; max-width: 420px; } .header { background: transparent; display: flex; align-items: center; padding: 20px 10px 10px 10px; position: fixed; z-index: 10000; background: #5252524d; backdrop-filter: blur(40px); width: 100%; left: 0; gap: 10px; } .logosection .avatar { width: 65px; height: 65px; font-size: 35px; font-weight: 500; } .avatar { width: 45px; height: 45px; border-radius: 50%; background: #ff8400; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 700; color: black; position: sticky; top: 0px; padding: 20px; } strong { color: #ff8400; } .logosection { display: flex; justify-content: center; align-items: center; gap: 10px; flex-direction: column; } .header-info h1 { font-size: 15px; color: #ffffff; outline: none; display: flex; justify-content: center; align-items: flex-start; gap: 0; flex-direction: column; font-weight: 500; } .chat-messages { overflow-y: auto; padding: 90px 10px 100px 10px; background: transparent; display: flex; flex-direction: column; gap: 15px; } .message { display: flex; max-width: 100%; gap: 8px; } button.back-btn { font-weight: 200; outline: none; border: none; display: flex; justify-content: center; align-items: center; background: transparent; } .bot-message { align-self: flex-start; } .user-message { align-self: flex-end; flex-direction: row-reverse; } .bubble { padding: 10px; border-radius: 10px; font-size: 15px; width: 65%; } .bot-bubble { background: #ffffff1c; color: #e0e0e0; } .user-bubble { background: #0010ff; color: white; width: 100%; } .offer-card { background: #00000073; border-radius: 12px; padding: 10px; border-left: dashed 3px #00b7ff; } .offer-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; } .offer-title { font-size: 15.5px; font-weight: 500; color: #ffffff; } .discount-badge { background: #003322; color: #00ffaa; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; } .offer-description { color: #bbbbbb; font-size: 14px; margin: 10px 0; } .offer-dates { font-size: 13px; color: #888888; margin-top: 8px; } .apply-btn { margin-top: 12px; width: 100%; background: #007acc; color: #000; font-weight: 500; padding: 10px; border: none; border-radius: 6px; cursor: pointer; } .apply-btn:hover { background: #002fff; color: white; } .input-area { padding: 15px 10px 10px 10px; position: fixed; width: 100%; bottom: 0px; } .input-box { display: flex; align-items: center; font-weight: 200; outline: none; border-radius: 99999px; padding: 5px 5px 5px 15px; border: 0.5px solid rgb(255 255 255 / 19%); background: black; width: 100%; max-width: 450px; } .header-info { font-size: 15px; color: #ffffff; font-weight: 200; outline: none; border: none; border-radius: 9999px; height: 45px; display: flex; justify-content: center; align-items: center; padding: 10px; gap: 10px; background: transparent; } #user-input { flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 15.5px; } .send-btn { width: 65px; height: 38px; background: #303030; color: white; border: none; border-radius: 9999px; display: flex; align-items: center; justify-content: center; cursor: pointer; } .hint { text-align: center; font-size: 12px; color: #ffffffd1; margin-top: 10px; font-weight: 400; } </style> </head> <body> <div class="chat-container"> <div class="header"> <button onclick="goBack()" class="back-btn"> <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m294.92-450 206.77 206.77q8.92 8.92 8.81 20.88-.12 11.96-9.42 21.27-9.31 8.69-21.08 9-11.77.31-21.08-9L205.31-454.69q-5.62-5.62-7.92-11.85-2.31-6.23-2.31-13.46t2.31-13.46q2.3-6.23 7.92-11.85l253.61-253.61q8.31-8.31 20.58-8.5 12.27-.19 21.58 8.5 9.3 9.31 9.3 21.38 0 12.08-9.3 21.39L294.92-510H750q12.77 0 21.38 8.62Q780-492.77 780-480t-8.62 21.38Q762.77-450 750-450H294.92Z"/></svg> </button> <div class="logosection"> <div class="header-info"> <div class="logoimg"> <img style="width: 30px;" src="https://assets-v2.lottiefiles.com/a/02fe4bd5-8c88-4351-a78f-353a57ea279a/RWkbfRaeCE.gif" alt=""> </div> <h1>BsRora<br><span style="color: #ff8400;">Atdo</span></h1> </div> </div> <p></p> </div> <div id="chat-messages" class="chat-messages"></div> <div class="input-area"> <div class="input-box"> <input id="user-input" type="password" placeholder="Enter password to unlock offers..." onkeydown="if(event.key === 'Enter') sendMessage()"> <button onclick="sendMessage()" class="send-btn"> Send </button> </div> <div id="hint" class="hint"> Power by BS&MFI </div> </div> </div>
    <script>
        const CORRECT_PASSWORD = "bsrora2026";
       document.addEventListener('contextmenu', e => e.preventDefault());
        const OFFERS = [
            {
                title: "Summer Mega Sale",
                description: "Up to 70% OFF on Electronics, Fashion & Home Appliances",
                startDate: "2026-02-20",
                endDate: "2026-02-22",
                discount: "70% OFF"
            },
            {
                title: "Buy 1 Get 1 Free",
                description: "On all groceries, snacks and daily essentials",
                startDate: "2026-04-01",
                endDate: "2026-05-15",
                discount: "BOGO"
            },
        ];

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        // Check if offer is currently active (today is between start and end date)
        function isOfferActive(offer) {
            const today = new Date();
            const start = new Date(offer.startDate);
            const end = new Date(offer.endDate);

            // Reset time to compare only dates
            today.setHours(0, 0, 0, 0);
            start.setHours(0, 0, 0, 0);
            end.setHours(23, 59, 59, 999);

            return today >= start && today <= end;
        }

        function addMessage(sender, content, isHTML = false) {
            const chat = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = sender === 'bot' ? 'message bot-message' : 'message user-message';

            if (sender === 'bot') {
                div.innerHTML = `
                    <div class="avatar">B</div>
                    <div class="bubble bot-bubble">${isHTML ? content : `<p>${content}</p>`}</div>
                `;
            } else {
                div.innerHTML = `<div class="bubble user-bubble"><p>${content}</p></div>`;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function createOfferCard(offer) {
            return `
                <div class="offer-card">
                    <div class="offer-header">
                        <div class="offer-title">${offer.title}</div>
                        <div class="discount-badge">${offer.discount}</div>
                    </div>
                    <div class="offer-description">${offer.description}</div>
                    <div class="offer-dates">
                        Start: ${formatDate(offer.startDate)} &nbsp; | &nbsp; End: ${formatDate(offer.endDate)}
                    </div>
                    <button onclick="applyOffer('${offer.title}')" class="apply-btn">Apply Now</button>
                </div>
            `;
        }

        function applyOffer(title) {
            alert(`✅ You successfully applied for: "${title}"`);
        }

        function showOffers() {
            const activeOffers = OFFERS.filter(isOfferActive);

            addMessage('bot', '✅ Password verified!<br>Here are the currently active offers:', true);

            if (activeOffers.length === 0) {
                addMessage('bot', '😕 No active offers right now.<br>Please check back later!', true);
                return;
            }

            let offersHTML = activeOffers.map(offer => createOfferCard(offer)).join('');

            const chat = document.getElementById('chat-messages');
            const offerDiv = document.createElement('div');
            offerDiv.className = 'message bot-message';
            offerDiv.innerHTML = `
                <div class="avatar">B</div>
                <div class="bubble bot-bubble">${offersHTML}</div>
            `;
            chat.appendChild(offerDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        let isVerified = false;

        function sendMessage() {
            const input = document.getElementById('user-input');
            const value = input.value.trim();
            if (!value) return;

            if (!isVerified) {
                addMessage('user', '••••••••••');

                setTimeout(() => {
                    if (value === CORRECT_PASSWORD) {
                        isVerified = true;
                        addMessage('bot', '🔓 Access Granted!<br>Welcome to BsRora!', true);

                        input.type = 'text';
                        input.placeholder = 'Type a message...';
                        document.getElementById('hint').innerHTML = '<span>✅ Verified • Full access unlocked</span>';

                        setTimeout(showOffers, 700);
                    } else {
                        addMessage('bot', '❌ Incorrect password. Try again.', true);
                    }
                }, 600);
            } else {
                addMessage('user', value);
                setTimeout(() => addMessage('bot', 'Here are the currently active offers 👆', true), 400);
            }

            input.value = '';
        }

        window.onload = () => {
            addMessage('bot', `
                Hello! 👋<br><br>
                I am <strong>BsRora</strong>.<br>
                Enter the password to view currently active offers.
            `, true);

            document.getElementById('user-input').focus();
        }; function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        alert(" Back button clicked!\n\n(In a real app this would take you to previous screen or home.)");
      }
    }
    </script>
</body>
</html>
