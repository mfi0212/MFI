31-74.93q-10.23-10.84-15.46-23.99Q85-466.54 85-480t5.23-26.62q5.23-13.15 15.46-23.99L180-605.54v-102.15q0-29.92 21.19-51.12Q222.39-780 252.31-780h102.15l74.93-74.31q10.84-10.23 23.99-15.46Q466.54-875 480-875t26.62 5.23q13.15 5.23 23.99 15.46L605.54-780h102.15q29.92 0 51.12 21.19Q780-737.61 780-707.69v102.15l74.31 74.93q10.23 10.84 15.46 23.99Q875-493.46 875-480t-5.23 26.62q-5.23 13.15-15.46 23.99L780-354.46v102.15q0 29.92-21.19 51.12Q737.61-180 707.69-180H605.54l-74.93 74.31q-10.84 10.23-23.99 15.46Q493.46-85 480-85t-26.62-5.23q-13.15-5.23-23.99-15.46L354.46-180ZM380-240l91.15 91.15q3.46 3.46 8.85 3.46t8.85-3.46L580-240h127.69q5.39 0 8.85-3.46t3.46-8.85V-380l91.15-91.15q3.46-3.46 3.46-8.85t-3.46-8.85L720-580v-127.69q0-5.39-3.46-8.85t-8.85-3.46H580l-91.15-91.15q-3.46-3.46-8.85-3.46t-8.85 3.46L380-720H252.31q-5.39 0-8.85 3.46t-3.46 8.85V-580l-91.15 91.15q-3.46 3.46-3.46 8.85t3.46 8.85L240-380v127.69q0 5.39 3.46 8.85t8.85 3.46H380Zm100-240Z"/></svg> </button> </header> <div class="chat-container" id="chat"></div> <div class="input-area"> <input type="text" id="userInput" placeholder="Your message..." autocomplete="off"> <button onclick="sendMessage()"> <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-647 244-451q-12 12-28 11.5T188-452q-11-12-11.5-28t11.5-28l264-264q6-6 13-8.5t15-2.5q8 0 15 2.5t13 8.5l264 264q11 11 11 27.5T772-452q-12 12-28.5 12T715-452L520-647v447q0 17-11.5 28.5T480-160q-17 0-28.5-11.5T440-200v-447Z"/></svg> </button> </div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
document.addEventListener('contextmenu', e => e.preventDefault());
let currentStep = 'welcome';
let userData = {};
const usersDB = {
  "Mahesh888*": {
    name: "Mahesh Muthinti",
    active: ["Both"]
  },
};

function addMessage(text, type, name = "") {
  const wrapper = document.createElement('div');
  wrapper.className = `message-wrapper ${type}-wrapper`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${type}-avatar`;
  avatar.textContent = type === 'bot' ? '🤖' : (name ? name[0].toUpperCase() : '?');

  const bubble = document.createElement('div');
  bubble.className = `message ${type}`;
  bubble.innerHTML = text;

  if (type === 'bot') {
    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
  } else {
    wrapper.appendChild(bubble);
    wrapper.appendChild(avatar);
  }

  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;
}

function showActiveList() {
  const list = userData.active || [];
  
  if (list.length === 0) {
    addMessage("You currently have <b>no active services</b>.", 'bot');
    return;
  }

  let html = `<div class="active-list"><b>Active List</b><br>`;
  list.forEach((service, index) => {
    html += `${index + 1}. ${service}<br>`;
  });
  html += `</div>`;
  
  addMessage(html, 'bot');
  
  setTimeout(() => {
    addMessage(
      `Commands you can use:<br><br>
      <b>/stop</b> to Pause<br>
      <b>/start</b> to Resume <br>`, 
      'bot'
    );
  }, 600);
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'user', userData.name || '');
  input.value = '';
  processUserInput(text);
}

function processUserInput(text) {
  // ===== PASSWORD STEP =====
  if (currentStep === 'password') {
    const user = usersDB[text];
    
    if (user) {
      userData.name = user.name;
      userData.password = text;
      userData.active = [...user.active]; // copy
      userData.service = "";
      
      addMessage(`✔️ Verified! Welcome, <b>${user.name}</b>`, 'bot');
      
      setTimeout(() => {
        showActiveList();
        currentStep = 'command';
      }, 800);
    } else {
      addMessage("❌ Invalid password. Try again.", 'bot');
    }
    return;
  }

  // ===== COMMAND STEP (after login) =====
  if (currentStep === 'command') {
    handleCommand(text);
  }
}

function handleCommand(text) {
  const lower = text.toLowerCase().trim();
  let action = null;  
  let serviceName = null;

  const payMatch = text.match(/^\/pay#(.+?)Fee$/i);
  if (payMatch) {
    const feeInfo = payMatch[1].trim();
    userData.service = `PAY#${feeInfo}Fee`;
    
    addMessage(
      `💳 Received pay request for <b>#${feeInfo}Fee</b>.<br><br>` +
      `We will try to pay the fee. If it’s not possible, we will reach out to you or your coordinator.`,
      'bot'
    );
    
    setTimeout(submitData, 900);
    return;
  }

  // ===== EXISTING STOP / START LOGIC =====
  const match1 = lower.match(/^(\d+)\s*\/\s*(stop|start)$/);
  const match2 = lower.match(/^([a-zA-Z0-9\s]+)\s*\/\s*(stop|start)$/);
  const match3 = lower.match(/^\/(stop|start)$/);
  const match4 = lower.match(/^(stop|start)\s+(.+)$/);

  if (match1) {
    const index = parseInt(match1[1]) - 1;
    action = match1[2];
    if (userData.active[index]) {
      serviceName = userData.active[index];
    }
  } 
  else if (match2) {
    serviceName = match2[1].trim();
    action = match2[2];
  } 
  else if (match3) {
    action = match3[1];
    serviceName = userData.active[0] || null;
  } 
  else if (match4) {
    action = match4[1];
    serviceName = match4[2].trim();
  }

  // Validate
  if (!action || !serviceName) {
    addMessage("❌ Invalid command.<br>Examples:<br>• <b>1/stop</b><br>• <b>Solutions/stop</b><br>• <b>/stop</b><br>• <b>/start</b>", 'bot');
    return;
  }

  // Check if service exists in user's active list (case insensitive)
  const found = userData.active.find(s => s.toLowerCase() === serviceName.toLowerCase());
  
  if (!found) {
    addMessage(`❌ Service "<b>${serviceName}</b>" not found in your active list.`, 'bot');
    return;
  }

  // Save action
  userData.service = `${found}/${action}`;
  
  // Feedback
  if (action === 'stop') {
    addMessage(`⏸️ <b>${found}</b> has been <b>PAUSED</b>.<br>Auto apply & pay fee will be stopped.`, 'bot');
  } else {
    addMessage(`▶️ <b>${found}</b> has been <b>RESUMED</b>.<br>Auto apply & pay fee is now active again.`, 'bot');
  }

  // Submit to Google Sheet
  setTimeout(submitData, 900);
}

function submitData() {
  addMessage("✅ Submitting your request...", 'bot');

  const formData = new URLSearchParams({
    Name: userData.name || '',
    Password: userData.password || '',
    PhoneNumber: userData.phone || '',
    Service: userData.service || '',
    Amount: userData.amount || userData.amountSplit || '',
    Days: userData.days || '',
    OfferID: userData.offerId || '',
    Timestamp: new Date().toLocaleString('en-IN', {timeZone:'Asia/Kolkata'})
  });

  fetch("https://script.google.com/macros/s/AKfycbxIlao67g-XSHBVoSvYzofopgSa7_7_l9qstp4SxrdqMWCutnasBtQjdLn_aUWdsZvShw/exec", {
    method: "POST",
    body: formData,
  })
  .then(() => {
    addMessage(`🎉 Request submitted successfully!<br>Thank you, <b>${userData.name}</b>!`, 'bot');
    
    // Keep the session alive so user can send more commands
    setTimeout(() => {
      addMessage("You can continue managing your services. Type another command anytime.", 'bot');
    }, 1500);
  })
  .catch(() => {
    addMessage("❌ Submission failed. Try again.", 'bot');
  });
}

function startChat() {
  addMessage("👋 Hello! I am <b>BotPay</b><br><br>From BsRora.", 'bot');
  setTimeout(() => {
    addMessage("Enter your password to continue", 'bot');
    currentStep = 'password';
  }, 700);
}

window.onload = startChat;

input.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});

function goBack() {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    alert("Back button clicked!\n\n(In a real app this would take you to previous screen or home.)");
  }
}
</script>
