s: 5px; border-left: 3px solid #5181b8; margin: 5px; } .profile-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.25); } .profile-card .name { font-weight: 600; font-size: 15px; } .profile-card .sub { font-size: 12px; opacity: 0.8; margin-top: 2px; } </style> </head> <body> <div class="chat-container"> <div class="header"> <div class="header-avatar"> <svg style="width: 30px; height: 30px; fill: white;" id="Layer_1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" data-name="Layer 1"><path d="m.439 17.561c-.586-.585-.586-1.536 0-2.121l10.421-10.421c-1.816-1.422-3.861-2.331-6.008-2.839-.495-.117-.856-.542-.863-1.051-.009-.635.527-1.132 1.162-1.102 3.335.154 6.11.984 8.195 2.506.572-.662 1.594-.72 2.215-.094.627.621.568 1.643-.094 2.215 1.523 2.085 2.353 4.86 2.506 8.195.029.635-.467 1.171-1.103 1.163-.509-.007-.933-.368-1.05-.863-.508-2.147-1.417-4.193-2.839-6.008l-10.42 10.42c-.586.586-1.535.586-2.121 0zm22.061-17.561c-.828 0-1.5.671-1.5 1.5v11.171c0 .134-.052.259-.146.354l-1.828 1.828c-.661.661-1.025 1.54-1.025 2.475v1.171c0 .276-.225.5-.5.5h-2.172c-.935 0-1.813.364-2.475 1.025l-.828.828c-.094.093-.222.146-.354.146h-10.172c-.828 0-1.5.671-1.5 1.5s.672 1.5 1.5 1.5h10.172c.935 0 1.813-.364 2.475-1.025l.828-.828c.094-.093.222-.146.354-.146h2.172c1.93 0 3.5-1.57 3.5-3.5v-1.171c0-.134.052-.259.146-.354l1.828-1.828c.661-.661 1.025-1.54 1.025-2.475v-11.171c0-.829-.672-1.5-1.5-1.5zm-12.256 14.111-1.376.609c-.528.234-.868.756-.868 1.334v.695c0 .488.244.943.649 1.213l1.19.793c.62.413 1.452.293 1.929-.28l.894-1.072c.419-.503.452-1.223.08-1.762l-.708-1.025c-.398-.576-1.149-.788-1.79-.505z"/></svg> </div> <div class="bot-name">BsMining Bot</div> <div class="point_earner" id="pointEarner" title="Point Earner"> <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M160-240q-50 0-85-35t-35-85v-240q0-50 35-85t85-35h562l-64 80H160q-17 0-28.5 11.5T120-600 <script>
  document.addEventListener('contextmenu', e => e.preventDefault());
  const passwords = {
    "test": {
      name: "test",
      profilePic: "test"
    },
  };

  // Multiple passwords supported
  const POINT_EARNER_PASSWORDS = [
    "Mahesh888*",
    "test",
  ];
  const POINT_EARNER_URL = "https://mfi0212.github.io/MFI/point_earner";

  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const pointEarner = document.getElementById('pointEarner');
  let currentUser = null;
  let step = 'password';
  let typingInterval;

  function getTime() {
    const now = new Date();
    return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  }

  function createAvatar(type) {
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    if (type === 'bot') {
      avatar.innerHTML = `<img src="https://cdn.prod.website-files.com/6257adef93867e50d84d30e2/670cd7c3577a0eeb27ea90ca_Clyde_Clippboard%202.webp" alt="Bot">`;
    } else {
      const pic = currentUser && currentUser.profilePic
        ? currentUser.profilePic
        : "https://i.pravatar.cc/150?img=12";
      avatar.innerHTML = `<img src="${pic}" alt="User">`;
    }
    return avatar;
  }

  function addMessage(text, type = 'bot') {
    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper ${type}-message ${type}`;
    const avatar = createAvatar(type);
    const msg = document.createElement('div');
    msg.className = 'message';
    msg.innerHTML = text;
    const time = document.createElement('div');
    time.className = 'timestamp';
    time.innerHTML = `${getTime()} ${type === 'user' ? '<span class="check">✓</span>' : ''}`;
    msg.appendChild(time);
    wrapper.appendChild(avatar);
    wrapper.appendChild(msg);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
    return wrapper;
  }

  function showTyping(delay = 1500, callback) {
    const wrapper = addMessage('<em>Analyzing</em>', 'bot');
    const textEl = wrapper.querySelector('em');
    let dots = 0;
    typingInterval = setInterval(() => {
      dots = (dots + 1) % 4;
      textEl.textContent = 'Analyzing' + '.'.repeat(dots);
    }, 400);
    setTimeout(() => {
      clearInterval(typingInterval);
      chatBox.removeChild(wrapper);
      if (callback) callback();
    }, delay);
  }

  function startBot() {
    addMessage("Welcome to <strong>BsMining Bot</strong>!<br>Enter your password to continue.");
    step = 'password';
  }

  function processInput(input) {
    // ==== PASSWORD STEP ====
    if (step === 'password') {
      const user = passwords[input.trim()];
      if (user) {
        currentUser = { ...user, password: input.trim() };
        showTyping(1200, () => {
          addMessage(`
            <div class="profile-card">
              <img src="${user.profilePic}" alt="${user.name}">
              <div>
                <div class="name">${user.name}</div>
                <div class="sub">Account verified ✓</div>
              </div>
            </div>
            Type <strong>/minepoints</strong> to start mining.
          `);
          step = 'mine';
        });
      } else {
        addMessage("Invalid password. Please try again.");
      }
    }
    // ==== MINE POINTS STEP ====
    else if (step === 'mine') {
      if (input.trim().toLowerCase() === '/minepoints') {
        showTyping(1800, () => {
          addMessage(`
            <div class="details">
              <strong>Mining started!</strong><br><br>
              <strong style="color:#5b8fd1;">25 points</strong> will be automatically added to your account daily until your Mining Bot subcription ends.
            </div>
          `);
          userInput.disabled = true;
          userInput.placeholder = "Mining is in process..!";
          sendBtn.disabled = true;
          step = 'done';
        });
      } else {
        addMessage("Please type <strong>/minepoints</strong> to start mining.");
      }
    }
  }

  function sendMessage() {
    const input = userInput.value.trim();
    if (!input || step === 'done') return;
    addMessage(input, 'user');
    userInput.value = '';
    setTimeout(() => processInput(input), 400);
  }

  // Point Earner click handler (now supports multiple passwords)
  pointEarner.addEventListener('click', () => {
    const entered = prompt("Enter Point Earner password:");
    if (entered === null) return; // user cancelled
    if (POINT_EARNER_PASSWORDS.includes(entered.trim())) {
      window.location.href = POINT_EARNER_URL;
    } else {
      alert("Incorrect password!");
    }
  });

  sendBtn.onclick = sendMessage;
  userInput.addEventListener('keypress', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  window.onload = () => setTimeout(startBot, 600);
</script>
