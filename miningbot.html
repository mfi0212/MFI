<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <title>BsMining Bot</title> <link rel="icon" href="https://i.ibb.co/ZpVQQ2Kp/mfi-logo.png" /> <style> @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap'); * { -webkit-tap-highlight-color: transparent; font-family: 'Poppins', sans-serif; scrollbar-width: none; } body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } * { margin: 0; padding: 0; box-sizing: border-box; } body { background: #0b141a; color: #eaecef; display: flex; justify-content: center; align-items: center; } ::-webkit-scrollbar { background-color: transparent; } .chat-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; } .header { background: #1e2a30; padding: 5px; display: flex; align-items: center; color: #fff; justify-content: space-between; margin: 10px 10px 2px 10px; border-radius: 999px; position: sticky; top: 0px; } .header-avatar { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; } .header-avatar img { width: 100%; height: 100%; object-fit: cover; } .bot-name { font-weight: 500; font-size: 17px; } .bot-status { font-size: 12px; opacity: 0.85; } .point_earner { cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 50%; transition: background 0.2s ease; } .point_earner:hover { background: rgba(255,255,255,0.1); } .chat-box { flex: 1; overflow-y: auto; background: #0b141a; background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 20px 20px; scroll-behavior: smooth; scrollbar-width: none; } .message-wrapper { display: flex; margin: 10px 0; max-width: 85%; animation: fadeIn 0.3s ease; } @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } } .bot-message { align-self: flex-start; } .user-message { align-self: flex-end; margin-left: auto; flex-direction: row-reverse; } .message { background: #1f2c34; padding: 10px; border-radius: 15px; font-size: 14.5px; line-height: 1.5; position: relative; max-width: calc(100% - 50px); color: #e4e6eb; box-shadow: 0 2px 6px rgba(0,0,0,0.2); } .user .message { background: linear-gradient(135deg, #2b5278, #265b91); color: #fff; } .msg-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; margin: 0 8px; border: 2px solid rgba(255,255,255,0.1); } .msg-avatar img { width: 100%; height: 100%; object-fit: cover; } .message::after { content: ''; position: absolute; bottom: 0; width: 0; height: 0; border: 6px solid transparent; } .timestamp { font-size: 11px; color: #8696a0; margin-top: 4px; text-align: right; opacity: 0.9; } .check { font-size: 13px; margin-left: 5px; color: #53bdeb; } .typing { background: #1f2c34; color: #8696a0; font-style: italic; padding: 10px 14px; border-radius: 16px; } .input-area { padding: 5px; background: #1e2a30; display: flex; align-items: center; border-radius: 9999px; position: fixed; bottom: 10px; width: 95%; left: 50%; transform: translate(-50%, 0); } input { flex: 1; background: transparent; color: #e1e8ed; border: none; border-radius: 25px; padding: 10px 15px; font-size: 16px; outline: none; transition: background 0.2s ease; } button { background: #5b8fd1; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; margin-left: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background 0.2s ease, transform 0.1s ease; } .details { background: rgba(82,130,184,0.1); padding: 12px; border-radius: 14px; margin: 8px 0; font-size: 13.5px; border-left: 3px solid #5181b8; } .profile-card { display: flex; align-items: center; gap: 10px; background: rgba(82, 130, 184, 0.12); padding: 5px; border-radius: 5px; border-left: 3px solid #5181b8; margin: 5px; } .profile-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.25); } .profile-card .name { font-weight: 600; font-size: 15px; } .profile-card .sub { font-size: 12px; opacity: 0.8; margin-top: 2px; } </style> </head> <body> <div class="chat-container"> <div class="header"> <div class="header-avatar"> <img src="https://i.ibb.co/ZpVQQ2Kp/mfi-logo.png" alt="Bot Logo"> </div> <div class="bot-name">BsMining Bot</div> <div class="point_earner" id="pointEarner" title="Point Earner"> <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M160-240q-50 0-85-35t-35-85v-240q0-50 35-85t85-35h562l-64 80H160q-17 0-28.5 11.5T120-600v240q0 17 11.5 28.5T160-320h473l-15 80H160Zm-40-80v-320 320Zm587 40 28-160H600l192-240h21l-28 160h135L728-280h-21Z"/></svg> </div> </div> <div class="chat-box" id="chatBox"></div> <div class="input-area"> <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" /> <button id="sendBtn">➤</button> </div> </div>
<script>
  document.addEventListener('contextmenu', e => e.preventDefault());
  const passwords = {
    "Mahesh888*": {
      name: "Mahesh Muthinti",
      profilePic: "https://scontent.cdninstagram.com/v/t51.82787-19/642495604_17887226331444332_1232247345547574682_n.jpg?_nc_cat=110&cb=8438d1d6-3bb4fc30&ccb=7-5&_nc_sid=bf7eb4&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0%3D&_nc_ohc=Is_CasjPcHEQ7kNvwFnXQrT&_nc_oc=AdrZ-EqugmR7RZStVGa-qgzunQO3QJ8CsQoJV3lcWIHVvtxP5UZl5lPCcMLBODgguD4&_nc_zt=24&_nc_ht=scontent.cdninstagram.com&_nc_gid=CCsse_8LWNsbTnQaNTCJhw&_nc_ss=7baaf&oh=00_AQHF56fwq7jFFDEU_CCjzgZvCwIbygnBU4OTPtXV60CZBg&oe=6A7377EE"
    },
  };

  // Multiple passwords supported
  const POINT_EARNER_PASSWORDS = [
    "cord#0212",
    "Mahesh888*",
  ];
  const POINT_EARNER_URL = "https://mfi0212.github.io/MFI/point_earner";

  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const pointEarner = document.getElementById('pointEarner');
  let currentUser = null;
  let step = 'password';
  let typingInterval;

  function getTime() {
    const now = new Date();
    return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  }

  function createAvatar(type) {
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    if (type === 'bot') {
      avatar.innerHTML = `<img src="https://cdn.prod.website-files.com/6257adef93867e50d84d30e2/670cd7c3577a0eeb27ea90ca_Clyde_Clippboard%202.webp" alt="Bot">`;
    } else {
      const pic = currentUser && currentUser.profilePic
        ? currentUser.profilePic
        : "https://i.pravatar.cc/150?img=12";
      avatar.innerHTML = `<img src="${pic}" alt="User">`;
    }
    return avatar;
  }

  function addMessage(text, type = 'bot') {
    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper ${type}-message ${type}`;
    const avatar = createAvatar(type);
    const msg = document.createElement('div');
    msg.className = 'message';
    msg.innerHTML = text;
    const time = document.createElement('div');
    time.className = 'timestamp';
    time.innerHTML = `${getTime()} ${type === 'user' ? '<span class="check">✓</span>' : ''}`;
    msg.appendChild(time);
    wrapper.appendChild(avatar);
    wrapper.appendChild(msg);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
    return wrapper;
  }

  function showTyping(delay = 1500, callback) {
    const wrapper = addMessage('<em>Analyzing</em>', 'bot');
    const textEl = wrapper.querySelector('em');
    let dots = 0;
    typingInterval = setInterval(() => {
      dots = (dots + 1) % 4;
      textEl.textContent = 'Analyzing' + '.'.repeat(dots);
    }, 400);
    setTimeout(() => {
      clearInterval(typingInterval);
      chatBox.removeChild(wrapper);
      if (callback) callback();
    }, delay);
  }

  function startBot() {
    addMessage("Welcome to <strong>BsMining Bot</strong>!<br>Enter your password to continue.");
    step = 'password';
  }

  function processInput(input) {
    // ==== PASSWORD STEP ====
    if (step === 'password') {
      const user = passwords[input.trim()];
      if (user) {
        currentUser = { ...user, password: input.trim() };
        showTyping(1200, () => {
          addMessage(`
            <div class="profile-card">
              <img src="${user.profilePic}" alt="${user.name}">
              <div>
                <div class="name">${user.name}</div>
                <div class="sub">Account verified ✓</div>
              </div>
            </div>
            Type <strong>/minepoints</strong> to start mining.
          `);
          step = 'mine';
        });
      } else {
        addMessage("Invalid password. Please try again.");
      }
    }
    // ==== MINE POINTS STEP ====
    else if (step === 'mine') {
      if (input.trim().toLowerCase() === '/minepoints') {
        showTyping(1800, () => {
          addMessage(`
            <div class="details">
              <strong>Mining started!</strong><br><br>
              <strong style="color:#5b8fd1;">25 points</strong> will be automatically added to your account daily until your Mining Bot subcription ends.
            </div>
          `);
          userInput.disabled = true;
          userInput.placeholder = "Mining is in process..!";
          sendBtn.disabled = true;
          step = 'done';
        });
      } else {
        addMessage("Please type <strong>/minepoints</strong> to start mining.");
      }
    }
  }

  function sendMessage() {
    const input = userInput.value.trim();
    if (!input || step === 'done') return;
    addMessage(input, 'user');
    userInput.value = '';
    setTimeout(() => processInput(input), 400);
  }

  // Point Earner click handler (now supports multiple passwords)
  pointEarner.addEventListener('click', () => {
    const entered = prompt("Enter Point Earner password:");
    if (entered === null) return; // user cancelled
    if (POINT_EARNER_PASSWORDS.includes(entered.trim())) {
      window.location.href = POINT_EARNER_URL;
    } else {
      alert("Incorrect password!");
    }
  });

  sendBtn.onclick = sendMessage;
  userInput.addEventListener('keypress', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  window.onload = () => setTimeout(startBot, 600);
</script>
