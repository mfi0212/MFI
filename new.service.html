<!DOCTYPE html> <html lang="en" data-theme="light"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>BS&MFI Services</title> <link rel="icon" href="mfi.logo.png"> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"> <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@100..900&display=swap" rel="stylesheet"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> <style> * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; } * { -webkit-tap-highlight-color: transparent; } body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; font-family: 'Inter', system-ui, -apple-system, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background 0.25s ease, color 0.25s ease; } /* ================= THEMES ================= */ /* Light (default) */ [data-theme="light"] { --bg: #ffffff; --bg-secondary: #f8fafc; --bg-card: #eeeeee; --border: #f1f5f9; --border-hover: #dbeafe; --text: #0f172a; --text-secondary: #64748b; --text-muted: #94a3b8; --accent: #0025ff; --accent-hover: #001fd1; --topbar-bg: #ffffff; --chip-bg: #f8fafc; --scrollbar: #8e8e93; --chip-border: #e2e8f0; --chip-text: #334155; --footer-border: #f1f5f9; } /* Black Dark */ [data-theme="dark"] { --bg: black; --bg-secondary: #111111; --bg-card: #161616; --border: #222222; --border-hover: #333333; --text: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #999999; --accent: #0025ff; --scrollbar: #636366; --accent-hover: #001fd1; --topbar-bg: #0a0a0a; --chip-bg: #1a1a1a; --chip-border: #2a2a2a; --chip-text: #e2e8f0; --footer-border: #1f1f1f; } /* Telegram Theme */ [data-theme="telegram"] { --bg: #0e1621; --bg-secondary: #17212b; --bg-card: #17212b; --border: #242f3d; --border-hover: #2b5278; --text: #f5f5f5; --text-secondary: #8b9bb4; --text-muted: #6d7f96; --accent: #2aabee; --scrollbar: #52677a; --accent-hover: #229ed9; --topbar-bg: #17212b; --chip-bg: #242f3d; --chip-border: #2b5278; --chip-text: #e4ecf2; --footer-border: #1c2733; } a, button, input{ transition: all 0.3s ease-in-out; } a:hover, button:hover, input:hover{ transform: scale(1.05); } a:active, button:active, input:active{ transform: scale(0.95); } body { background: var(--bg); color: var(--text); } /* Top Bar */ .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5px; position: sticky; top: 0; background: linear-gradient(180deg, var(--bg), transparent); z-index: 50; } .brand { font-size: 22px; font-weight: 700; color: var(--accent); } .theme-switcher { background: var(--bg-card); display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(3px); border-radius: 999px; height: 45px; width: fit-content; padding: 0 13px; gap: 15px; box-shadow: 0 0 0.5px 0 black; border-top: solid 1px #ffffff1f; border-bottom: solid 1px #ffffff1f; } .theme-btn { border: none; background: transparent; color: var(--text-secondary); cursor: pointer; display: flex;transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); align-items: center; justify-content: center; font-size: 17px; transition: all 0.2s ease; } .theme-btn:hover { color: var(--border); } .theme-btn.active { color: var(--accent); } /* Buttons */ .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px; font-size: 17px; border-radius: 9999px; border: none;transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; text-decoration: none; font-family: inherit; transition: all 0.2s ease; border-top: solid 1px #ffffff4f; border-bottom: solid 1px #ffffff4f; } .btn-primary { background: var(--accent); color: #ffffff; } .btn-primary:hover { background: var(--accent-hover); } /* Main */ .container { max-width: 900px; margin: 0 auto; padding: 10px 5px; } /* Hero */ .hero { text-align: center; margin-bottom: 40px; } .hero img { width: 140px; border-radius: 28px; margin-bottom: 12px; } .hero h1 { font-size: 1.9rem; font-weight: 600; letter-spacing: -0.5px; color: var(--text); margin-bottom: 6px; font-family: "Hahmlet", serif; } .hero p { font-size: 1.05rem; color: var(--text-secondary); } /* Quick Actions */ .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 48px; } .action-card { background: var(--bg-card); border-radius: 25px; padding: 15px; text-align: center; text-decoration: none; color: inherit; cursor: pointer; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); } .action-card:hover{ transform: scale(1.03); } .action-card:active { transform: scale(0.92); } .action-card .icon { font-size: 1.45rem; color: var(--accent); } .action-card h3 { font-size: 0.95rem; font-weight: 600; color: var(--text); margin-bottom: 4px; } .action-card p { font-size: 0.8rem; color: var(--text-muted); } .icon svg { fill: var(--accent); width: 27px; height: 27px; } .section-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 16px; letter-spacing: -0.2px; text-align: center; } /* Solutions */ .solutions { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; } .solution-card { background: var(--bg-card); border-radius: 25px; padding: 15px; display: flex; flex-direction: column; text-align: center; } .solution-card h3 { font-size: 0.95rem; font-weight: 600; color: var(--text); margin-bottom: 6px; } .solution-card p { font-size: 0.85rem; color: var(--text-secondary); flex: 1; margin-bottom: 16px; } /* Plans */ .plans-header { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 16px; letter-spacing: -0.2px; } .plans-header a { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 0.95rem; } .plans-header a:hover { text-decoration: underline; } .sponsors { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; } .sponsor-chip { background: var(--chip-bg); border-radius: 99999px; padding: 10px; font-size: 25px; font-weight: 500; color: var(--chip-text); text-decoration: none; text-align: center; transition: border-color 0.2s ease; } .plan-note { margin-top: 12px; font-size: 0.85rem; color: var(--text-muted); text-align: center; } footer { text-align: center; padding: 18px; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--footer-border); } /* ===== Modal ===== */ .modal-overlay { position: fixed; inset: 0; background: rgb(0 0 0 / 71%); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease; } .modal-overlay.active { opacity: 1; visibility: visible; } .modal { background: var(--bg-card); border-radius: 25px; width: 95%; max-width: 450px; padding: 15px; transform: translateY(20px) scale(0.96); transition: transform 0.25s ease; } .modal-overlay.active .modal { transform: translateY(0); } .modal-header { text-align: center; margin-bottom: 10px; } .modal-header h3 { font-size: 1.15rem; font-weight: 600; color: var(--text); margin-bottom: 4px; } .modal-header p { font-size: 0.85rem; color: var(--text-muted); } .modal-options { display: flex; flex-direction: column; gap: 10px; } .modal-option { display: flex; align-items: center; gap: 14px; padding: 10px; background: var(--bg-card); border-radius: 15px; text-decoration: none; color: inherit;transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); transition: background 0.2s ease, transform 0.15s ease; } .modal-option:hover{ background: var(--bg); } .modal-option .opt-icon { width: 45px; height: 45px; border-radius: 50%; background: #74747473; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; } .modal-option .opt-text h4 { font-size: 0.95rem; font-weight: 600; color: var(--text); margin-bottom: 2px; } .modal-option .opt-text p { font-size: 0.78rem; color: var(--text-muted); } .modal-close { margin-top: 10px; width: 100%; padding: 11px; border: none; border-radius: 999px; font-size: 16px; font-family: inherit;transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer;border-top: solid 1px #ffffff4f; border-bottom: solid 1px #ffffff4f; background: var(--accent); color: #ffffff; } .modal-close:hover { color: var(--text); } /* Mobile */ @media (max-width: 600px) { .hero h1 { font-size: 1.65rem; } .actions { grid-template-columns: 1fr 1fr; } } </style> </head> <body> <!-- ===== BS&MFI Loading Screen (iOS Style) ===== --> <div id="bsmfi-loader" style=" position: fixed; inset: 0; background: rgb(0, 0, 72); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; overflow: hidden; "> <!-- Logo / Image --> <img id="loader-image" src="enterencemfilogo.png" alt="BS&MFI" style=" width: 165px; object-fit: cover; opacity: 1; transform: scale(1); transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), transform 0.9s cubic-bezier(0.4, 0, 0.2, 1); " > <!-- Welcome Message (hidden at start) --> <div id="welcome-text" style=" position: absolute; color: #f5f5f7; font-size: 1.65rem; font-weight: 600; letter-spacing: -0.3px; text-align: center; opacity: 0; transform: translateY(18px) scale(0.96); transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1); padding: 0 24px; "> <h5 style="color: rgba(255, 255, 255, 0.655);font-size: 15px;">Powered by</h5> <span style="color: white;">BS&amp;MFI House</span> </div> </div>
<script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    // ===== Theme Switcher =====
    const themeButtons = document.querySelectorAll('.theme-btn');
    const html = document.documentElement;

    const savedTheme = localStorage.getItem('bsmfi-theme') || 'light';
    setTheme(savedTheme);

    themeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const theme = btn.dataset.theme;
        setTheme(theme);
        localStorage.setItem('bsmfi-theme', theme);
      });
    });

    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      themeButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
    }

    // ===== Account Modal =====
    const accountBtn = document.getElementById('accountBtn');
    const accountModal = document.getElementById('accountModal');
    const closeAccountModal = document.getElementById('closeAccountModal');

    accountBtn.addEventListener('click', () => {
      accountModal.classList.add('active');
    });

    closeAccountModal.addEventListener('click', () => {
      accountModal.classList.remove('active');
    });

    accountModal.addEventListener('click', (e) => {
      if (e.target === accountModal) {
        accountModal.classList.remove('active');
      }
    });

    // ===== Solutions Modal =====
    const solutionBtn = document.getElementById('solutionBtn');
    const solutionModal = document.getElementById('solutionModal');
    const closeSolutionModal = document.getElementById('closeSolutionModal');

    solutionBtn.addEventListener('click', () => {
      solutionModal.classList.add('active');
    });

    closeSolutionModal.addEventListener('click', () => {
      solutionModal.classList.remove('active');
    });

    solutionModal.addEventListener('click', (e) => {
      if (e.target === solutionModal) {
        solutionModal.classList.remove('active');
      }
    });

    // Close any open modal with Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        accountModal.classList.remove('active');
        solutionModal.classList.remove('active');
      }
    });
  </script>
</body>
</html>
