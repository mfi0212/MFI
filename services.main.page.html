document.addEventListener('contextmenu', e => e.preventDefault());
let pinnedSites = JSON.parse(localStorage.getItem('pinnedBSMFI')) || [];
let currentView = 'all';

function getColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 75%, 58%)`;
}

function getInitial(name) {
  return name.trim()[0]?.toUpperCase() || "?";
}

function isPinned(name) {
  return pinnedSites.some(p => p.name === name);
}

function togglePin(site) {
  if (isPinned(site.name)) {
    pinnedSites = pinnedSites.filter(p => p.name !== site.name);
    showToast('info', 'Unpinned', site.name + ' removed from pinned');
  } else {
    pinnedSites.push(site);
    showToast('success', 'Pinned', site.name + ' added to pinned');
  }
  localStorage.setItem('pinnedBSMFI', JSON.stringify(pinnedSites));
  renderCurrentView();
}

function createSiteItem(site) {
  const a = document.createElement("a");
  a.href = site.url || "#";
  a.target = "_parent";
  a.className = `site-item ${isPinned(site.name) ? 'pinned' : ''}`;

  const bg = getColor(site.name);
  const initial = getInitial(site.name);
  const isOn = isPinned(site.name);

  a.innerHTML = `
    <div class="letter-icon" style="background: ${bg};">${initial}</div>
    <div class="site-info" style="flex:1">
      <div class="togglestyletwo">
        <h3>${site.name}</h3>
      </div>
      <div class="togglestyle">
        <div class="pin-toggle ${isOn ? 'on' : ''}" data-name="${site.name}"></div>
      </div>
    </div>
  `;

  const toggle = a.querySelector('.pin-toggle');
  toggle.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopImmediatePropagation();
    togglePin(site);
  });

  return a;
}

function renderCurrentView() {
  const container = document.getElementById("sectionsContainer");
  container.innerHTML = "";

  if (currentView === 'pinned') {
    if (pinnedSites.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:80px 20px; color:#666;"><h2>No Pinned Services</h2><p>Tap the toggle to pin services.</p></div>`;
      return;
    }
    const section = document.createElement("div");
    section.className = "section";
    section.innerHTML = `<h2>Pinned Services</h2>`;
    const list = document.createElement("div");
    list.className = "site-list";
    pinnedSites.forEach(site => list.appendChild(createSiteItem(site)));
    section.appendChild(list);
    container.appendChild(section);
    return;
  }

  if (pinnedSites.length > 0) {
    const pinnedSection = document.createElement("div");
    pinnedSection.className = "section";
    pinnedSection.innerHTML = `<h2>Pinned</h2>`;
    const list = document.createElement("div");
    list.className = "site-list";
    pinnedSites.forEach(site => list.appendChild(createSiteItem(site)));
    pinnedSection.appendChild(list);
    container.appendChild(pinnedSection);
  }

  const pinnedNames = new Set(pinnedSites.map(s => s.name));

  siteGroups.forEach(group => {
    const filteredSites = group.sites.filter(site => !pinnedNames.has(site.name));
    if (filteredSites.length === 0) return;

    const section = document.createElement("div");
    section.className = "section";
    section.innerHTML = `<h2>${group.heading}</h2>`;

    const list = document.createElement("div");
    list.className = "site-list";
    filteredSites.forEach(site => list.appendChild(createSiteItem(site)));
    section.appendChild(list);
    container.appendChild(section);
  });
}

function showAll() {
  currentView = 'all';
  document.getElementById('nav-all').classList.add('active');
  document.getElementById('nav-pinned').classList.remove('active');
  renderCurrentView();
}

function showPinnedOnly() {
  currentView = 'pinned';
  document.getElementById('nav-all').classList.remove('active');
  document.getElementById('nav-pinned').classList.add('active');
  renderCurrentView();
}

// ===== Liquid Glass Search Logic =====
const searchWrapper = document.getElementById("searchWrapper");
const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");

searchInput.addEventListener("focus", () => {
  searchWrapper.classList.add("focused");
  updateClear();
});

searchInput.addEventListener("blur", () => {
  searchWrapper.classList.remove("focused");
  setTimeout(updateClear, 150);
});

searchInput.addEventListener("input", (e) => {
  updateClear();
  const term = e.target.value.toLowerCase().trim();
  if (!term) { renderCurrentView(); return; }

  const container = document.getElementById("sectionsContainer");
  container.innerHTML = "";

  let foundAny = false;
  siteGroups.forEach(group => {
    const filteredSites = group.sites.filter(site => 
      site.name.toLowerCase().includes(term) || site.desc.toLowerCase().includes(term)
    );
    if (filteredSites.length === 0) return;
    foundAny = true;

    const section = document.createElement("div");
    section.className = "section";
    section.innerHTML = `<h2>${group.heading}</h2>`;
    const list = document.createElement("div");
    list.className = "site-list";
    filteredSites.forEach(site => list.appendChild(createSiteItem(site)));
    section.appendChild(list);
    container.appendChild(section);
  });

  if (!foundAny) {
    container.innerHTML = `<div style="text-align:center; padding:60px 20px; color:#666;">No service found as<br><strong>${term}</strong></div>`;
  }
});

clearBtn.addEventListener("mousedown", (e) => {
  e.preventDefault();
  searchInput.value = "";
  searchInput.focus();
  updateClear();
  renderCurrentView();
});

function updateClear() {
  if (searchInput.value.length > 0 && document.activeElement === searchInput) {
    clearBtn.classList.add("visible");
  } else {
    clearBtn.classList.remove("visible");
  }
}

renderCurrentView();

// ===== Modal Functions =====
let currentRedirectUrl = "";

function showRedirectPopup(pageName, url) {
  currentRedirectUrl = url;
  document.getElementById('modalPageName').textContent = pageName;
  const modal = document.getElementById('redirectModal');
  modal.style.display = 'flex';
  requestAnimationFrame(() => {
    modal.classList.add('active');
  });
}

function closeModal() {
  const modal = document.getElementById("redirectModal");
  modal.classList.remove('active');
  setTimeout(() => {
    modal.style.display = "none";
  }, 400);
}

function proceedToLink() {
  if (currentRedirectUrl) window.location.href = currentRedirectUrl;
}

document.getElementById('redirectModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Device Popup
const triggerIcon = document.getElementById('triggerIcon');
const devicePopup = document.getElementById('devicePopup');
const closePopupBtn = document.getElementById('closePopup');

function openDevicePopup() {
  devicePopup.style.display = 'flex';
  requestAnimationFrame(() => {
    devicePopup.classList.add('active');
  });
}

function closeDevicePopup() {
  devicePopup.classList.remove('active');
  setTimeout(() => {
    devicePopup.style.display = "none";
  }, 400);
}

triggerIcon.addEventListener('click', openDevicePopup);
closePopupBtn.addEventListener('click', closeDevicePopup);
devicePopup.addEventListener('click', (e) => {
  if (e.target === devicePopup) closeDevicePopup();
});

document.addEventListener('keydown', (e) => {
  if (e.key === "Escape") {
    if (devicePopup.classList.contains('active')) closeDevicePopup();
    if (document.getElementById('redirectModal').classList.contains('active')) closeModal();
  }
});

// ===== Toast System =====
function showToast(type, title, message) {
  const container = document.getElementById("toastContainer");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;

  const icons = {
    success: "service-icons/notice.pop.up.pinned.png",
    error:   "service-icons/notice.pop.up.unpinned.png",
    info:    "service-icons/notice.pop.up.unpinned.png"
  };

  const iconSrc = icons[type];
  const iconHTML = iconSrc
    ? `<img src="${iconSrc}" alt="${type}" class="toast-icon-img">`
    : "ℹ";

  toast.innerHTML = `
    <div class="toast-icon">${iconHTML}</div>
    <div>
      <div class="toast-title">${title}</div>
      <div class="toast-message">${message}</div>
    </div>
  `;

  container.appendChild(toast);

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      toast.classList.add("show");
    });
  });

  setTimeout(() => {
    toast.classList.remove("show");
    toast.classList.add("hide");
    setTimeout(() => toast.remove(), 400);
  }, 3500);
}

// ===== LOADING + PASSWORD LOGIC =====
window.addEventListener("load", function () {
  const loader = document.getElementById("bsmfi-loader");
  const image = document.getElementById("loader-image");
  const welcome = document.getElementById("welcome-text");

  // Keep site locked
  document.body.classList.add("site-locked");

  // Logo animation
  setTimeout(() => {
    image.style.opacity = "0";
    image.style.transform = "scale(0.88)";

    setTimeout(() => {
      welcome.style.opacity = "1";
      welcome.style.transform = "translateY(0) scale(1)";
    }, 700);
}, 2000);

  // Remove loader after ~4 seconds and show password popup
  setTimeout(() => {
    loader.style.transition = "opacity 0.8s ease";
    loader.style.opacity = "0";

    setTimeout(() => {
      loader.remove();
      openServicePasswordPopup();
     }, 800);
}, 4000);
});

function openServicePasswordPopup() {
  const popup = document.getElementById("servicePasswordPopup");
  const input = document.getElementById("servicePasswordInput");
  const error = document.getElementById("servicePasswordError");

  popup.style.display = "flex";
  input.value = "";
  error.textContent = "";

  setTimeout(() => {
    input.focus();
  }, 150);
}

function closeServicePasswordPopup() {
  document.getElementById("servicePasswordPopup").style.display = "none";
}

function checkServicePassword() {
  const input = document.getElementById("servicePasswordInput");
  const error = document.getElementById("servicePasswordError");
  const enteredPassword = input.value.trim();

  // users object comes from new-service-amount-details.js
  if (typeof users === "undefined" || !users) {
    error.textContent = "Password system not loaded.";
    return;
  }

  const matchedUser = Object.values(users).find(
    user => user.password === enteredPassword
  );

  if (matchedUser) {
    window.currentUser = matchedUser.displayName || matchedUser.name || "User";

    document.getElementById("servicePasswordPopup").style.display = "none";
    document.body.classList.remove("site-locked");

    console.log("Logged in as:", window.currentUser);
    return;
  }

  error.textContent = "Incorrect password.";
  input.value = "";
  input.focus();
}

// Enter key support
document.getElementById("servicePasswordInput").addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    checkServicePassword();
  }
});
