<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
   <title>BS&MFI Services | My account</title>
    <link rel="icon" href="mfi.logo.png" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Balthazar&family=Della+Respira&family=Hahmlet:wght@100..900&family=Niconne&family=Stalemate&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Balthazar&family=Della+Respira&family=Gantari:ital,wght@0,100..900;1,100..900&family=Hahmlet:wght@100..900&family=Niconne&family=Stalemate&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
* {
	font-family: 'Inter', system-ui, -apple-system, sans-serif;
	margin:0; padding:0;
	letter-spacing: 0.4px;
}
    :root {
      --primary: #2481cc;
      --primary-dark: #1a6bb0;
      --bg: #000000;
      --bg-secondary: #1f1f1fba;
      --bg-tertiary: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --bubble-bot: #1c1c1e;
      --bubble-user: #263b59;
      --border: #2c2c2e;
      --success: #4caf50;
      --danger: #e53935;
      --warning: #ff9800;
      --radius: 12px;
      --nav-height: 56px;
      --header-height: 56px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
a {
    text-decoration: none;
    color: var(--text);
}
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ========== LOGIN ========== */
    #login-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      background: var(--bg);
    }

    .login-card {
     width: 100%;
    max-width: 360px;
    }

    .login-logo {
      width: 72px;
      height: 72px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      font-weight: 700;
      color: white;
    }

    .login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .login-sub {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

input#password-input {
    width: 100%;
    height: 48px;
    padding: 0 15px;
    border: none;
    border-radius: 999px;
    outline: none;
    font-size: 18px;
    box-sizing: border-box;
    text-align: center;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    background: var(--bg-secondary);
}
    input[type="password"],
    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="color"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-tertiary);
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    input[type="color"] {
      padding: 4px;
      height: 44px;
      cursor: pointer;
    }

    .btn {
         width: 100%;
    height: 48px;
    margin-top: 15px;
    border: none;
    border-radius: 9999px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    color: #ffffff;
    box-shadow: inset 0.9px 0.9px 0px 0px #ffffff17, inset -0.9px -0.9px 0px 0px #ffffff17;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0px;
      background: var(--primary);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: rgba(36, 129, 204, 0.1);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
      width: auto;
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }

    /* ========== APP SHELL ========== */
    #app {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    header {
      position: relative;
      height: var(--header-height);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
      z-index: 10;
    }

    header .back-btn {
      background: none;
    border: none;
    color: var(--primary);
    cursor: pointer;
    backdrop-filter: blur(2px);
    box-shadow: inset 0.9px 0.9px 0px 0px #ffffff17, inset -0.9px -0.9px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    width: 40px;
    height: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: var(--bg-secondary);
    padding: 5px 0 0 0;
    }

    header .title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header .subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg);
      position: relative;
    }

    /* Bottom Nav */
    nav.bottom-nav {
          height: var(--nav-height);
    background: var(--bg-secondary);
    display: flex;
    flex-shrink: 0;
    z-index: 10;
    position: relative;
    bottom: auto;
    width: 100%;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    nav.bottom-nav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav.bottom-nav button.active {
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 16%, transparent);
      border-radius: 14px;
      font-weight: 700;
    }

    nav.bottom-nav button.active svg {
      transform: translateY(-1px);
    }

    nav.bottom-nav button svg {
      transition: transform 0.18s ease;
      width: 24px;
      height: 24px;
    }

    @supports not (background: color-mix(in srgb, #000 10%, transparent)) {
      nav.bottom-nav button.active { background: rgba(36, 129, 204, 0.18); }
    }

    /* ========== VIEWS ========== */
    .view {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .view.active {
      display: flex;
    }

    /* Amounts List */
    .loan-list {
      padding: 5px;
    }

    .loan-item {
    border-radius: 25px;
    padding: 15px 10px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
        transition: all 0.35s ease-in-out;
    }

    .loan-item:active {
    transform: scale(0.96);
    background: var(--bg-secondary);
}

    .loan-avatar {
      width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 20px;
    color: var(--text);
    }

    .loan-info {
      flex: 1;
      min-width: 0;
    }

    .loan-info h3 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .loan-info p {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loan-amount {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    /* ========== CHAT VIEW ========== */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 85%;
    padding: 10px 12px;
    border-radius: 15px;
    font-size: 15px;
    line-height: 1.4;
    position: relative;
    word-wrap: break-word;
    }

    .msg.bot {
      background: var(--bubble-bot);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
         background: var(--primary);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    }

    .msg .time {
      font-size: 11px;
    margin-top: 4px;
    text-align: right;
    opacity: 60%;
    }

    .option-btn {
     background: var(--bg-secondary);
    border: none;
    color: var(--text);
    padding: 10px 15px;
    border-radius: 99px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
    box-shadow: inset 0.9px 0.9px 0px 0px #ffffff17, inset -0.9px -0.9px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    backdrop-filter: blur(2px);
    }

    .option-btn:active,
    .option-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

     .services-grid {
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    overflow: scroll;
    height: 83vh;
    }

    .service-card {
     background: var(--bg-secondary);
    border-radius: 20px;
    padding: 20px 15px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
    }

    .service-card:active {
      background: var(--bg-tertiary);
    }

    .service-card.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .service-card .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .service-card h4 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .service-card p {
      font-size: 12px;
      color: var(--text-secondary);
    }
.settings-list {
          padding: 12px;
    overflow: scroll;
    height: 83vh;
    }
    .settings-section {
      margin-bottom: 20px;
    background: var(--bg-secondary);
    border-radius: 25px;
    }

    .settings-section h3 {
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 8px 8px;
    }

    .settings-item {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }


    .settings-item .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .settings-item .arrow {
      color: var(--text-secondary);
      font-size: 18px;
    }
.settings-list h3 {
    text-transform: uppercase;
    opacity: 55%;
    font-size: 13px;
    font-weight: 400;
    padding: 5px 15px;
}
    .color-picker-row {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border 0.15s;
    }

    .color-swatch.active {
      border-color: white;
    }

    .color-custom-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 4px;
    }

    .color-custom-wrap label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ========== MODAL / FULL PAGES ========== */
    .page-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .page-overlay.active {
      display: flex;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .page-content h2 {
      color: var(--text);
      font-size: 20px;
      margin-bottom: 16px;
    }

    .page-content h3 {
      color: var(--text);
      font-size: 16px;
      margin: 20px 0 8px;
    }

    .page-content p {
      margin-bottom: 12px;
    }

    .page-content ul {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    /* Notice & Custom Content */
    .special-notice {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 12px 16px;
      margin: 12px;
      border-radius: var(--radius);
      font-size: 14px;
      display: none;
    }

    .custom-content {
      margin: 12px;
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
    }

    .custom-content img {
      width: 100%;
      display: block;
      cursor: pointer;
    }

    /* Form styles */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-tertiary);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Theme light override */
    body.light {
      --bg: #ffffff;
      --bg-secondary: #f0f2f5;
      --bg-tertiary: #e4e6eb;
      --text: #050505;
      --text-secondary: #65676b;
      --bubble-bot: #e4e6eb;
      --bubble-user: #0084ff;
      --border: #ced0d4;
    }

    body.light .msg.user {
      color: white;
    }

    body.light .loan-item:active,
    body.light .service-card:active {
      background: #d8dadf;
    }

    body.light nav.bottom-nav,
    body.light header {
      border-color: #ced0d4;
    }



    /* Header menu and loan sharing */
    header { position: relative; }
    .header-heading { flex: 1; min-width: 0; }
    .header-more {
      width: 40px;
    height: 40px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    transition: transform .18s ease, background .18s ease;
    box-shadow: inset 0.9px 0.9px 0px 0px #ffffff17, inset -0.9px -0.9px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    background: var(--bg-secondary);
    }
    .header-more:active { background: var(--bg-tertiary); }

    .borrow-tools {width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 10px 0 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;}
    .borrow-apply-card,
    .fee-calculator-launch  {
        grid-column: 1 / -1;
    width: 100%;
    min-height: 75px;
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    background: var(--bg-secondary);
    border: none;
    border-radius: 20px;
    padding: 0 15px;
    gap: 15px;
    }
    .borrow-apply-card > span:nth-child(2) { display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; }
    .borrow-apply-card strong { font-size: 16px; }
    .borrow-apply-card small { color: var(--text-secondary); font-size: 13px; }
    .borrow-apply-icon { width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: 
color-mix(in srgb, var(--primary) 18%, transparent);
    color: var(--primary);
    font-size: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    margin: 0;
    line-height: 0;}
    .borrow-apply-arrow { color:var(--text-secondary); font-size:25px; }
    #borrow-search { margin-bottom: 4px;
    background: var(--bg-secondary);
    border: none;
    padding: 12px 20px;
    width: 100%;
    font-size: 17px;
    backdrop-filter: blur(2px);
    box-shadow: inset 0.9px 0.9px 0px 0px #ffffff17, inset -0.9px -0.9px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    border-radius: 999px;}
   
    .fee-calculator-launch > span:first-child {
      width:40px; height:40px; flex:0 0 40px; display:grid; place-items:center;
      border-radius:12px; background:color-mix(in srgb,var(--primary) 16%,transparent);
      color:var(--primary); font-size:22px; font-weight:700;
    }
    .fee-calculator-launch > span:nth-child(2) { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
    .fee-calculator-launch strong { font-size:14px; }
    .fee-calculator-launch small { color:var(--text-secondary); font-size:12px; line-height:1.4; }
    .fee-calculator-launch b { color:var(--text-secondary); font-size:22px; font-weight:400; }
    .fee-result { margin-top:16px; padding:16px; border:1px solid var(--border); border-radius:14px; background:var(--bg-secondary); }
    .fee-result-row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; font-size:14px; }
    .fee-result-row.total { border-top:1px solid var(--border); margin-top:6px; padding-top:13px; font-weight:700; font-size:16px; }
    .fee-rate-note { color:var(--text-secondary); font-size:12px; margin-top:8px; line-height:1.5; }
    .chat-solution-ad-wrap { padding: 10px 12px 0; background: var(--bg); }
    .chat-solution-ad {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 15px; text-align: left;
      color: var(--text); background: var(--bg-secondary); cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,.08); transition: transform .15s ease, border-color .15s ease;
    }
    .chat-solution-ad:active { transform: scale(.985); border-color: var(--primary); }
    .chat-solution-ad-icon { width: 42px; height: 42px; flex: 0 0 42px; display:grid; place-items:center; border-radius:12px; background:color-mix(in srgb,var(--primary) 15%,transparent); font-size:23px; }
    .chat-solution-ad-copy { display:flex; flex-direction:column; gap:3px; flex:1; min-width:0; }
    .chat-solution-ad-copy small { color:var(--text-secondary); font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
    .chat-solution-ad-copy strong { font-size:14px; }
    .chat-solution-ad-copy span { color:var(--text-secondary); font-size:12px; line-height:1.35; }
    .chat-solution-ad-arrow { color:var(--primary); font-size:22px; }
    .chat-share-row { padding: 0 12px max(12px, env(safe-area-inset-bottom, 0px));
    background: var(--bg);}
    .chat-share-btn { width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 22px;
    background: var(--primary);
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);}
    body.light .header-menu { box-shadow:0 12px 32px rgba(0,0,0,.14); }
    html, body {
      width: 100%;
      min-height: 100%;
      overscroll-behavior: none;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      height: 100vh;
      height: 100dvh;
    }
    #login-view {
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      flex: 1;
      overflow-y: auto;
    }
    #app {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }
    header {
      min-height: var(--header-height);
      height: auto;
      padding-top: env(safe-area-inset-top, 0px);
    }
    main {
      min-height: 0;
      min-width: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0;scrollbar-width: none;
    }
    .view {
      height: auto;
      min-height: 100%;

    // ===================== STATE =====================
    let currentUser = null;

    const COLORS = [

    // ===================== HELPERS =====================
    function parseDate(str) {
      // DD-MM-YYYY
      const [d, m, y] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDate(str) {
      const d = parseDate(str);
      return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    function daysLeft(returnStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const ret = parseDate(returnStr);
      ret.setHours(0, 0, 0, 0);
      return Math.round((ret - today) / (1000 * 60 * 60 * 24));
    }

    // Overdue fine accrues once per day after the return date, through today.
    // Example: return date was yesterday = 1 overdue day.
    function getOverdueDays(loan) {
      return Math.max(0, Math.abs(Math.min(0, daysLeft(loan.return))));
    }

    function getOverdueFine(loan) {
      const dailyFine = Math.max(0, Number(loan.overdueFee) || 0);
      return getOverdueDays(loan) * dailyFine;
    }

    function formatMoney(n) {
      return "₹" + Number(n).toLocaleString("en-IN");
    }

    function nowTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function setPrimaryColor(color) {
      document.documentElement.style.setProperty("--primary", color);
      const c = color.replace("#", "");
      const r = Math.max(0, parseInt(c.substr(0, 2), 16) - 30);
      const g = Math.max(0, parseInt(c.substr(2, 2), 16) - 30);
      const b = Math.max(0, parseInt(c.substr(4, 2), 16) - 30);
      document.documentElement.style.setProperty("--primary-dark", `rgb(${r},${g},${b})`);
      localStorage.setItem("bsmfi_primary", color);
    }

    // ===================== LOGIN =====================
    document.getElementById("login-btn").addEventListener("click", tryLogin);
    document.getElementById("password-input").addEventListener("keydown", e => {
      if (e.key === "Enter") tryLogin();
    });

    function tryLogin() {
      const pass = document.getElementById("password-input").value.trim();
      const err = document.getElementById("login-error");
      err.textContent = "";

      if (!pass) {
        err.textContent = "Please enter a password";
        return;
      }

      let found = null;
      for (const key in users) {
        if (users[key].password === pass) {
          found = { key, ...users[key] };
          break;
        }
      }

      if (!found) {
        err.textContent = "Invalid password";
        return;
      }

      const sharedParams = new URLSearchParams(window.location.search);
      const sharedOwner = sharedParams.get("owner");
      const sharedLoanParam = sharedParams.get("loan");
      if (sharedOwner && sharedOwner !== found.key) {
        err.textContent = "Use the password for the account that shared this loan";
        return;
      }

      currentUser = found;
      loanSortOrder = "default";
      document.getElementById("login-view").style.display = "none";
      document.getElementById("app").style.display = "flex";
      initApp();
      const sharedLoan = sharedLoanParam;
      if (sharedLoan !== null && /^\d+$/.test(sharedLoan)) {
        const sharedIndex = Number(sharedLoan);
        if (currentUser.loans && currentUser.loans[sharedIndex]) {
          openChat(sharedIndex);
          showToast("Shared loan opened");
        }
      }
    }

    // ===================== INIT APP =====================
    function initApp() {
      const savedTheme = localStorage.getItem("bsmfi_theme") || "dark";
      if (savedTheme === "light") document.body.classList.add("light");
      document.getElementById("theme-label").textContent = savedTheme === "light" ? "Light" : "Dark";

      // Color picker is ONLY available if user has customui === "yes"
      const colorSection = document.getElementById("color-section");
      if (currentUser.customui === "yes") {
        colorSection.style.display = "block";

        // Restore previously saved color (or default)
        const savedColor = localStorage.getItem("bsmfi_primary") || "#2481cc";
        setPrimaryColor(savedColor);

        const picker = document.getElementById("color-picker");
        picker.innerHTML = "";

        // Preset swatches
        COLORS.forEach(c => {
          const sw = document.createElement("div");
          sw.className = "color-swatch" + (c.toLowerCase() === savedColor.toLowerCase() ? " active" : "");
          sw.style.background = c;
          sw.title = c;
          sw.addEventListener("click", () => {
            document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
            sw.classList.add("active");
            setPrimaryColor(c);
            // sync custom picker
            const customInput = document.getElementById("custom-color-input");

    // ===================== LOAN LIST =====================
    function renderLoanList() {
      const list = document.getElementById("loan-list");
      let loans = (currentUser.loans || []).map((loan, index) => ({ loan, index }));
      if (loanSortOrder === "high") loans.sort((a, b) => Number(b.loan.amount) - Number(a.loan.amount));
      if (loanSortOrder === "low") loans.sort((a, b) => Number(a.loan.amount) - Number(b.loan.amount));

      if (!loans.length) {
        list.innerHTML = `<div class="empty-state"><p>No active loans</p></div>`;
        return;
      }

      list.innerHTML = loans.map(({ loan, index }) => {
        const left = daysLeft(loan.return);
        const overdueDays = getOverdueDays(loan);
        const status = left < 0 ? `<span style="color:var(--danger)">Overdue ${overdueDays}d · Fine ${formatMoney(getOverdueFine(loan))}</span>` :
                       left === 0 ? `<span style="color:var(--warning)">Due today</span>` : `${left} days left`;
        return `<div class="loan-item" data-index="${index}">
          <div class="loan-avatar">${index + 1}</div>
          <div class="loan-info"><h3>${formatMoney(loan.amount)}</h3><p>${status} · Return ${formatDate(loan.return)}</p></div>
          <div class="loan-amount"></div>
        </div>`;
      }).join("");
      list.querySelectorAll(".loan-item").forEach(el => el.addEventListener("click", () => openChat(+el.dataset.index)));
    }

    function buildLoanShareText(loan, index) {
      return `BS & MFI · Loan ${index + 1}\nAmount: ${formatMoney(loan.amount)}\nInterest: ${formatMoney(loan.interest)}\nBorrowed on: ${formatDate(loan.borrowed)}\nReturn on: ${formatDate(loan.return)}\nOverdue days: ${getOverdueDays(loan)}\nOverdue fine: ${formatMoney(getOverdueFine(loan))} (${formatMoney(loan.overdueFee || 0)} per day)`;
    }

    async function shareLoanDetails(loan, index) {
      const text = buildLoanShareText(loan, index);
      const url = new URL(window.location.href);
      url.searchParams.set("loan", String(index));
      url.searchParams.set("owner", currentUser.key);
      const link = url.toString();
      const payload = `${text}\n\nView this specific loan: ${link}\nEnter the account password to open the loan details.`;
      try {
        if (navigator.share) {
          await navigator.share({ title: `BS & MFI · ${formatMoney(loan.amount)}`, text: payload, url: link });
        } else if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(payload);
          showToast("Loan details and link copied");
        } else {
          window.prompt("Copy the complete loan details and link:", payload);
        }
      } catch (e) {
        if (e.name !== "AbortError") showToast("Unable to share. Try again.");
      }
    }

    function handleOption(opt, loan, index) {
      const labels = {
        interest: "Interest",
        taken: "Taken on",
        return: "Return on",
        days: "Days left",
        overdue: "Overdue fee"
      };
      addUserMsg(labels[opt]);

      setTimeout(() => {
        let reply = "";
        switch (opt) {
          case "interest":
            reply = `Interest amount: <b>${formatMoney(loan.interest)}</b>`;
            if (currentUser.fixedInterest) {
              reply += `<br>Fixed interest rate: ${currentUser.fixedInterest}%`;
            }
            break;
          case "taken":
            reply = `Borrowed on: <b>${formatDate(loan.borrowed)}</b>`;
            break;
          case "return":
            reply = `Return date: <b>${formatDate(loan.return)}</b>`;
            break;
          case "days": {
            const d = daysLeft(loan.return);
            if (d < 0) reply = `⚠️ This loan is <b>overdue by ${Math.abs(d)} day(s)</b>.`;
            else if (d === 0) reply = `⏰ This loan is <b>due today</b>.`;
            else reply = `Days remaining: <b>${d} day(s)</b>`;
            break;
          }
          case "overdue": {
            const overdueDays = getOverdueDays(loan);
            const dailyFine = Math.max(0, Number(loan.overdueFee) || 0);
            const totalFine = getOverdueFine(loan);
            reply = overdueDays > 0
              ? `Overdue by <b>${overdueDays} day(s)</b>.<br>Daily overdue fine: <b>${formatMoney(dailyFine)}</b><br>Total overdue fine until today: <b>${formatMoney(totalFine)}</b>`
              : `No overdue fine yet. The daily fine is <b>${formatMoney(dailyFine)}</b> and starts after the return date.`;
            break;
          }
        }
        addBotMsg(reply);
      }, 300);
    }

    // ===================== BOTTOM NAV VISIBILITY =====================
    function getAllowedBottomNavItems() {
      if (!currentUser || !Array.isArray(currentUser.bottomNavItems)) return [];
      const validItems = ["amounts", "borrow", "settings"];
      return [...new Set(currentUser.bottomNavItems.map(item => String(item).toLowerCase()))]
        .filter(item => validItems.includes(item));
    }

    function configureBottomNav() {
      const nav = document.getElementById("bottom-nav");
      if (!nav || !currentUser) return;

      // A user can see ONLY the tabs explicitly listed in their own
      // bottomNavItems array. Missing permission means hidden, not allowed.
      const allowedItems = getAllowedBottomNavItems();
      const shouldShow = currentUser.showBottomNav !== "no" && allowedItems.length > 0;
      nav.style.display = shouldShow ? "flex" : "none";

      nav.querySelectorAll("button[data-view]").forEach(button => {
        const allowed = shouldShow && allowedItems.includes(button.dataset.view);
        button.hidden = !allowed;
        button.style.display = allowed ? "flex" : "none";
        const active = allowed && button.dataset.view === currentView;
        button.classList.toggle("active", active);
        if (active) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    // ===================== NAVIGATION =====================
    function switchView(view, updateNav = true) {
      if (updateNav && currentUser) {
        const allowedItems = getAllowedBottomNavItems();
        if (allowedItems.length && !allowedItems.includes(view)) {
          view = allowedItems[0];
        }
      }
      currentView = view;
      configureHeaderMenu();
      closeHeaderMenu();
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("view-" + view).classList.add("active");

      if (updateNav) {
        document.getElementById("back-btn").style.display = "none";
        configureBottomNav();
        document.getElementById("header-sub").textContent = currentUser.displayName + " · " + currentUser.premiumType;

        const titles = { amounts: "Amounts", borrow: "Borrow", settings: "Settings" };
        document.getElementById("header-title").textContent = titles[view] || view;

        configureBottomNav();
      }
    }

    document.getElementById("back-btn").addEventListener("click", () => {
      switchView("amounts");
    });

    document.querySelectorAll("#bottom-nav button").forEach(btn => {
      btn.addEventListener("click", () => switchView(btn.dataset.view));
    });

    document.getElementById("borrow-apply").addEventListener("click", openApplyAmount);

        amounts: [
          ["issue", "Report an issue"],

          ["low", "Amount: Low to high"],
          ["add", "+ Amount"]
        ],
        chat: [
          ["issue", "Report an issue"],

      ).join("");
      headerMore.style.display = items.length ? "inline-flex" : "none";
    }

    function closeHeaderMenu() {
      headerMenu.classList.remove("open");
      headerMore.setAttribute("aria-expanded", "false");
    }

    headerMore.addEventListener("click", (event) => {
      event.stopPropagation();
      configureHeaderMenu();
      headerMenu.classList.toggle("open");
      headerMore.setAttribute("aria-expanded", headerMenu.classList.contains("open") ? "true" : "false");

          </div>
          <div class="form-group">
            <label>Reason</label>
            <textarea id="late-reason" placeholder="Briefly explain the situation..."></textarea>
          </div>
          <div class="form-group">
            <label>Expected new payment date</label>
            <input type="date" id="late-date" />
          </div>
          <button class="btn" id="late-submit">Notify Team</button>`;
        setTimeout(() => {
          document.getElementById("late-submit")?.addEventListener("click", () => {
            showToast("Notification sent. Our team will contact you.");
            document.getElementById("page-overlay").classList.remove("active");
          });
        }, 50);
      } else if (page === "issue") {
        content.innerHTML = `
          <h2>Report an issue</h2>
          <p>Tell us what is not working. Include the page or loan amount if relevant.</p>
          ${currentLoanIndex !== null && currentUser?.loans?.[currentLoanIndex] ? `<p style="color:var(--text-secondary);font-size:13px;margin-top:8px;">Related loan: ${formatMoney(currentUser.loans[currentLoanIndex].amount)}</p>` : ""}
          <div class="form-group" style="margin-top:18px;"><label>Issue</label><textarea id="issue-description" placeholder="Describe the issue..."></textarea></div>
          <button class="btn" id="issue-submit">Continue</button>
          <p style="font-size:12px;color:var(--text-secondary);margin-top:10px;">This form prepares your report; it does not send it to a server.</p>`;
        setTimeout(() => document.getElementById("issue-submit")?.addEventListener("click", () => {
          const issue = document.getElementById("issue-description").value.trim();
          if (!issue) { showToast("Describe the issue first"); return; }
          const subject = encodeURIComponent("BS & MFI issue report");
          const body = encodeURIComponent(`Account: ${currentUser.displayName}\nIssue: ${issue}`);
          window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }), 30);
      } else if (page === "helper") {
        content.innerHTML = `
          <h2>Helper</h2>
          <p>Quick answers to common questions.</p>
          <h3>How do I check my loan details?</h3>
          <p>Go to the Amounts tab and tap any Amount card. A chat-style view will open with options.</p>
          <h3>What is "Delay It"?</h3>
          <p>It allows eligible users to request an extension of the due date (subject to approval and fees).</p>
          <h3>What is Split Pay?</h3>
          <p>Split the outstanding amount into smaller installments if the feature is enabled for your account.</p>
          <h3>Need more help?</h3>
          <p>Contact support through your relationship manager or official channels.</p>
          <button class="btn btn-outline" style="margin-top:20px;" onclick="showToast('Support chat coming soon')">Contact Support</button>`;
      }

      document.getElementById("page-overlay").classList.add("active");
    }

    // Prevent zoom on double tap (mobile)
    document.addEventListener("gesturestart", e => e.preventDefault());
  </script>
</body>
</html>
