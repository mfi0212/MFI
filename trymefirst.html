<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BS & MFI</title>
  <style>
    :root {
      --primary: #2481cc;
      --primary-dark: #1a6bb0;
      --bg: #000000;
      --bg-secondary: #111111;
      --bg-tertiary: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --bubble-bot: #1c1c1e;
      --bubble-user: #263b59;
      --border: #2c2c2e;
      --success: #4caf50;
      --danger: #e53935;
      --warning: #ff9800;
      --radius: 12px;
      --nav-height: 56px;
      --header-height: 56px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ========== LOGIN ========== */
    #login-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      background: var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .login-logo {
      width: 72px;
      height: 72px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      font-weight: 700;
      color: white;
    }

    .login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .login-sub {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input[type="password"],
    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="color"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-tertiary);
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    input[type="color"] {
      padding: 4px;
      height: 44px;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: rgba(36, 129, 204, 0.1);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
      width: auto;
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      min-height: 18px;
    }

    /* ========== APP SHELL ========== */
    #app {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    header {
      height: var(--header-height);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
      z-index: 10;
    }

    header .back-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px 4px 0;
      margin-right: 8px;
    }

    header .title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header .subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg);
      position: relative;
    }

    /* Bottom Nav */
    nav.bottom-nav {
          height: var(--nav-height);
    background: var(--bg-secondary);
    display: flex;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
    z-index: 10;
    position: relative;
    bottom: auto;
    width: 100%;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    nav.bottom-nav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav.bottom-nav button.active {
      color: var(--primary);
      border-radius: 14px;
      font-weight: 700;
    }

    nav.bottom-nav button.active svg {
      transform: translateY(-1px);
    }

    nav.bottom-nav button svg {
      transition: transform 0.18s ease;
      width: 24px;
      height: 24px;
    }

    @supports not (background: color-mix(in srgb, #000 10%, transparent)) {
      nav.bottom-nav button.active { background: rgba(36, 129, 204, 0.18); }
    }

    /* ========== VIEWS ========== */
    .view {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .view.active {
      display: flex;
    }

    /* Amounts List */
    .loan-list {
      padding: 12px;
    }

    .loan-item {
      background: var(--bg-secondary);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .loan-item:active {
      background: var(--bg-tertiary);
    }

    .loan-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
    }

    .loan-info {
      flex: 1;
      min-width: 0;
    }

    .loan-info h3 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .loan-info p {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loan-amount {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    /* ========== CHAT VIEW ========== */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
    }

    .msg.bot {
      background: var(--bubble-bot);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: var(--bubble-user);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg .time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      text-align: right;
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px 16px;
      background: var(--bg);
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .option-btn {
      background: var(--bg-secondary);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .option-btn:active,
    .option-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

     .services-grid {
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    overflow: scroll;
    height: 83vh;
    }

    .service-card {
      background: var(--bg-secondary);
      border-radius: var(--radius);
      padding: 18px 14px;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s;
      border: 1px solid transparent;
    }

    .service-card:active {
      background: var(--bg-tertiary);
    }

    .service-card.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .service-card .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .service-card h4 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .service-card p {
      font-size: 12px;
      color: var(--text-secondary);
    }
.settings-list {
          padding: 12px;
    overflow: scroll;
    height: 83vh;
    }
    .settings-section {
      margin-bottom: 20px;
    }

    .settings-section h3 {
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 8px 8px;
    }

    .settings-item {
      background: var(--bg-secondary);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .settings-item:first-of-type {
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .settings-item:last-of-type {
      border-radius: 0 0 var(--radius) var(--radius);
      border-bottom: none;
    }

    .settings-item:only-child {
      border-radius: var(--radius);
    }

    .settings-item .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .settings-item .arrow {
      color: var(--text-secondary);
      font-size: 18px;
    }

    .color-picker-row {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      flex-wrap: wrap;
      align-items: center;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border 0.15s;
    }

    .color-swatch.active {
      border-color: white;
    }

    .color-custom-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 4px;
    }

    .color-custom-wrap label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ========== MODAL / FULL PAGES ========== */
    .page-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .page-overlay.active {
      display: flex;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .page-content h2 {
      color: var(--text);
      font-size: 20px;
      margin-bottom: 16px;
    }

    .page-content h3 {
      color: var(--text);
      font-size: 16px;
      margin: 20px 0 8px;
    }

    .page-content p {
      margin-bottom: 12px;
    }

    .page-content ul {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    /* Notice & Custom Content */
    .special-notice {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 12px 16px;
      margin: 12px;
      border-radius: var(--radius);
      font-size: 14px;
      display: none;
    }

    .custom-content {
      margin: 12px;
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
    }

    .custom-content img {
      width: 100%;
      display: block;
      cursor: pointer;
    }

    /* Form styles */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-tertiary);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Theme light override */
    body.light {
      --bg: #ffffff;
      --bg-secondary: #f0f2f5;
      --bg-tertiary: #e4e6eb;
      --text: #050505;
      --text-secondary: #65676b;
      --bubble-bot: #e4e6eb;
      --bubble-user: #0084ff;
      --border: #ced0d4;
    }

    body.light .msg.user {
      color: white;
    }

    body.light .loan-item:active,
    body.light .service-card:active {
      background: #d8dadf;
    }

    body.light nav.bottom-nav,
    body.light header {
      border-color: #ced0d4;
    }


    /* Responsive layout and reliable scrolling */
    html, body {
      width: 100%;
      min-height: 100%;
      overscroll-behavior: none;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      height: 100vh;
      height: 100dvh;
    }
    #login-view {
      min-height: 100vh;
      min-height: 100dvh;
      height: auto;
      flex: 1;
      overflow-y: auto;
    }
    #app {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }
    header {
      min-height: var(--header-height);
      height: auto;
      padding-top: env(safe-area-inset-top, 0px);
    }
    main {
      min-height: 0;
      min-width: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 0;
    }
    .view {
      height: auto;
      min-height: 100%;
      min-width: 0;
      flex: 1 0 auto;
    }
    .view.active { display: flex; }
    #view-amounts, #view-borrow, #view-settings { overflow: visible; }
    .loan-list, .services-grid, .settings-list {
      height: auto;
      min-height: 0;
      overflow: visible;
      width: 100%;
    }
    .services-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
      padding-bottom: 24px;
    }
    .settings-list { padding-bottom: 24px; }
    nav.bottom-nav {
         position: relative;
    inset: auto;
    flex: 0 0 auto;
    min-height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
    height: auto;
    padding: 4px 4px env(safe-area-inset-bottom, 0px);
    width: 100%;
    z-index: 20;
    position: fixed;
    bottom: 0;
    }
    nav.bottom-nav button {
      min-width: 0;
      min-height: 48px;
      padding: 5px 2px;
      font-size: 11px;
    }
    nav.bottom-nav button svg { width: 22px; height: 22px; }
    .chat-container {
      min-height: 0;
      height: auto;
      flex: 1;
    }
    .chat-messages {
      min-height: 160px;
      max-height: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .options-row { flex: 0 0 auto; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
    .page-overlay { height: 100vh; height: 100dvh; }
    .page-content {
      min-height: 0;
      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
      -webkit-overflow-scrolling: touch;
    }
    .toast { bottom: calc(var(--nav-height) + 16px + env(safe-area-inset-bottom, 0px)); }
    body.light {
      --bg: #f5f5f7;
      --bg-secondary: #ffffff;
      --bg-tertiary: #e9e9ed;
      --text: #171719;
      --text-secondary: #6e6e73;
      --bubble-bot: #e9e9ed;
      --bubble-user: #2481cc;
      --border: #d2d2d7;
    }
    body.light nav.bottom-nav, body.light header {
      background: var(--bg-secondary);
      border-color: var(--border);
    }
    @media (max-width: 380px) {
      :root { --header-height: 52px; --nav-height: 54px; }
      header { padding-left: 12px; padding-right: 12px; }
      .services-grid { gap: 9px; padding: 12px; }
      .service-card { padding: 15px 9px; }
      .service-card h4 { font-size: 13px; overflow-wrap: anywhere; }
      .service-card p { font-size: 11px; }
      nav.bottom-nav button { font-size: 10px; }
    }
    @media (min-width: 760px) {
      .loan-list, .services-grid, .settings-list, .page-content {
        width: 100%;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
      }
      .services-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .login-card { max-width: 400px; }
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login-view">
    <div class="login-card">
      <div class="login-logo">BS</div>
      <div class="login-title">BS & MFI</div>
      <div class="login-sub">Enter your password to continue</div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password-input" placeholder="Enter password" autocomplete="current-password" />
      </div>
      <button class="btn" id="login-btn">Login</button>
      <div class="error-msg" id="login-error"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <header id="app-header">
      <button class="back-btn" id="back-btn" style="display:none;">←</button>
      <div>
        <div class="title" id="header-title">Amounts</div>
        <div class="subtitle" id="header-sub"></div>
      </div>
    </header>

    <main id="main">
      <!-- AMOUNTS VIEW -->
      <div class="view active" id="view-amounts">
        <div class="special-notice" id="special-notice"></div>
        <div class="custom-content" id="custom-content"></div>
        <div class="loan-list" id="loan-list"></div>
      </div>

      <!-- CHAT VIEW -->
      <div class="view" id="view-chat">
        <div class="chat-container">
          <div class="chat-messages" id="chat-messages"></div>
          <div class="options-row" id="options-row"></div>
        </div>
      </div>

      <!-- BORROW VIEW -->
      <div class="view" id="view-borrow">
        <div class="services-grid" id="services-grid"></div>
      </div>

      <!-- SETTINGS VIEW -->
      <div class="view" id="view-settings">
        <div class="settings-list">
          <div class="settings-section">
            <h3>Appearance</h3>
            <div class="settings-item" id="theme-toggle">
              <div class="left">
                <span>🌓</span>
                <span>Theme</span>
              </div>
              <span id="theme-label">Dark</span>
            </div>
            <div id="color-section" style="display:none;">
              <div class="settings-item" style="cursor:default;">
                <div class="left">
                  <span>🎨</span>
                  <span>Main Color</span>
                </div>
              </div>
              <div class="color-picker-row" id="color-picker"></div>
            </div>
          </div>

          <div class="settings-section">
            <h3>Pages</h3>
            <div class="settings-item" data-page="terms">
              <div class="left"><span>📄</span><span>Terms & Conditions</span></div>
              <span class="arrow">›</span>
            </div>
            <div class="settings-item" data-page="privacy">
              <div class="left"><span>🔒</span><span>Privacy Policy</span></div>
              <span class="arrow">›</span>
            </div>
            <div class="settings-item" data-page="new-entry">
              <div class="left"><span>📝</span><span>New Entry Form</span></div>
              <span class="arrow">›</span>
            </div>
            <div class="settings-item" data-page="im-late">
              <div class="left"><span>⏰</span><span>I'm Late</span></div>
              <span class="arrow">›</span>
            </div>
            <div class="settings-item" data-page="helper">
              <div class="left"><span>💬</span><span>Helper</span></div>
              <span class="arrow">›</span>
            </div>
          </div>

          <div class="settings-section">
            <h3>Account</h3>
            <div class="settings-item" id="logout-btn">
              <div class="left"><span>🚪</span><span>Logout</span></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button data-view="amounts" class="active">

    // ===================== STATE =====================
    let currentUser = null;

    const COLORS = [
      "#2481cc", "#4caf50", "#e53935", "#ff9800",

    ];

    // ===================== HELPERS =====================
    function parseDate(str) {
      // DD-MM-YYYY
      const [d, m, y] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDate(str) {
      const d = parseDate(str);
      return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
    }

    function daysLeft(returnStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const ret = parseDate(returnStr);
      ret.setHours(0, 0, 0, 0);
      const diff = Math.round((ret - today) / (1000 * 60 * 60 * 24));
      return diff;
    }

    function formatMoney(n) {
      return "₹" + Number(n).toLocaleString("en-IN");
    }

    function nowTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function setPrimaryColor(color) {
      document.documentElement.style.setProperty("--primary", color);
      const c = color.replace("#", "");
      const r = Math.max(0, parseInt(c.substr(0, 2), 16) - 30);
      const g = Math.max(0, parseInt(c.substr(2, 2), 16) - 30);
      const b = Math.max(0, parseInt(c.substr(4, 2), 16) - 30);
      document.documentElement.style.setProperty("--primary-dark", `rgb(${r},${g},${b})`);
      localStorage.setItem("bsmfi_primary", color);
    }

    // ===================== LOGIN =====================
    document.getElementById("login-btn").addEventListener("click", tryLogin);
    document.getElementById("password-input").addEventListener("keydown", e => {
      if (e.key === "Enter") tryLogin();
    });

    function tryLogin() {
      const pass = document.getElementById("password-input").value.trim();
      const err = document.getElementById("login-error");
      err.textContent = "";

      if (!pass) {
        err.textContent = "Please enter a password";
        return;
      }

      let found = null;
      for (const key in users) {
        if (users[key].password === pass) {
          found = { key, ...users[key] };
          break;
        }
      }

      if (!found) {
        err.textContent = "Invalid password";
        return;
      }

      currentUser = found;
      document.getElementById("login-view").style.display = "none";
      document.getElementById("app").style.display = "flex";
      initApp();
    }

    // ===================== INIT APP =====================
    function initApp() {
      const savedTheme = localStorage.getItem("bsmfi_theme") || "dark";
      if (savedTheme === "light") document.body.classList.add("light");
      document.getElementById("theme-label").textContent = savedTheme === "light" ? "Light" : "Dark";

      // Color picker is ONLY available if user has customui === "yes"
      const colorSection = document.getElementById("color-section");
      if (currentUser.customui === "yes") {
        colorSection.style.display = "block";

        // Restore previously saved color (or default)
        const savedColor = localStorage.getItem("bsmfi_primary") || "#2481cc";
        setPrimaryColor(savedColor);

        const picker = document.getElementById("color-picker");
        picker.innerHTML = "";

        // Preset swatches
        COLORS.forEach(c => {
          const sw = document.createElement("div");
          sw.className = "color-swatch" + (c.toLowerCase() === savedColor.toLowerCase() ? " active" : "");
          sw.style.background = c;
          sw.title = c;
          sw.addEventListener("click", () => {
            document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
            sw.classList.add("active");
            setPrimaryColor(c);
            // sync custom picker
            const customInput = document.getElementById("custom-color-input");
            if (customInput) customInput.value = c;
          });
          picker.appendChild(sw);
        });

        // Free color picker so user can choose ANY color
        const customWrap = document.createElement("div");
        customWrap.className = "color-custom-wrap";
        customWrap.innerHTML = `
          <label>Custom</label>
          <input type="color" id="custom-color-input" value="${savedColor}" title="Pick any color" />
        `;
        picker.appendChild(customWrap);

        document.getElementById("custom-color-input").addEventListener("input", (e) => {
          const color = e.target.value;
          document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("active"));
          setPrimaryColor(color);
        });
      } else {
        // User does NOT have main color permission → hide the section completely
        colorSection.style.display = "none";
        // Reset to default blue so they cannot keep a previous custom color
        setPrimaryColor("#2481cc");
        localStorage.removeItem("bsmfi_primary");
      }

      const notice = document.getElementById("special-notice");
      if (currentUser.showSpecialNotice === "yes" && currentUser.specialNoticeText) {
        notice.textContent = currentUser.specialNoticeText;
        notice.style.display = "block";
      } else {
        notice.style.display = "none";
      }

      const custom = document.getElementById("custom-content");
      if (currentUser.showCustomContent === "yes" && currentUser.customContent) {
        custom.style.display = "block";
        if (currentUser.customContent.type === "image") {
          custom.innerHTML = `<img src="${currentUser.customContent.value}" alt="Offer" onclick="window.open('${currentUser.customContent.url}', '_blank')" />`;
        }
      } else {
        custom.style.display = "none";
      }

      renderLoanList();
      renderServices();
      configureBottomNav();
      switchView("amounts");
    }

    // ===================== LOAN LIST =====================
    function renderLoanList() {
      const list = document.getElementById("loan-list");
      const loans = currentUser.loans || [];

      if (loans.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
            <p>No active loans</p>
          </div>`;
        return;
      }

      list.innerHTML = loans.map((loan, i) => {
        const left = daysLeft(loan.return);
        const status = left < 0 ? `<span style="color:var(--danger)">Overdue ${Math.abs(left)}d</span>` :
                       left === 0 ? `<span style="color:var(--warning)">Due today</span>` :
                       `${left} days left`;
        // Show the actual amount as the main title instead of "Amount 1"
        return `
          <div class="loan-item" data-index="${i}">
            <div class="loan-avatar">${i + 1}</div>
            <div class="loan-info">
              <h3>${formatMoney(loan.amount)}</h3>
              <p>${status} · Return ${formatDate(loan.return)}</p>
            </div>
            <div class="loan-amount"></div>
          </div>`;
      }).join("");

      list.querySelectorAll(".loan-item").forEach(el => {
        el.addEventListener("click", () => openChat(+el.dataset.index));
      });
    }

    // ===================== CHAT =====================
    function openChat(index) {
      currentLoanIndex = index;
      const loan = currentUser.loans[index];
      document.getElementById("header-title").textContent = formatMoney(loan.amount);
      document.getElementById("header-sub").textContent = `Loan ${index + 1}`;
      document.getElementById("back-btn").style.display = "block";
      document.getElementById("bottom-nav").style.display = "none";

      const msgs = document.getElementById("chat-messages");
      msgs.innerHTML = "";

      addBotMsg(`Hello ${currentUser.displayName}! 👋\nThis is the details for <b>${formatMoney(loan.amount)}</b>.\n\nSelect an option below to get information.`);

      const options = [
        { id: "interest", label: "Interest" },
        { id: "taken", label: "Taken on" },
        { id: "return", label: "Return on" },
        { id: "days", label: "Days left" },
        { id: "overdue", label: "Overdue fee" },
      ];

      const row = document.getElementById("options-row");
      row.innerHTML = options.map(o => `<button class="option-btn" data-opt="${o.id}">${o.label}</button>`).join("");

      row.querySelectorAll(".option-btn").forEach(btn => {
        btn.addEventListener("click", () => handleOption(btn.dataset.opt, loan, index));
      });

      switchView("chat", false);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addBotMsg(html) {
      const msgs = document.getElementById("chat-messages");
      const div = document.createElement("div");
      div.className = "msg bot";
      div.innerHTML = html + `<div class="time">${nowTime()}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addUserMsg(text) {
      const msgs = document.getElementById("chat-messages");
      const div = document.createElement("div");
      div.className = "msg user";
      div.innerHTML = text + `<div class="time">${nowTime()}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function handleOption(opt, loan, index) {
      const labels = {
        interest: "Interest",
        taken: "Taken on",
        return: "Return on",
        days: "Days left",
        overdue: "Overdue fee"
      };
      addUserMsg(labels[opt]);

      setTimeout(() => {
        let reply = "";
        switch (opt) {
          case "interest":
            reply = `Interest amount: <b>${formatMoney(loan.interest)}</b>`;
            if (currentUser.fixedInterest) {
              reply += `<br>Fixed interest rate: ${currentUser.fixedInterest}%`;
            }
            break;
          case "taken":
            reply = `Borrowed on: <b>${formatDate(loan.borrowed)}</b>`;
            break;
          case "return":
            reply = `Return date: <b>${formatDate(loan.return)}</b>`;
            break;
          case "days": {
            const d = daysLeft(loan.return);
            if (d < 0) reply = `⚠️ This loan is <b>overdue by ${Math.abs(d)} day(s)</b>.`;
            else if (d === 0) reply = `⏰ This loan is <b>due today</b>.`;
            else reply = `Days remaining: <b>${d} day(s)</b>`;
            break;
          }
          case "overdue":
            reply = `Overdue fee: <b>${formatMoney(loan.overdueFee)}</b> per day (if applicable)`;
            break;
        }
        addBotMsg(reply);
      }, 300);
    }

    // ===================== SERVICES =====================
   function renderServices() {
  const grid = document.getElementById("services-grid");

  const services = [
    { key: "Delay It", icon: "⏳", desc: "Extend your due date", url: "https://your-site.com/delay-it" },

    // ===================== BOTTOM NAV VISIBILITY =====================
    function configureBottomNav() {
      const nav = document.getElementById("bottom-nav");
      if (!nav || !currentUser) return;

      const shouldShow = currentUser.showBottomNav !== "no";
      nav.style.display = shouldShow ? "flex" : "none";

      const allowedItems = Array.isArray(currentUser.bottomNavItems)
        ? currentUser.bottomNavItems
        : ["amounts", "borrow", "settings"];

      nav.querySelectorAll("button[data-view]").forEach(button => {
        const allowed = allowedItems.includes(button.dataset.view);
        button.style.display = allowed ? "flex" : "none";
        button.classList.toggle("active", button.dataset.view === currentView);
        button.setAttribute("aria-current", button.dataset.view === currentView ? "page" : "false");
      });

      // If the current section is hidden from the bottom bar, keep the section
      // open but do not leave a different item highlighted.
    }

    // ===================== NAVIGATION =====================
    function switchView(view, updateNav = true) {
      currentView = view;
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      document.getElementById("view-" + view).classList.add("active");

      if (updateNav) {
        document.getElementById("back-btn").style.display = "none";
        configureBottomNav();
        document.getElementById("header-sub").textContent = currentUser.displayName + " · " + currentUser.premiumType;

        const titles = { amounts: "Amounts", borrow: "Borrow", settings: "Settings" };
        document.getElementById("header-title").textContent = titles[view] || view;

        configureBottomNav();
      }
    }

    document.getElementById("back-btn").addEventListener("click", () => {
      switchView("amounts");
    });

    document.querySelectorAll("#bottom-nav button").forEach(btn => {
      btn.addEventListener("click", () => switchView(btn.dataset.view));
    });

    // Theme toggle
    document.getElementById("theme-toggle").addEventListener("click", () => {
      document.body.classList.toggle("light");
      const isLight = document.body.classList.contains("light");
      document.getElementById("theme-label").textContent = isLight ? "Light" : "Dark";
      localStorage.setItem("bsmfi_theme", isLight ? "light" : "dark");
    });

    // Logout
    document.getElementById("logout-btn").addEventListener("click", () => {
      currentUser = null;
      document.getElementById("app").style.display = "none";
      document.getElementById("login-view").style.display = "flex";
      document.getElementById("password-input").value = "";
      document.getElementById("login-error").textContent = "";
    });

    // Settings pages
    document.querySelectorAll(".settings-item[data-page]").forEach(item => {
      item.addEventListener("click", () => openPage(item.dataset.page));
    });

    document.getElementById("page-back").addEventListener("click", () => {
      document.getElementById("page-overlay").classList.remove("active");
    });

            <label>Reason</label>
            <textarea id="late-reason" placeholder="Briefly explain the situation..."></textarea>
          </div>
          <div class="form-group">
            <label>Expected new payment date</label>
            <input type="date" id="late-date" />
          </div>
          <button class="btn" id="late-submit">Notify Team</button>`;
        setTimeout(() => {
          document.getElementById("late-submit")?.addEventListener("click", () => {
            showToast("Notification sent. Our team will contact you.");
            document.getElementById("page-overlay").classList.remove("active");
          });
        }, 50);
      } else if (page === "helper") {
        content.innerHTML = `
          <h2>Helper</h2>
          <p>Quick answers to common questions.</p>
          <h3>How do I check my loan details?</h3>
          <p>Go to the Amounts tab and tap any Amount card. A chat-style view will open with options.</p>
          <h3>What is "Delay It"?</h3>
          <p>It allows eligible users to request an extension of the due date (subject to approval and fees).</p>
          <h3>What is Split Pay?</h3>
          <p>Split the outstanding amount into smaller installments if the feature is enabled for your account.</p>
          <h3>Need more help?</h3>
          <p>Contact support through your relationship manager or official channels.</p>
          <button class="btn btn-outline" style="margin-top:20px;" onclick="showToast('Support chat coming soon')">Contact Support</button>`;
      }

      document.getElementById("page-overlay").classList.add("active");
    }

    // Prevent zoom on double tap (mobile)
    document.addEventListener("gesturestart", e => e.preventDefault());
  </script>
</body>
</html>
