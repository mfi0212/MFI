<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSL | వడ్డీ ట్రాకర్</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fc;
      --surface: #ffffff;
      --fg: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --primary-fg: #ffffff;
      --accent: #0f172a;
      --accent-soft: #f1f5f9;
      --success: #059669;
      --destructive: #dc2626;
      --destructive-hover: #b91c1c;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
      --radius: 12px;
      --radius-sm: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      letter-spacing: -0.01em;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      font-size: 16px;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.5;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
    }

    /* Top Banner */
    .top-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 5px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #fff;
      font-size: 0.8125em;
      font-weight: 500;
    }

    .top-banner a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      transition: color 0.2s ease;
      position: relative;
    }

    .top-banner a:hover {
      color: #fff;
    }

    .top-banner a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: #fff;
      transition: width 0.25s ease;
    }

    .top-banner a:hover::after {
      width: 100%;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 5px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-wrap: wrap;
    }

    .header h2 {
      font-size: 1.375em;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--fg);
    }

    .today {
      font-size: 0.8125em;
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
      background: var(--accent-soft);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .font-controls {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .font-btn {
      width: 36px;
      height: 36px;
      background: transparent;
      color: var(--fg);
      border: none;
      border-right: 1px solid var(--border);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .font-btn:last-of-type {
      border-right: none;
    }

    .font-btn:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .font-size-label {
      min-width: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8125em;
      font-weight: 600;
      border-right: 1px solid var(--border);
      background: var(--accent-soft);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .lang-btn {
      height: 36px;
      padding: 0 12px;
      background: transparent;
      color: var(--fg);
      border: none;
      border-left: 1px solid var(--border);
      font-size: 0.75em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .lang-btn:hover {
      background: var(--fg);
      color: var(--bg);
    }

    /* Navigation */
    .navigation {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0;
      padding: 10px 5px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .nav-btn,
    .total-btn {
      min-height: 42px;
      background: transparent;
      color: var(--muted);
      border: none;
      font-size: 0.875em;
      font-weight: 600;
      cursor: pointer;
      padding: 0 18px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
      position: relative;
    }

    .nav-btn:hover {
      color: var(--fg);
      background: var(--accent-soft);
    }

    .nav-btn.active {
      color: var(--primary);
      background: rgba(30, 58, 138, 0.08);
    }

    .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 18px;
      right: 18px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
    }

    .total-btn {
      background: var(--fg);
      color: var(--bg);
      margin-left: 8px;
      box-shadow: var(--shadow-sm);
    }

    .total-btn:hover {
      background: var(--primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    /* Sections */
    .section {
      display: none;
      padding-bottom: 24px;
    }

    .section.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      padding: 20px 20px 12px;
      font-size: 0.75em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    /* User / Entries */
    .user {
      margin: 0 5px;
    }

    .user-name {
      padding: 12px 16px;
      font-size: 0.9375em;
      font-weight: 700;
      background: var(--accent-soft);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      text-align: center;
      color: var(--fg);
      border: 1px solid var(--border);
      border-bottom: none;
    }

    .entry {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }

    .entry:hover {
      box-shadow: var(--shadow);
    }

    .entry:last-child {
      margin-bottom: 0;
    }

    .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 11px 16px;
      font-size: 0.875em;
      border-bottom: 1px solid var(--border);
      min-height: 42px;
    }

    .entry-row:last-child {
      border-bottom: none;
    }

    .entry-row .label {
      font-weight: 500;
      color: var(--muted);
    }

    .entry-row .value {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--fg);
      overflow-wrap: anywhere;
    }

    .paid-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      min-height: 48px;
      background: #fafbfc;
    }

    .paid-input {
      width: 120px;
      min-width: 0;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      text-align: right;
      font-size: 0.9375em;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      outline: none;
      transition: all 0.15s ease;
      color: var(--fg);
    }

    .paid-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
    }

    .remaining {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.875em;
      font-weight: 600;
    }

    .entry-total {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.9375em;
      font-weight: 700;
    }

    /* Notes */
    .notes-box {
      margin: 0 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      background: var(--surface);
    }

    .note-input {
      display: block;
      width: 100%;
      min-height: 130px;
      padding: 16px;
      resize: vertical;
      border: none;
      border-bottom: 1px solid var(--border);
      font-size: 0.9375em;
      line-height: 1.6;
      outline: none;
      background: var(--surface);
      color: var(--fg);
      transition: background 0.15s ease;
    }

    .note-input:focus {
      background: #fafbfc;
    }

    .note-input::placeholder {
      color: var(--muted);
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: var(--primary-fg);
      border: none;
      font-size: 0.9375em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .save-btn:hover {
      background: var(--primary-hover);
    }

    .note {
      position: relative;
      padding: 16px 48px 16px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s ease;
    }

    .note:hover {
      background: #fafbfc;
    }

    .note:last-child {
      border-bottom: none;
    }

    .note-text {
      font-size: 0.9375em;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
      color: var(--fg);
    }

    .note-date {
      margin-top: 8px;
      font-size: 0.75em;
      color: var(--muted);
      font-weight: 500;
    }

    .delete-note {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 20px;
      cursor: pointer;
      font-weight: 400;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .delete-note:hover {
      background: #fef2f2;
      color: var(--destructive);
      border-color: #fecaca;
    }

    .empty-notes {
      padding: 40px 20px;
      text-align: center;
      font-size: 0.875em;
      color: var(--muted);
      font-weight: 500;
    }

    /* Footer */
    footer {
      font-size: 0.75em;
      text-align: center;
      color: var(--muted);
      padding: 24px 20px 28px;
      border-top: 1px solid var(--border);
      font-weight: 500;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeOverlay 0.2s ease;
    }

    .modal-overlay.show {
      display: flex;
    }

    @keyframes fadeOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 1.0625em;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      background: var(--accent-soft);
      color: var(--fg);
      border: none;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .modal-close:hover {
      background: var(--destructive);
      color: #fff;
    }

    .modal-summary {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #fff;
      padding: 24px 20px;
      border-radius: 0 0 var(--radius) var(--radius);
    }

    .modal-summary .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      font-size: 0.9375em;
      font-weight: 500;
    }

    .modal-summary .row span:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .modal-summary .row:last-child {
      margin-bottom: 0;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 700;
      font-size: 1.125em;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .header h2 {
        font-size: 1.2em;
      }

      .font-btn {
        width: 32px;
        height: 32px;
      }

      .font-size-label {
        min-width: 30px;
        height: 32px;
      }

      .lang-btn {
        height: 32px;
        padding: 0 10px;
      }

      .nav-btn,
      .total-btn {
        padding: 0 12px;
        font-size: 0.8125em;
      }


      .section-title {
        padding: 16px 16px 10px;
      }

      .notes-box {
        margin: 0 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-banner">
      <a href="https://mfi0212.github.io/personal/gold.market.divert.user">బంగారం/వెండి market</a>

    </div>

    <div class="header">
      <h2 id="title">వడ్డీ</h2>

        <button class="font-btn" onclick="changeFontSize(-1)" title="Decrease font">−</button>
        <span class="font-size-label" id="fontSizeLabel">16</span>
        <button class="font-btn" onclick="changeFontSize(1)" title="Increase font">+</button>
        <button class="lang-btn" onclick="toggleLanguage()">తె/ENG</button>
      </div>
    </div>

    <div class="navigation">
      <button class="nav-btn active" id="interestNav" onclick="showSection('interest')">వడ్డీ</button>

      <button class="total-btn" id="totalBtn" onclick="openTotalPopup()">మొత్తం</button>
    </div>

    <section id="interestSection" class="section active">
      <h3 class="section-title" id="interestTitle">వడ్డీ వివరాలు</h3>
      <div id="app"></div>
    </section>

    <section id="notesSection" class="section">
      <h3 class="section-title" id="notesTitle">గమనికలు</h3>
      <div class="notes-box">
        <textarea id="noteInput" class="note-input" placeholder="ఇక్కడ ఏదైనా రాయండి..."></textarea>

    <footer>VSL, All rights reserved.<br>Version (v.02.22.9) <br><br><span style="font-size: 12px;">Powered by Black Swan</span> </footer>
  </div>

  <div class="modal-overlay" id="totalModal" onclick="closeTotalPopup(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">మొత్తం వివరాలు</h3>
        <button class="modal-close" onclick="closeTotalPopup()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const users = [

          }
        ]
      }
    ];

    let currentLang = "te";
    let currentFontSize = 16;

    const FONT_SIZE_KEY = "interestTrackerFontSize";
    const MIN_FONT = 12;
    const MAX_FONT = 28;
    const NOTES_KEY = "interestTrackerNotes";
    const PAID_KEY = "interestTrackerPaidAmounts";

    const lang = {
      en: {
        title: "VSL | Interest",
        today: "Today",
        interestTitle: "Interest Details",
        notesTitle: "Notes",
        amount: "Taken Amount",

        interestPaid: "Interest Paid",
        remaining: "Remaining Interest",
        entryTotal: "Total (Amount + Interest)",
        interestNav: "Interest",
        notesNav: "Notes",
        totalBtn: "Total",
        modalTitle: "Total Summary",
        sumPrincipal: "Total Principal",
        sumInterest: "Total Remaining Interest",
        grandTotal: "Grand Total",
        placeholder: "Write something here...",
        save: "Save",
        emptyNotes: "No notes saved yet.",
        delete: "Delete"
      },
      te: {
        title: "VSL | వడ్డీ",
        today: "ఈరోజు",
        interestTitle: "వడ్డీ వివరాలు",
        notesTitle: "గమనికలు",
        amount: "తీసుకున్న డబ్బు",
        interest: "వడ్డీ",
        takenDate: "తీసుకున్న తేదీ",
        borrowedBy: "తీసుకున్న వ్యక్తి",
        days: "గడిచిన రోజులు",
        interestPaid: "చెల్లించిన వడ్డీ",
        remaining: "మిగిలిన వడ్డీ",
        entryTotal: "మొత్తం (అసలు + వడ్డీ)",
        interestNav: "వడ్డీ",
        notesNav: "గమనికలు",
        totalBtn: "మొత్తం",
        modalTitle: "మొత్తం వివరాలు",
        sumPrincipal: "మొత్తం అసలు",
        sumInterest: "మొత్తం మిగిలిన వడ్డీ",
        grandTotal: "మొత్తం",
        placeholder: "ఇక్కడ ఏదైనా రాయండి...",
        save: "సేవ్ చేయండి",
        emptyNotes: "ఇంకా గమనికలు సేవ్ చేయలేదు.",
        delete: "తొలగించు"
      }
    };

    const monthNames = {
      en: [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
      ],
      te: [
        "జనవరి", "ఫిబ్రవరి", "మార్చి", "ఏప్రిల్", "మే", "జూన్",
        "జూలై", "ఆగస్టు", "సెప్టెంబర్", "అక్టోబర్", "నవంబర్", "డిసెంబర్"
      ]
    };

    function loadFontSize() {
      const saved = localStorage.getItem(FONT_SIZE_KEY);
      if (saved) {
        const size = parseInt(saved, 10);
        if (!isNaN(size) && size >= MIN_FONT && size <= MAX_FONT) {
          currentFontSize = size;
        }
      }
      applyFontSize();
    }

    function applyFontSize() {
      document.body.style.fontSize = currentFontSize + "px";
      document.getElementById("fontSizeLabel").textContent = currentFontSize;
    }

    function changeFontSize(delta) {
      const newSize = currentFontSize + delta;
      if (newSize < MIN_FONT || newSize > MAX_FONT) return;
      currentFontSize = newSize;
      applyFontSize();
      localStorage.setItem(FONT_SIZE_KEY, currentFontSize);
    }

    function showSection(section) {
      const interestSection = document.getElementById("interestSection");
      const notesSection = document.getElementById("notesSection");
      const interestNav = document.getElementById("interestNav");
      const notesNav = document.getElementById("notesNav");

      if (section === "interest") {
        interestSection.classList.add("active");
        notesSection.classList.remove("active");
        interestNav.classList.add("active");
        notesNav.classList.remove("active");
      }

      if (section === "notes") {
        interestSection.classList.remove("active");
        notesSection.classList.add("active");
        interestNav.classList.remove("active");
        notesNav.classList.add("active");
        renderNotes();
      }
    }

    function parseDate(dateStr) {
      const parts = dateStr.split("-");
      return new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
      );
    }

    function formatDateWithMonth(dateStr) {
      const d = parseDate(dateStr);
      return `${d.getDate()} ${monthNames[currentLang][d.getMonth()]} ${d.getFullYear()}`;
    }

    function getDays(takenDate) {
      const start = parseDate(takenDate);
      const today = new Date();
      start.setHours(0, 0, 0, 0);
      today.setHours(0, 0, 0, 0);
      return Math.max(0, Math.floor((today - start) / 86400000));
    }

    function showToday() {
      const today = new Date();
      document.getElementById("todayDate").innerText =
        `${lang[currentLang].today}: ${today.getDate()} ${monthNames[currentLang][today.getMonth()]} ${today.getFullYear()}`;
    }

    function toggleLanguage() {
      currentLang = currentLang === "en" ? "te" : "en";
      updateLanguage();
      render();
      renderNotes();
    }

    function updateLanguage() {
      const t = lang[currentLang];
      document.documentElement.lang = currentLang;
      document.title = t.title;
      document.getElementById("title").innerText = t.title;
      document.getElementById("interestTitle").innerText = t.interestTitle;
      document.getElementById("notesTitle").innerText = t.notesTitle;
      document.getElementById("interestNav").innerText = t.interestNav;
      document.getElementById("notesNav").innerText = t.notesNav;
      document.getElementById("totalBtn").innerText = t.totalBtn;
      document.getElementById("modalTitle").innerText = t.modalTitle;
      document.getElementById("noteInput").placeholder = t.placeholder;
      document.getElementById("saveButton").innerText = t.save;
      showToday();
    }

    function loadPaidAmounts() {
      try {
        const saved = JSON.parse(localStorage.getItem(PAID_KEY));
        if (saved && typeof saved === "object") {
          users.forEach((user, userIndex) => {
            user.entries.forEach((entry, entryIndex) => {
              const key = `${userIndex}-${entryIndex}`;
              if (Object.prototype.hasOwnProperty.call(saved, key)) {
                entry.interestPaid = Math.max(0, Number(saved[key]) || 0);
              }
            });
          });
        }
      } catch (error) {
        console.error("Unable to load saved interest payments.", error);
      }
    }

    function savePaidAmounts() {
      const paid = {};
      users.forEach((user, userIndex) => {
        user.entries.forEach((entry, entryIndex) => {
          paid[`${userIndex}-${entryIndex}`] = entry.interestPaid;
        });
      });
      localStorage.setItem(PAID_KEY, JSON.stringify(paid));
    }

    function getEntryData(entry) {
      const days = getDays(entry.takenDate);
      const totalInterest = Math.round(
        (entry.amount * entry.interest * days) / (100 * 30)
      );
      const remaining = Math.max(0, totalInterest - entry.interestPaid);
      const total = entry.amount + remaining;
      return { days, totalInterest, remaining, total };
    }

    function formatMoney(amount) {
      return "₹" + Number(amount).toLocaleString("en-IN");
    }

    function render() {
      const app = document.getElementById("app");
      const t = lang[currentLang];
      app.innerHTML = "";

      users.forEach(user => {
        const userElement = document.createElement("div");
        userElement.className = "user";

        const userName = document.createElement("div");
        userName.className = "user-name";
        userName.textContent = user.name;
        userElement.appendChild(userName);

        user.entries.forEach((entry, entryIndex) => {
          const { days, remaining, total } = getEntryData(entry);
          const entryElement = document.createElement("div");
          entryElement.className = "entry";

          entryElement.innerHTML = `
            <div class="entry-row">
              <span class="label">${t.amount}</span>
              <span class="value">${formatMoney(entry.amount)}</span>
            </div>
            <div class="entry-row">
              <span class="label">${t.borrowedBy}</span>
              <span class="value borrowed-value"></span>
            </div>
            <div class="entry-row">
              <span class="label">${t.interest}</span>
              <span class="value">${entry.interest}%</span>
            </div>
            <div class="entry-row">
              <span class="label">${t.takenDate}</span>
              <span class="value">${formatDateWithMonth(entry.takenDate)}</span>
            </div>
            <div class="entry-row">
              <span class="label">${t.days}</span>
              <span class="value">${days}</span>
            </div>
            <div class="paid-row">
              <span class="label">${t.interestPaid}</span>
              <input
                class="paid-input"
                type="number"
                min="0"
                step="1"
                aria-label="${t.interestPaid}"
                value="${entry.interestPaid}"
                data-entry-index="${entryIndex}"
              >
            </div>
            <div class="remaining">
              <span class="label">${t.remaining}</span>
              <span class="value">${formatMoney(remaining)}</span>
            </div>
            <div class="entry-total">
              <span class="label">${t.entryTotal}</span>
              <span class="value">${formatMoney(total)}</span>
            </div>
          `;

          entryElement.querySelector(".borrowed-value").textContent =
            entry.borrowedBy || "-";

          const paidInput = entryElement.querySelector(".paid-input");

          paidInput.addEventListener("change", function () {
            const value = Math.max(0, Number(this.value) || 0);
            entry.interestPaid = value;
            savePaidAmounts();
            render();
          });

          paidInput.addEventListener("input", function () {
            entry.interestPaid = Math.max(0, Number(this.value) || 0);
            savePaidAmounts();
            const { remaining, total } = getEntryData(entry);
            const remainingElement = entryElement.querySelector(".remaining .value");
            const totalElement = entryElement.querySelector(".entry-total .value");
            remainingElement.textContent = formatMoney(remaining);
            totalElement.textContent = formatMoney(total);
          });

          userElement.appendChild(entryElement);
        });

        app.appendChild(userElement);
      });
    }

    function openTotalPopup() {
      const t = lang[currentLang];
      const body = document.getElementById("modalBody");

      let grandPrincipal = 0;
      let grandRemaining = 0;

      users.forEach(user => {
        user.entries.forEach(entry => {
          const { remaining } = getEntryData(entry);
          grandPrincipal += entry.amount;
          grandRemaining += remaining;
        });
      });

      const grandTotal = grandPrincipal + grandRemaining;

      body.innerHTML = `
        <div class="modal-summary">
          <div class="row">
            <span>${t.sumPrincipal}</span>
            <span>${formatMoney(grandPrincipal)}</span>
          </div>
          <div class="row">
            <span>${t.sumInterest}</span>
            <span>${formatMoney(grandRemaining)}</span>
          </div>
          <div class="row">
            <span>${t.grandTotal}</span>
            <span>${formatMoney(grandTotal)}</span>
          </div>
        </div>
      `;

      document.getElementById("totalModal").classList.add("show");
    }

    function closeTotalPopup(event) {
      if (!event || event.target.id === "totalModal") {
        document.getElementById("totalModal").classList.remove("show");
      }
    }

    function getNotes() {
      try {
        return JSON.parse(localStorage.getItem(NOTES_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveNote() {
      const input = document.getElementById("noteInput");
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      const notes = getNotes();
      notes.unshift({
        id: Date.now(),
        text,
        date: new Date().toISOString()
      });
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      input.value = "";
      renderNotes();
    }

    function deleteNote(id) {
      const notes = getNotes().filter(note => note.id !== id);
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      renderNotes();
    }

    function formatNoteDate(dateString) {
      const date = new Date(dateString);
      const hours = String(date.getHours()).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");
      return `${date.getDate()} ${monthNames[currentLang][date.getMonth()]} ${date.getFullYear()}, ${hours}:${minutes}`;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderNotes() {
      const list = document.getElementById("notesList");
      const notes = getNotes();
      const t = lang[currentLang];

      if (notes.length === 0) {
        list.innerHTML = `<div class="empty-notes">${t.emptyNotes}</div>`;
        return;
      }

      list.innerHTML = notes.map(note => `
        <div class="note">
          <button class="delete-note" onclick="deleteNote(${Number(note.id)})" title="${t.delete}">×</button>
          <div class="note-text">${escapeHTML(note.text)}</div>
          <div class="note-date">${formatNoteDate(note.date)}</div>
        </div>
      `).join("");
    }

    loadFontSize();
    loadPaidAmounts();
    updateLanguage();
    render();
    renderNotes();
  </script>
</body>
</html>
