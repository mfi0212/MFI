<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>వడ్డీ ట్రాకర్</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --border: #1a1a1a;
      --card: #ffffff;
      --muted-bg: #f4f4f4;
      --primary: #0025ff;
      --primary-fg: #ffffff;
      --accent: #0025ff;
      --destructive: #c0392b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0 !important;
      letter-spacing: 0;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 16px;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.35;
    }


  </style>
</head>
<body>
  <div class="container">
    <div class="top-banner">
      <a href="https://mfi0212.github.io/personal/gold.market.divert.user.html">బంగారం/వెండి market</a>
    </div>

    <div class="header">
      <h2 id="title">వడ్డీ</h2>
      <div class="today" id="todayDate"></div>
      <div class="font-controls">
        <button class="font-btn" onclick="changeFontSize(-1)" title="Decrease font">−</button>
        <span class="font-size-label" id="fontSizeLabel">16</span>
        <button class="font-btn" onclick="changeFontSize(1)" title="Increase font">+</button>
        <button class="lang-btn" onclick="toggleLanguage()">తె/ENG</button>
      </div>
    </div>

    <div class="navigation">
      <button class="nav-btn active" id="interestNav" onclick="showSection('interest')">వడ్డీ</button>
      <button class="nav-btn" id="notesNav" onclick="showSection('notes')">గమనికలు</button>
      <button class="total-btn" id="totalBtn" onclick="openTotalPopup()">మొత్తం</button>
    </div>

    <section id="interestSection" class="section active">
      <h3 class="section-title" id="interestTitle">వడ్డీ వివరాలు</h3>
      <div id="app"></div>
    </section>

    <section id="notesSection" class="section">
      <h3 class="section-title" id="notesTitle">గమనికలు</h3>
      <div class="notes-box">
        <textarea id="noteInput" class="note-input" placeholder="ఇక్కడ ఏదైనా రాయండి..."></textarea>
        <button class="save-btn" id="saveButton" onclick="saveNote()">సేవ్ చేయండి</button>
        <div id="notesList" class="notes-list"></div>
      </div>
    </section>

    <footer>VSL, All right reserved. <br> Version(v.02.22.9)</footer>
  </div>

  <!-- TOTAL POPUP -->
  <div class="modal-overlay" id="totalModal" onclick="closeTotalPopup(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">మొత్తం వివరాలు</h3>
        <button class="modal-close" onclick="closeTotalPopup()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const users = [
      {
        name: "Pawan naidu/పవన్ నాయుడు",
        entries: [
          { amount: 40000, interest: 2, takenDate: "2026-05-30", interestPaid: 2800 },
          { amount: 47800, interest: 2, takenDate: "2026-09-12", interestPaid: 0 },
          { amount: 12200, interest: 2, takenDate: "2026-09-12", interestPaid: 0 },
        ]
      },
    ];
    let currentLang = "te";
    let currentFontSize = 16;

    const FONT_SIZE_KEY = "interestTrackerFontSize";
    const MIN_FONT = 12;
    const MAX_FONT = 28;

    const lang = {
      en: {
        title: "Interest",
        today: "Today",
        interestTitle: "",
        notesTitle: "Notes",
        amount: "Taken Amount",
        interest: "Interest",
        takenDate: "Taken Date",
        days: "Days Passed",
        interestPaid: "Interest Paid",
        remaining: "Remaining Interest",
        entryTotal: "Total (Amt + Interest)",
        interestNav: "Interest",
        notesNav: "Notes",
        totalBtn: "Total",
        modalTitle: "Total Summary",
        principal: "Principal",
        remainingInterest: "Remaining Interest",
        entryTotalLabel: "Total",
        sumPrincipal: "Total Principal",
        sumInterest: "Total Remaining Interest",
        grandTotal: "Grand Total",
        placeholder: "Write something here...",
        save: "Save",
        emptyNotes: "No notes saved yet.",
        delete: "Delete"
      },
      te: {
        title: "వడ్డీ",
        today: "ఈరోజు",
        interestTitle: "",
        notesTitle: "గమనికలు",
        amount: "తీసుకున్న డబ్బు",
        interest: "వడ్డీ",
        takenDate: "తీసుకున్న తేదీ",
        days: "గడిచినా రోజులు",
        interestPaid: "చెల్లించిన వడ్డీ",
        remaining: "మిగిలిన వడ్డీ",
        entryTotal: "మొత్తం",
        interestNav: "వడ్డీ",
        notesNav: "గమనికలు",
        totalBtn: "మొత్తం",
        modalTitle: "మొత్తం వివరాలు",
        principal: "అసలు",
        remainingInterest: "మిగిలిన వడ్డీ",
        entryTotalLabel: "మొత్తం",
        sumPrincipal: "మొత్తం అసలు",
        sumInterest: "మొత్తం మిగిలిన వడ్డీ",
        grandTotal: "మొత్తం",
        placeholder: "ఇక్కడ ఏదైనా రాయండి...",
        save: "సేవ్ చేయండి",
        emptyNotes: "ఇంకా గమనికలు సేవ్ చేయలేదు.",
        delete: "తొలగించు"
      }
    };

    const monthNames = {
      en: ["January","February","March","April","May","June","July","August","September","October","November","December"],
      te: ["జనవరి","ఫిబ్రవరి","మార్చి","ఏప్రిల్","మే","జూన్","జూలై","ఆగస్టు","సెప్టెంబర్","అక్టోబర్","నవంబర్","డిసెంబర్"]
    };

    function loadFontSize() {
      const saved = localStorage.getItem(FONT_SIZE_KEY);
      if (saved) {
        const size = parseInt(saved, 10);
        if (!isNaN(size) && size >= MIN_FONT && size <= MAX_FONT) {
          currentFontSize = size;
        }
      }
      applyFontSize();
    }

    function applyFontSize() {
      document.body.style.fontSize = currentFontSize + "px";
      document.getElementById("fontSizeLabel").textContent = currentFontSize;
    }

    function changeFontSize(delta) {
      const newSize = currentFontSize + delta;
      if (newSize < MIN_FONT || newSize > MAX_FONT) return;
      currentFontSize = newSize;
      applyFontSize();
      localStorage.setItem(FONT_SIZE_KEY, currentFontSize);
    }

    function showSection(section) {
      const interestSection = document.getElementById("interestSection");
      const notesSection = document.getElementById("notesSection");
      const interestNav = document.getElementById("interestNav");
      const notesNav = document.getElementById("notesNav");

      if (section === "interest") {
        interestSection.classList.add("active");
        notesSection.classList.remove("active");
        interestNav.classList.add("active");
        notesNav.classList.remove("active");
      }
      if (section === "notes") {
        interestSection.classList.remove("active");
        notesSection.classList.add("active");
        interestNav.classList.remove("active");
        notesNav.classList.add("active");
        renderNotes();
      }
    }

    function parseDate(dateStr) {
      const parts = dateStr.split("-");
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }

    function formatDateWithMonth(dateStr) {
      const d = parseDate(dateStr);
      return `${d.getDate()} ${monthNames[currentLang][d.getMonth()]} ${d.getFullYear()}`;
    }

    function getDays(takenDate) {
      const start = parseDate(takenDate);
      const today = new Date();
      start.setHours(0, 0, 0, 0);
      today.setHours(0, 0, 0, 0);
      return Math.max(0, Math.floor((today - start) / 86400000));
    }

    function showToday() {
      const today = new Date();
      document.getElementById("todayDate").innerText =
        `${lang[currentLang].today}: ${today.getDate()} ${monthNames[currentLang][today.getMonth()]} ${today.getFullYear()}`;
    }

    function toggleLanguage() {
      currentLang = currentLang === "en" ? "te" : "en";
      updateLanguage();
      render();
      renderNotes();
    }

    function updateLanguage() {
      const t = lang[currentLang];
      document.documentElement.lang = currentLang;
      document.title = t.title;
      document.getElementById("title").innerText = t.title;
      document.getElementById("interestTitle").innerText = t.interestTitle;
      document.getElementById("notesTitle").innerText = t.notesTitle;
      document.getElementById("interestNav").innerText = t.interestNav;
      document.getElementById("notesNav").innerText = t.notesNav;
      document.getElementById("totalBtn").innerText = t.totalBtn;
      document.getElementById("modalTitle").innerText = t.modalTitle;
      document.getElementById("noteInput").placeholder = t.placeholder;
      document.getElementById("saveButton").innerText = t.save;
      showToday();
    }

    function getEntryData(entry) {
      const days = getDays(entry.takenDate);
      const totalInterest = Math.round((entry.amount * entry.interest * days) / (100 * 30));
      const remaining = Math.max(0, totalInterest - entry.interestPaid);
      const total = entry.amount + remaining;
      return { days, totalInterest, remaining, total };
    }

    function render() {
      const app = document.getElementById("app");
      const t = lang[currentLang];
      app.innerHTML = "";

      users.forEach((user, userIndex) => {
        const entriesHTML = user.entries.map((entry, entryIndex) => {
          const { days, remaining, total } = getEntryData(entry);

          return `
            <div class="entry">
              <div class="entry-row">
                <span class="label">${t.amount}</span>
                <span class="value">₹${Number(entry.amount).toLocaleString("en-IN")}</span>
              </div>
              <div class="entry-row">
                <span class="label">${t.interest}</span>
                <span class="value">${entry.interest}%</span>
              </div>
              <div class="entry-row">
                <span class="label">${t.takenDate}</span>
                <span class="value">${formatDateWithMonth(entry.takenDate)}</span>
              </div>
              <div class="entry-row">
                <span class="label">${t.days}</span>
                <span class="value">${days}</span>
              </div>
              <div class="paid-row">
                <span class="label">${t.interestPaid}</span>
                <input class="paid-input" type="number" min="0" value="${entry.interestPaid}"
                  oninput="updatePaid(${userIndex}, ${entryIndex}, this.value)">
              </div>
              <div class="remaining">
                <span class="label">${t.remaining}</span>
                <span class="value">₹${remaining.toLocaleString("en-IN")}</span>
              </div>
              <div class="entry-total">
                <span class="label">${t.entryTotal}</span>
                <span class="value">₹${total.toLocaleString("en-IN")}</span>
              </div>
            </div>
          `;
        }).join("");

        app.innerHTML += `
          <div class="user">
            <div class="user-name">${user.name}</div>
            ${entriesHTML}
          </div>
        `;
      });
    }

    function updatePaid(userIndex, entryIndex, value) {
      users[userIndex].entries[entryIndex].interestPaid = Number(value) || 0;
      render();
    }

    function openTotalPopup() {
      const t = lang[currentLang];
      const body = document.getElementById("modalBody");

      let grandPrincipal = 0;
      let grandRemaining = 0;

      users.forEach(user => {
        user.entries.forEach(entry => {
          const { remaining } = getEntryData(entry);
          grandPrincipal += entry.amount;
          grandRemaining += remaining;
        });
      });

      const grandTotal = grandPrincipal + grandRemaining;

      body.innerHTML = `
        <div class="modal-summary">
          <div class="row">
            <span>${t.sumPrincipal}</span>
            <span>₹${grandPrincipal.toLocaleString("en-IN")}</span>
          </div>
          <div class="row">
            <span>${t.sumInterest}</span>
            <span>₹${grandRemaining.toLocaleString("en-IN")}</span>
          </div>
          <div class="row">
            <span>${t.grandTotal}</span>
            <span>₹${grandTotal.toLocaleString("en-IN")}</span>
          </div>
        </div>
      `;

      document.getElementById("totalModal").classList.add("show");
    }

    function closeTotalPopup(e) {
      if (!e || e.target.id === "totalModal") {
        document.getElementById("totalModal").classList.remove("show");
      }
    }

    const NOTES_KEY = "interestTrackerNotes";

    function getNotes() {
      try {
        return JSON.parse(localStorage.getItem(NOTES_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveNote() {
      const input = document.getElementById("noteInput");
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      const notes = getNotes();
      notes.unshift({ id: Date.now(), text, date: new Date().toISOString() });
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      input.value = "";
      renderNotes();
    }

    function deleteNote(id) {
      const notes = getNotes().filter(note => note.id !== id);
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      renderNotes();
    }

    function formatNoteDate(dateString) {
      const date = new Date(dateString);
      const hours = String(date.getHours()).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");
      return `${date.getDate()} ${monthNames[currentLang][date.getMonth()]} ${date.getFullYear()}, ${hours}:${minutes}`;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderNotes() {
      const list = document.getElementById("notesList");
      const notes = getNotes();
      const t = lang[currentLang];

      if (notes.length === 0) {
        list.innerHTML = `<div class="empty-notes">${t.emptyNotes}</div>`;
        return;
      }

      list.innerHTML = notes.map(note => `
        <div class="note">
          <button class="delete-note" onclick="deleteNote(${note.id})" title="${t.delete}">×</button>
          <div class="note-text">${escapeHTML(note.text)}</div>
          <div class="note-date">${formatNoteDate(note.date)}</div>
        </div>
      `).join("");
    }

    // Init
    loadFontSize();
    updateLanguage();
    render();
    renderNotes();
  </script>
</body>
</html>
