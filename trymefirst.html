<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
   <title>BS&MFI Web</title>
    <link rel="icon" href="mfi.logo.png" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Balthazar&family=Della+Respira&family=Hahmlet:wght@100..900&family=Niconne&family=Stalemate&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Balthazar&family=Della+Respira&family=Gantari:ital,wght@0,100..900;1,100..900&family=Hahmlet:wght@100..900&family=Niconne&family=Stalemate&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
* {
	font-family: 'Inter', system-ui, -apple-system, sans-serif;
	margin:0; padding:0;box-sizing: border-box;
	letter-spacing: 0.4px;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-tertiary) transparent;
}
    :root {
         --primary: blue;
    --primary-dark: blue;
    --bg: white;
      --bg: #000000;
      --bg-secondary: #1f1f1fba;
      --bg-tertiary: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --bubble-bot: #1c1c1e;
      --bubble-user: blue;
      --border: #2c2c2e;
      --success: #4caf50;
      --danger: #e53935;
      --warning: #ff9800;
      --radius: 12px;
      --nav-height: 56px;
      --header-height: 56px;
    }
* {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
a {
    text-decoration: none;
    color: var(--text);
}
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #login-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      background: var(--bg);
    }

    .login-card {
     width: 100%;
    max-width: 360px;
    }

    .login-logo {
     display: flex;
    align-items: center;
    justify-content: center;
    margin: 15px auto;
    color: white;
    }

    .login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .login-sub {
          text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 15px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

input#password-input {
    width: 100%;
    height: 48px;
    padding: 0 15px;
    border: none;
    border-radius: 999px;
    outline: none;
    font-size: 18px;
    box-sizing: border-box;
    text-align: center;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    background: var(--bg-secondary);
}
    input[type="password"],
    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="color"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-tertiary);
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

   input[type="color"] {
    padding: 0;
    height: 44px;
    cursor: pointer;
    width: 40px;
    background: transparent;
}

 input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 15px;
}

 input[type="color"]::-moz-color-swatch {
    border: none;
    border-radius: 15px;
}
    .btn {
         width: 100%;
    height: 48px;
    margin-top: 15px;
    border: none;
    border-radius: 9999px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    color: #ffffff;
    box-shadow: inset 0.8px 0.8px 0px 0px #ffffff17, inset -0.8px -0.8px 0px 0px #ffffff17;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0px;
      background: var(--primary);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: rgba(36, 129, 204, 0.1);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 13px;
      width: auto;
    }

    .error-msg {
     color: red;
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
    }

    /* ========== APP SHELL ========== */
    #app {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    header {
    display: flex;
    align-items: center;
    padding: 15px 10px;
    gap: 10px;
    flex-shrink: 0;
    z-index: 10;
    }

    header .back-btn {
      background: none;
    border: none;
    color: var(--primary);
    cursor: pointer;
    backdrop-filter: blur(2px);
    box-shadow: inset 0.8px 0.8px 0px 0px #ffffff17, inset -0.8px -0.8px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    width: 45px;
height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: var(--bg-secondary);
    }
button,input,a{
  transition: all 0.1s ease-in-out;
}
    button:active,input:active,a:active {
    transform: scale(0.90);
}

    header .title {
      font-size: 17px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    }
span.menu-option-icon {
    display: inline-flex;
}
    header .subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg);
      position: relative;
    }

button#back-btn svg,
header .back-btn svg,
.settings-item svg {
    fill: var(--text);
}
 
nav.bottom-nav button {
flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    border-radius: 999px;
    min-height: 50px;
    font-weight: 400;
    width: 100%;
    padding: 4px 20px;
    }
    nav.bottom-nav button.active {
    background: color-mix(in srgb, var(--primary) 19%, transparent);
    color: var(--primary);
    fill: var(--primary);
}
nav.bottom-nav button{
   transition:  transform 0.2s ease-in-out;
}
nav.bottom-nav button:active {
    transform: scale(0.90);
}
    nav.bottom-nav button svg { width: 21px; height: 21px; }
   

    nav.bottom-nav button svg {
      transition: transform 0.18s ease;
      width: 24px;
      height: 24px;
    }
    .view {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .view.active {
     display: flex;
    justify-content: start;
    align-items: center;
    width: 100%;
    }
.loan-list {
    padding: 5px 10px;
}

    .loan-item {
   border-radius: 20px;
    padding: 10px 7px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    }
.loan-item:active {
    transform: scale(0.98);
}
.loan-item:hover{
    background-color: var(--bg-secondary);
}
    .loan-avatar {
      width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 20px;
    color: var(--text);
    }

    .loan-info {
      flex: 1;
      min-width: 0;
    }

    .loan-info h3 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 3px;
    }

    .loan-info p {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loan-amount {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-secondary);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    /* ========== CHAT VIEW ========== */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
     padding: 12px 12px 5px 12px;
    border-radius: 20px;
    font-size: 15px;
    line-height: 20px;
    position: relative;
    word-wrap: break-word;
    background: var(--bubble-bot);
    max-width: 600px;
    width: 90%;
    }
.user:before {
content: "";
    position: absolute;
    z-index: 0;
    bottom: 0;
    right: -8px;
    height: 20px;
    width: 20px;
    background: var(--primary);
    background-attachment: fixed;
    border-bottom-left-radius: 15px;
}
.user:after {
  content: "";
  position: absolute;
  z-index: 1;
  bottom: 0;
  right: -10px;
  width: 10px;
  height: 20px;
  background: var(--bg);
  border-bottom-left-radius: 10px;
}

    .msg.bot {
      align-self: flex-start;
      width: fit-content;
    }
    .msg.bot:before {
  content: "";
  position: absolute;
  z-index: 0;
  bottom: 0;
  left: -7px;
  height: 20px;
  width: 20px;
  background: var(--bubble-bot);
  border-bottom-right-radius: 15px;
}
.msg.bot:after {
  content: "";
  position: absolute;
  z-index: 1;
  bottom: 0;
  left: -10px;
  width: 10px;
  height: 20px;
  background: var(--bg);
  border-bottom-right-radius: 10px;
}


    .msg.user {
       background: var(--primary);
    align-self: flex-end;
    width: fit-content;
    }

    .msg .time {
      font-size: 11px;
    margin-top: 4px;
    text-align: right;
    opacity: 60%;
    }

    .option-btn {
     background: var(--primary);
    border: none;
    color: var(--text);
    padding: 10px 15px;
    border-radius: 99px;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: inset 0.8px 0.8px 0px 0px #ffffff17, inset -0.8px -0.8px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    backdrop-filter: blur(2px);
    }

    .option-btn:active,
    .option-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

     .services-grid {
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    overflow: scroll;
    height: 83vh;
    }
.header-heading {
    transition: transform .18s ease, background .18s ease;
    box-shadow: inset 0.8px 0.8px 0px 0px #ffffff17, inset -0.8px -0.8px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    background: var(--bg-secondary);
    height: 45px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: fit-content;
    border-radius: 999px;
    padding: 0 20px;
    gap: 0;
    justify-content: center;
}
    .service-card {
     background: var(--bg-secondary);
    border-radius: 20px;
    padding: 20px 15px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    border: 1px solid transparent;
    }
    .service-card:active{
      transform: scale(0.98);
    }
.service-card.disabled {
    opacity: 25%;
    cursor: not-allowed;
    z-index: -1;
    }

    .service-card .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }
span.menu-option-icon svg {
    fill: var(--text);
}
    .service-card h4 {
      font-size: 15px;
    font-weight: 800;
    margin-bottom: 4px;
    color: var(--primary);
    }

    .service-card p {
      font-size: 12px;
      color: var(--text-secondary);
    }
.settings-list {
          padding: 12px;
    overflow: scroll;
    height: 83vh;
    }
    .settings-section {
      margin-bottom: 20px;
    background: var(--bg-secondary);
    border-radius: 25px;
    }

    .settings-section h3 {
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0 8px 8px;
    }

    .settings-item {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }


    .settings-item .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .settings-item .arrow {
      color: var(--text-secondary);
      font-size: 18px;
    }
.settings-list h3 {
    text-transform: uppercase;
    opacity: 55%;
    font-size: 13px;
    font-weight: 400;
    padding: 5px 15px;
}
    .color-picker-row {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border 0.15s;
    }

    .color-swatch.active {
      border-color: white;
    }

    .color-custom-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 4px;
    }

    .color-custom-wrap label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ========== MODAL / FULL PAGES ========== */
    .page-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .page-overlay.active {
      display: flex;
    }

    .page-content {
          flex: 1;
    overflow-y: auto;
    padding: 0px 16px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-secondary);
    }

    .page-content h2 {
     font-size: 20px;
    margin-bottom: 16px;
    color: var(--primary);
    position: sticky;
    top: -21px;display: none;
    background: linear-gradient(180deg, var(--bg), transparent);
    text-align: center;
    padding: 15px 0 0 0;
    }

    .page-content h3 {
      font-size: 16px;
    margin: 20px 0 8px;
    color: var(--primary);
    }

    .page-content p {
      margin-bottom: 12px;
    }

    .page-content ul {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    /* Notice & Custom Content */
    .special-notice {
      color: white;
    padding: 15px;
    margin: 10px 10px 0 10px;
    font-size: 14px;
    display: none;
    box-shadow: inset 0.8px 0.8px 0px 0px #ffffff17, inset -0.8px -0.8px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    border: none;
    color: var(--text);
    backdrop-filter: blur(2px);
    background: var(--bg-secondary);
    border-radius: 25px;
    }

    .custom-content {
      margin: 12px;
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
    }

    .custom-content img {
      width: 100%;
      display: block;
      cursor: pointer;
    }

    /* Form styles */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-tertiary);
      color: var(--text);
      padding: 10px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Theme light override */
    body.light {
      --bg: #ffffff;
      --bg-secondary: #ffffffb5;
      --bg-tertiary: #e4e6eb;
      --text: #050505;
      --text-secondary: #65676b;
      --bubble-bot: #e4e6eb;
      --bubble-user: #0084ff;
      --border: #ced0d4;
    }

    body.light .msg.user {
      color: white;
    }

    .header-more {
      width: 45px;
height: 45px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    transition: transform .18s ease, background .18s ease;
    box-shadow: inset 0.8px 0.8px 0px 0px #ffffff17, inset -0.8px -0.8px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    background: var(--bg-secondary);
    }
    .header-more svg{
      fill: var(--text);
    }
    .header-more:active { background: var(--bg-tertiary); }

    .borrow-tools {
     width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 10px 0 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }
    .borrow-apply-card,
    .fee-calculator-launch  {
        grid-column: 1 / -1;
    width: 100%;
    min-height: 75px;
    display: flex;
    align-items: center;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    background: var(--bg-secondary);
    border: none;
    border-radius: 20px;
    padding: 0 15px;
    gap: 15px;
    }
    .borrow-apply-card > span:nth-child(2) { display:flex; flex-direction:column; gap:5px; flex:1; min-width:0; }
    .borrow-apply-card strong { font-size: 16px; }
    .borrow-apply-card small { color: var(--text-secondary); font-size: 13px; }
    .borrow-apply-icon { width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: 
color-mix(in srgb, var(--primary) 18%, transparent);
    color: var(--primary);
    font-size: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0;
    margin: 0;
    line-height: 0;}
    .borrow-apply-arrow { color:var(--text-secondary); font-size:25px; }
    #borrow-search { margin-bottom: 4px;
    background: var(--bg-secondary);
    border: none;
    padding: 8px 20px;
    width: 95%;
    font-size: 15px;
    color: var(--text);
    backdrop-filter: blur(2px);
    outline: none;max-width: 400px;
    box-shadow: inset 0.8px 0.8px 0px 0px #ffffff17, inset -0.8px -0.8px 0px 0px #ffffff17;
    filter: drop-shadow(0px 0px 6px #0000002b);
    border-radius: 999px;
    transition: all 0.2s ease-in-out;
    text-align: center;}
  #borrow-search:focus{
    width: 100%;font-size: 17px;
     padding: 12px 20px;max-width: 600px;
  }
    .fee-calculator-launch > span:first-child {
      width:40px; height:40px; flex:0 0 40px; display:grid; place-items:center;
      border-radius:12px; background:color-mix(in srgb,var(--primary) 16%,transparent);
      color:var(--primary); font-size:22px; font-weight:700;
    }
    .fee-calculator-launch > span:nth-child(2) { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
    .fee-calculator-launch strong { font-size:14px; }
    .fee-calculator-launch small { color:var(--text-secondary); font-size:12px; line-height:1.4; }
    .fee-calculator-launch b { color:var(--text-secondary); font-size:22px; font-weight:400; }
    .fee-result { margin-top:16px; padding:16px; border:1px solid var(--border); border-radius:14px; background:var(--bg-secondary); }
    .fee-result-row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; font-size:14px; }
    .fee-result-row.total { border-top:1px solid var(--border); margin-top:6px; padding-top:13px; font-weight:700; font-size:16px; }
    .fee-rate-note { color:var(--text-secondary); font-size:12px; margin-top:8px; line-height:1.5; }
    .chat-solution-ad-wrap {
    padding: 5px 10px 0 10px;
    position: sticky;
    top: 65px;
    z-index: 1;
    margin-top: 0;
    border-radius: 0 0 86px 90px;
    width: 100%;
    max-width: 600px;
  }
    button.chat-solution-ad div {
  width: 2.5px;
    height: 40px;
    background: var(--text);
    border-radius: 999px;
    opacity: 75%;
}
    .chat-solution-ad {
     width: 100%;
    display: flex;

#bsmfi-chat-tools,
#bsmfi-chat-composer {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
}

/* Chat toolbar */
#bsmfi-chat-tools {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 10px 0;
}

.chat-tool-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 13px;
    border: 1px solid #dedee5;
    border-radius: 12px;
    background: #fff;
    color: #25252b;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s ease;
}

.chat-tool-btn:hover {
    background: #f1f0ff;
    border-color: #5145e5;
    color: #5145e5;
    transform: translateY(-1px);
}

.chat-tool-btn.active {
    background: #5145e5;
    border-color: #5145e5;
    color: #fff;
}

/* Service menu */
#bsmfi-service-menu {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px;
    margin: 5px 0 12px;
    background: #f7f7fa;
    border: 1px solid #e8e8ef;
    border-radius: 15px;
}

.bsmfi-service-btn {
    padding: 9px 13px;
    border: 1px solid #e0e0e8;
    border-radius: 10px;
    background: #fff;
    color: #292934;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s ease;
}

.bsmfi-service-btn:hover {
    background: #5145e5;
    border-color: #5145e5;
    color: #fff;
    transform: translateY(-2px);
}

/* Chat composer */
#bsmfi-chat-composer {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 9px;
    border: 1px solid #dedee5;
    border-radius: 16px;
    background: #fff;
}

#bsmfi-chat-input {
    flex: 1;
    min-width: 0;
    padding: 11px 9px;
    border: none;
    outline: none;
    background: transparent;
    color: #222;
    font-size: 14px;
}

#bsmfi-chat-input::placeholder {
    color: #9999a5;
}

#bsmfi-chat-send,
#bsmfi-chat-image-btn {
    width: 39px;
    height: 39px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 11px;
    background: #5145e5;
    color: #fff;
    font-size: 17px;
    cursor: pointer;
    transition: .2s ease;
}

#bsmfi-chat-send:hover,
#bsmfi-chat-image-btn:hover {
    background: #3930bd;
    transform: scale(1.04);
}

/* Service suggestions */
#bsmfi-chat-suggestions {
    position: absolute;
    z-index: 50;
    left: 0;
    right: 0;
    bottom: calc(100% + 7px);
    display: none;
    padding: 6px;
    border: 1px solid #e5e5ed;
    border-radius: 13px;
    background: #fff;
    box-shadow: 0 8px 25px rgba(0,0,0,.10);
}

.bsmfi-chat-suggestion {
    display: block;
    width: 100%;
    padding: 11px 12px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #292934;
    text-align: left;
    font-size: 13px;
    cursor: pointer;
}

.bsmfi-chat-suggestion:hover {
    background: #f1f0ff;
    color: #5145e5;
}

/* Invalid input shake */
#bsmfi-chat-input.shake {
    animation: bsmfiChatShake .35s ease;
}

@keyframes bsmfiChatShake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-5px); }
    40%, 80% { transform: translateX(5px); }
}

/* Service progress */
.bsmfi-progress-container {
    width: 100%;
    height: 7px;
    overflow: hidden;
    margin-top: 10px;
    border-radius: 20px;
    background: #e9e9f0;
}

.bsmfi-progress-bar {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: #5145e5;
    animation: bsmfiProgress 1.7s ease forwards;
}

@keyframes bsmfiProgress {
    from { width: 0%; }
    to { width: 100%; }
}

/* Yes / No buttons */
.bsmfi-chat-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 12px;
}

.bsmfi-chat-actions button {
    min-width: 85px;
    padding: 10px 17px;
    border: 1px solid #5145e5;
    border-radius: 10px;
    background: #5145e5;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s ease;
}

.bsmfi-chat-actions button:hover {
    background: #3930bd;
    transform: translateY(-1px);
}

.bsmfi-chat-actions button.no-btn {
    background: #fff;
    border-color: #dedee5;
    color: #555;
}

.bsmfi-chat-actions button.no-btn:hover {
    background: #f3f3f6;
}

/* Amount form */
.bsmfi-amount-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

.bsmfi-amount-form input {
    flex: 1;
    min-width: 120px;
    padding: 11px 12px;
    border: 1px solid #dedee5;
    border-radius: 10px;
    outline: none;
    background: #fff;
    color: #222;
    font-size: 14px;
}

.bsmfi-amount-form input:focus {
    border-color: #5145e5;
    box-shadow: 0 0 0 3px rgba(81,69,229,.10);
}

.bsmfi-amount-form button {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: #5145e5;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
}

/* Uploaded chat image */
.bsmfi-chat-image-wrap {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 7px;
    max-width: 100%;
    margin: 8px 0;
}

.bsmfi-chat-image {
    display: block;
    max-width: min(260px, 100%);
    max-height: 280px;
    object-fit: contain;
    border: 1px solid #e5e5ed;
    border-radius: 13px;
    background: #f5f5f7;
}

.bsmfi-chat-image-delete {
    padding: 6px 11px;
    border: 1px solid #f0caca;
    border-radius: 8px;
    background: #fff5f5;
    color: #d43b3b;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}

.bsmfi-chat-image-delete:hover {
    background: #ffe5e5;
}

/* Wallpaper options */
.bsmfi-wallpaper-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
}

.bsmfi-wallpaper-options button {
    padding: 9px 13px;
    border: 1px solid #dedee5;
    border-radius: 10px;
    background: #fff;
    color: #292934;
    font-size: 13px;
    cursor: pointer;
}

.bsmfi-wallpaper-options button:hover {
    border-color: #5145e5;
    color: #5145e5;
}

.bsmfi-wallpaper-color {
    width: 48px;
    height: 38px;
    padding: 3px;
    border: 1px solid #dedee5;
    border-radius: 9px;
    background: #fff;
    cursor: pointer;
}

/* Chat wallpaper */
#chat-messages {
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transition: background-color .2s ease;
}

/* Mobile adjustments */
@media (max-width: 480px) {
    #bsmfi-chat-tools {
        gap: 7px;
    }

    .chat-tool-btn {
        padding: 8px 10px;
        font-size: 12px;
    }

    #bsmfi-chat-composer {
        gap: 5px;
        padding: 7px;
    }

    #bsmfi-chat-input {
        font-size: 13px;
    }

    .bsmfi-service-btn {
        flex: 1 1 calc(50% - 8px);
        text-align: center;
    }

    .bsmfi-chat-actions button {
        flex: 1;
    }
}

/* ---------------- DATE FUNCTIONS ---------------- */

function parseDate(str) {
  if (!str) return new Date(NaN);

  const [d, m, y] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(str) {
  const d = parseDate(str);

  return d.toLocaleDateString("en-GB", {
    day: "2-digit",
    month: "short",
    year: "numeric"
  });
}

function daysLeft(returnStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const ret = parseDate(returnStr);
  ret.setHours(0, 0, 0, 0);

  return Math.round((ret - today) / 86400000);
}

function getOverdueDays(loan) {
  return Math.max(0, Math.abs(Math.min(0, daysLeft(loan.return))));
}

function getOverdueFine(loan) {
  const dailyFine = Math.max(0, Number(loan.overdueFee) || 0);
  return getOverdueDays(loan) * dailyFine;
}

function formatMoney(n) {
  return "₹" + Number(n || 0).toLocaleString("en-IN", {
    maximumFractionDigits: 2
  });
}

function nowTime() {
  return new Date().toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;

  t.textContent = msg;
  t.classList.add("show");

  setTimeout(() => t.classList.remove("show"), 3000);
}


/* ---------------- THEME ---------------- */

function setPrimaryColor(color) {
  document.documentElement.style.setProperty("--primary", color);

  const c = color.replace("#", "");

  const r = Math.max(0, parseInt(c.substr(0, 2), 16) - 30);
  const g = Math.max(0, parseInt(c.substr(2, 2), 16) - 30);
  const b = Math.max(0, parseInt(c.substr(4, 2), 16) - 30);

  document.documentElement.style.setProperty(
    "--primary-dark",
    `rgb(${r},${g},${b})`
  );

  localStorage.setItem("bsmfi_primary", color);
}

/* =====================================================
   CHAT STORAGE
===================================================== */

function getChatKey() {
  return CHAT_STORAGE_PREFIX + currentUser.key + "_" + currentLoanIndex;
}

function getChatSaveKey() {
  return CHAT_SAVE_PREFIX + currentUser.key + "_" + currentLoanIndex;
}

function getWallpaperKey() {
  return CHAT_WALLPAPER_PREFIX + currentUser.key + "_" + currentLoanIndex;
}

function loadChatStorage() {
  chatSaveEnabled = localStorage.getItem(getChatSaveKey()) === "true";
  chatMessages = [];

  if (chatSaveEnabled) {
    try {
      chatMessages = JSON.parse(localStorage.getItem(getChatKey()) || "[]");
    } catch {
      chatMessages = [];
    }
  }
}

function saveChatStorage() {
  if (!chatSaveEnabled) return;

  try {
    localStorage.setItem(getChatKey(), JSON.stringify(chatMessages));
  } catch {
    showToast("Storage full. Unable to save chat.");
  }
}

function setChatSaving(enabled) {
  chatSaveEnabled = enabled;

  if (enabled) {
    localStorage.setItem(getChatSaveKey(), "true");
    saveChatStorage();
    showToast("Chat saving enabled");
  } else {
    localStorage.setItem(getChatSaveKey(), "false");
    localStorage.removeItem(getChatKey());
    chatMessages = [];
    showToast("Chat history cleared");

    const msgs = document.getElementById("chat-messages");
    if (msgs) msgs.innerHTML = "";

    addBotMsg(
      `Hello ${escapeHTML(currentUser.displayName)}! 👋<br>
      Chat saving is off. Your messages will not be stored.`
    );
  }

  updateChatSaveButton();
}

function updateChatSaveButton() {
  const btn = document.getElementById("chat-save-toggle");
  if (!btn) return;

  btn.innerHTML = CHAT_ICONS.save;
  btn.title = chatSaveEnabled ? "Turn chat saving off" : "Turn chat saving on";
  btn.setAttribute("aria-label", btn.title);
  btn.classList.toggle("active", chatSaveEnabled);
  btn.setAttribute("aria-pressed", String(chatSaveEnabled));
}


/* =====================================================
   CHAT MESSAGE SYSTEM
===================================================== */

function addChatMessage(type, content, extra = {}) {
  const message = {
    type,
    content,
    time: nowTime(),
    timestamp: Date.now(),
    ...extra
  };

  chatMessages.push(message);

  if (chatSaveEnabled) saveChatStorage();

  renderSingleChatMessage(message);
}

function addBotMsg(html) {
  addChatMessage("bot", html);
}

function addUserMsg(text) {
  addChatMessage("user", text);
}

function renderSingleChatMessage(message) {
  const msgs = document.getElementById("chat-messages");
  if (!msgs) return;

  const div = document.createElement("div");
  div.className = "msg " + message.type;

  if (message.type === "image") {
    const img = document.createElement("img");

    img.src = message.content;
    img.alt = "Uploaded image";
    img.style.cssText = `
     display: block;
    object-fit: contain;
    width: 100%;
    border-radius: 10px;
    `;

    div.appendChild(img);

    const del = document.createElement("button");
    del.type = "button";
    del.textContent = "Delete image";
    del.className = "chat-image-delete";

    del.addEventListener("click", () => {
      chatMessages = chatMessages.filter(m => m.timestamp !== message.timestamp);

      if (chatSaveEnabled) saveChatStorage();

      div.remove();
      showToast("Image deleted");
    });

    div.appendChild(del);
  } else {
    const body = document.createElement("div");
    body.className = "chat-message-content";
    body.innerHTML = message.content;
    div.appendChild(body);
  }

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = message.time || "";

  div.appendChild(time);
  msgs.appendChild(div);

  msgs.scrollTop = msgs.scrollHeight;
}

function restoreChatMessages() {
  const msgs = document.getElementById("chat-messages");
  if (!msgs) return;

  msgs.innerHTML = "";

  if (chatSaveEnabled && chatMessages.length) {
    chatMessages.forEach(renderSingleChatMessage);
  } else {
    chatMessages = [];

    addBotMsg(
      `Hello ${escapeHTML(currentUser.displayName)}! 👋<br>
      This is the details for <b>${formatMoney(currentUser.loans[currentLoanIndex].amount)}</b>.<br><br>
      Open the menu to view loan details or explore services.`
    );
  }
}


/* =====================================================
   CHAT WALLPAPER
===================================================== */

function applyChatWallpaper() {
  const msgs = document.getElementById("chat-messages");
  if (!msgs) return;

  let wallpaper = null;

  try {
    wallpaper = JSON.parse(localStorage.getItem(getWallpaperKey()) || "null");
  } catch {
    wallpaper = null;
  }

  msgs.style.backgroundImage = "none";
  msgs.style.backgroundColor = "";
  msgs.style.backgroundAttachment = "fixed";

  if (!wallpaper) return;

  if (wallpaper.type === "image") {
    const safeImage = wallpaper.value;

    msgs.style.backgroundImage =
      `linear-gradient(#00000030,#00000030),url("${safeImage}")`;

    msgs.style.backgroundSize = "cover";
    msgs.style.backgroundPosition = "center center";
    msgs.style.backgroundRepeat = "no-repeat";
    msgs.style.backgroundAttachment = "fixed";
  }

  if (wallpaper.type === "color") {
    msgs.style.backgroundColor = wallpaper.value;
  }
}

function showWallpaperMenu() {
  addBotMsg(`
    <b>Chat wallpaper</b><br><br>
    Select a background option:
    <div class="chat-action-list">
      <button onclick="wallpaperImages()">Images</button>
      <button onclick="wallpaperColors()">Color</button>
      <button onclick="deleteWallpaper()">Delete bg</button>
    </div>
  `);
}

function wallpaperImages() {
  const input = document.createElement("input");

  input.type = "file";
  input.accept = "image/*";

  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
      showToast("Select an image below 2 MB");
      return;
    }

    try {
      const image = await compressChatImage(file, 1000, 0.75);

      localStorage.setItem(
        getWallpaperKey(),
        JSON.stringify({
          type: "image",
          value: image
        })
      );

      applyChatWallpaper();
      addBotMsg("Your chat wallpaper has been updated.");
    } catch {
      showToast("Unable to set wallpaper");
    }
  };

  input.click();
}

function wallpaperColors() {
  addBotMsg(`
    <b>Choose your wallpaper color</b><br><br>
    <input
      type="color"
      id="chat-wallpaper-color"
      value="#343434"
      style="width:100%;height:55px;cursor:pointer;"
    >
    <button class="option-btn" onclick="applyWallpaperColor()">
      Apply color
    </button>
  `);
}

function applyWallpaperColor() {
  const picker = document.getElementById("chat-wallpaper-color");
  if (!picker) return;

  localStorage.setItem(
    getWallpaperKey(),
    JSON.stringify({
      type: "color",
      value: picker.value
    })
  );

  applyChatWallpaper();
  addBotMsg("Your chat background color has been updated.");
}

function deleteWallpaper() {
  localStorage.removeItem(getWallpaperKey());

  applyChatWallpaper();
  addBotMsg("Your chat wallpaper has been reset to default.");
}


/* =====================================================
   IMAGE COMPRESSION / UPLOAD
===================================================== */

function compressChatImage(file, maxSize = 1200, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const image = new Image();

      image.onload = () => {
        const scale = Math.min(
          1,
          maxSize / Math.max(image.width, image.height)
        );

        const canvas = document.createElement("canvas");

        canvas.width = Math.round(image.width * scale);
        canvas.height = Math.round(image.height * scale);

        const ctx = canvas.getContext("2d");

        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

        resolve(canvas.toDataURL("image/jpeg", quality));
      };

      image.onerror = reject;
      image.src = reader.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadChatImage(file) {
  if (!file || !file.type.startsWith("image/")) {
    showToast("Select a valid image");
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    showToast("Image must be below 10 MB");
    return;
  }

  try {
    const image = await compressChatImage(file);
    addChatMessage("image", image);
  } catch {
    showToast("Unable to upload image");
  }
}

/* =====================================================
   SERVICE SUGGESTIONS
===================================================== */

function normalizeServiceName(value) {
  return value.toLowerCase().replace(/[^a-z0-9]/g, "");
}

function findService(value) {
  const query = normalizeServiceName(value);

  return CHAT_SERVICES.find(service => {
    const names = [service.key, ...service.aliases];

    return names.some(name =>
      normalizeServiceName(name) === query
    );
  });
}

function showServiceSuggestions() {
  const input = document.getElementById("chat-service-input");
  const container = document.getElementById("chat-suggestions");

  if (!input || !container) return;

  const query = normalizeServiceName(input.value);
  container.innerHTML = "";

  if (!query) {
    container.hidden = true;
    return;
  }

  const matches = CHAT_SERVICES.filter(service => {
    return [service.key, ...service.aliases].some(name =>
      normalizeServiceName(name).includes(query)
    );
  });

  if (!matches.length) {
    container.hidden = true;
    return;
  }

  container.hidden = false;

  matches.forEach(service => {
    const button = document.createElement("button");

    button.type = "button";
    button.textContent = `${service.icon} ${service.key}`;

    button.onclick = () => {
      input.value = "";
      container.hidden = true;
      selectChatService(service.key);
    };

    container.appendChild(button);
  });
}

function sendServiceInput() {
  const input = document.getElementById("chat-service-input");
  const value = input.value.trim();

  if (!value) return;

  const service = findService(value);

  input.value = "";

  const suggestions = document.getElementById("chat-suggestions");
  if (suggestions) suggestions.hidden = true;

  if (!service) {
    input.classList.remove("shake");
    void input.offsetWidth;
    input.classList.add("shake");

    addBotMsg(
      `No service available with that name: <b>${escapeHTML(value)}</b>.`
    );

    return;
  }

  selectChatService(service.key);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}


/* =====================================================
   SERVICE ACCESS CHECK
===================================================== */

async function selectChatService(serviceName) {
  const service = CHAT_SERVICES.find(s => s.key === serviceName);
  if (!service) return;

  addUserMsg(`${service.icon} ${service.key}`);

  const progressId = "service-progress-" + Date.now();

  addBotMsg(`
    <div id="${progressId}">
      Checking your access to <b>${service.key}</b>...
      <div class="service-progress-track">
        <div class="service-progress-bar"></div>
      </div>
    </div>
  `);

  await new Promise(resolve => setTimeout(resolve, 1800));

  const allowed = !!(
    currentUser &&
    currentUser.access &&
    currentUser.access[service.key] === true
  );

  const progress = document.getElementById(progressId);

  if (progress) {
    progress.innerHTML = allowed
      ? `<b>✓ Access verified</b>`
      : `<b>✕ Access unavailable</b>`;
  }

  await new Promise(resolve => setTimeout(resolve, 350));

  if (!allowed) {
    addBotMsg(`
      <b>Access denied</b><br>
      ${service.key} is not currently available for your account.
    `);
    return;
  }

  if (service.calculated) {
    startCalculatedService(service);
  } else {
    startSimpleService(service);
  }
}


/* =====================================================
   CALCULATED SERVICES
===================================================== */

function startCalculatedService(service) {
  chatWorkflow = {
    service,
    step: "amount"
  };

  const prompts = {
    "Delay It": "How much amount would you like to extend?",
    "Split Pay": "What amount would you like to split?",
    "Buy Limit": "What amount would you like to increase your limit by?"
  };

  addBotMsg(`
    <b>${service.icon} ${service.key}</b><br>
    ${prompts[service.key]}<br>

    <input
      type="number"
      min="1"
      step="0.01"
      id="service-amount-input"
      placeholder="Enter amount (₹)"
    >

    <button
      class="option-btn"
      onclick="calculateChatServiceFee()"
    >
      Continue
    </button>
  `);
}

function calculateChatServiceFee() {
  if (!chatWorkflow || chatWorkflow.step !== "amount") return;

  const input = document.getElementById("service-amount-input");
  const amount = Number(input?.value);

  if (!Number.isFinite(amount) || amount <= 0) {
    showToast("Enter a valid amount");
    return;
  }

  const service = chatWorkflow.service;
  const rate = SERVICE_FEES[service.key];

  const fee = amount * rate / 100;
  const total = amount + fee;

  chatWorkflow = {
    service,
    amount,
    fee,
    total,
    step: "confirmation"
  };

  addUserMsg(formatMoney(amount));

  addBotMsg(`
    <b>${service.key} calculation</b><br><br>

    Amount: <b>${formatMoney(amount)}</b><br>
    Service fee (${rate}%):
    <b>${formatMoney(fee)}</b><br><br>

    Total including fee:
    <b>${formatMoney(total)}</b><br><br>

    Would you like to apply now?

    <div class="chat-confirm-buttons">
      <button class="chat-yes" onclick="confirmChatService(true)">
        Yes
      </button>
      <button class="chat-no" onclick="confirmChatService(false)">
        No
      </button>
    </div>
  `);
}


/* =====================================================
   SIMPLE SERVICES
===================================================== */

function startSimpleService(service) {
  chatWorkflow = {
    service,
    step: "confirmation"
  };

  addBotMsg(`
    <b>${service.icon} ${service.key}</b><br><br>
    Would you like to apply for this service?

    <div class="chat-confirm-buttons">
      <button class="chat-yes" onclick="confirmChatService(true)">
        Yes
      </button>
      <button class="chat-no" onclick="confirmChatService(false)">
        No
      </button>
    </div>
  `);
}

function confirmChatService(accepted) {
  if (!chatWorkflow) return;

  const workflow = chatWorkflow;

  if (workflow.step !== "confirmation") return;

  const service = workflow.service;
  chatWorkflow = null;

  if (accepted) {
    addUserMsg("Yes, apply now.");
    addBotMsg(`Redirecting you to <b>${service.key}</b>...`);

    setTimeout(() => {
      window.location.href = service.url;
    }, 700);
  } else {
    addUserMsg("No");
    addBotMsg("Let me know when you are ready.");
  }
}

/* =====================================================
   LOAN OPTION HANDLER
===================================================== */

function handleOption(opt, loan, index) {
  const labels = {
    interest: "Interest",
    taken: "Taken on",
    return: "Return on",
    days: "Days left",
    overdue: "Overdue fee",
    total: "Total amount"
  };

  addUserMsg(labels[opt]);

  setTimeout(() => {
    let reply = "";

    switch (opt) {
      case "interest":
        reply = `Interest amount: <b>${formatMoney(loan.interest)}</b>`;

        if (currentUser.fixedInterest) {
          reply += `<br>Fixed interest rate: <b>${currentUser.fixedInterest}%</b>`;
        }
        break;

      case "taken":
        reply = `Borrowed on: <b>${formatDate(loan.borrowed)}</b>`;
        break;

      case "return":
        reply = `Return date: <b>${formatDate(loan.return)}</b>`;
        break;

      case "total": {
        const fine = getOverdueFine(loan);

        const total =
          Number(loan.amount || 0) +
          Number(loan.interest || 0) +
          fine;

        reply = `
          Loan amount: <b>${formatMoney(loan.amount)}</b><br>
          Interest: <b>${formatMoney(loan.interest)}</b><br>
          Overdue fine: <b>${formatMoney(fine)}</b><br><br>
          Total amount to return: <b>${formatMoney(total)}</b>
        `;
        break;
      }

      case "days": {
        const d = daysLeft(loan.return);

        if (d < 0) {
          reply = `⚠️ Overdue by <b>${Math.abs(d)} day(s)</b>.`;
        } else if (d === 0) {
          reply = `⏰ This loan is <b>due today</b>.`;
        } else {
          reply = `Days remaining: <b>${d} day(s)</b>`;
        }
        break;
      }

      case "overdue": {
        const overdueDays = getOverdueDays(loan);
        const fine = getOverdueFine(loan);

        reply = overdueDays > 0
          ? `Overdue by <b>${overdueDays} day(s)</b><br><br>
             Total overdue fine: <b>${formatMoney(fine)}</b>`
          : "You have no overdue days.";
        break;
      }
    }

    addBotMsg(reply);
  }, 300);
}


/* =====================================================
   SHARE LOAN
===================================================== */

function buildLoanShareText(loan, index) {
  return `BS&MFI Services

Loan ID : ${index + 1}
Amount : ${formatMoney(loan.amount)}
Borrowed on : ${formatDate(loan.borrowed)}`;
}

async function shareLoanDetails(loan, index) {
  const text = buildLoanShareText(loan, index);

  const url = new URL(window.location.href);

  url.searchParams.set("loan", String(index));
  url.searchParams.set("owner", currentUser.key);

  const payload =
    `${text}\n\nView this loan details by entering the account password: ${url.toString()}\n`;

  try {
    if (navigator.share) {
      await navigator.share({
        title: `BS&MFI Services · ${formatMoney(loan.amount)}`,
        text: payload
      });
    } else if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(payload);
      showToast("Loan details and link copied");
    } else {
      window.prompt("Copy loan details and link:", payload);
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      showToast("Unable to share. Try again.");
    }
  }
}

function getAllowedBottomNavItems() {
  if (!currentUser || !Array.isArray(currentUser.bottomNavItems)) {
    return [];
  }

  const validItems = ["amounts", "borrow", "settings", "search"];

  return [...new Set(
    currentUser.bottomNavItems.map(item => String(item).toLowerCase())
  )].filter(item => validItems.includes(item));
}

function configureBottomNav() {
  const nav = document.getElementById("bottom-nav");
  if (!nav || !currentUser) return;

  const allowedItems = getAllowedBottomNavItems();

  const shouldShow =
    currentUser.showBottomNav !== "no" &&
    allowedItems.length > 0;

  nav.style.display = shouldShow ? "flex" : "none";

  nav.querySelectorAll("[data-view]").forEach(item => {
    const allowed =
      shouldShow && allowedItems.includes(item.dataset.view);

    item.hidden = !allowed;
    item.style.display = allowed ? "flex" : "none";

    const active =
      allowed && item.dataset.view === currentView;

    item.classList.toggle("active", active);

    if (active) {
      item.setAttribute("aria-current", "page");
    } else {
      item.removeAttribute("aria-current");
    }
  });
}

function switchView(view, updateNav = true) {
  if (view === "search") {
    window.location.href =
      "https://mfi0212.github.io/mfi.f/bsmfi_search";
    return;
  }

  if (updateNav && currentUser) {
    const allowedItems = getAllowedBottomNavItems();

    if (allowedItems.length && !allowedItems.includes(view)) {
      view = allowedItems[0];
    }
  }

  currentView = view;

  configureHeaderMenu();
  closeHeaderMenu();

  document.querySelectorAll(".view").forEach(v =>
    v.classList.remove("active")
  );

  const target = document.getElementById("view-" + view);
  if (target) target.classList.add("active");

  if (updateNav) {
    // document.getElementById("back-btn").style.display = "none";

    configureBottomNav();

    document.getElementById("header-sub").textContent =
      currentUser.displayName + " · " + currentUser.premiumType;

    const titles = {
      amounts: "Amounts",
      borrow: "Borrow",
      settings: "Settings",
      search: "Search"
    };

    document.getElementById("header-title").textContent =
      titles[view] || view;

    configureBottomNav();
  }
}


/* =====================================================
   LOAN LIST
===================================================== */

function renderLoanList() {
  const list = document.getElementById("loan-list");
  if (!list) return;

  let loans = (currentUser.loans || []).map((loan, index) => ({
    loan,
    index
  }));

  if (loanSortOrder === "high") {
    loans.sort((a, b) =>
      Number(b.loan.amount) - Number(a.loan.amount)
    );
  }

  if (loanSortOrder === "low") {
    loans.sort((a, b) =>
      Number(a.loan.amount) - Number(b.loan.amount)
    );
  }

  if (!loans.length) {
    list.innerHTML =
      `<div class="empty-state"><p>No active loans</p></div>`;
    return;
  }

  list.innerHTML = loans.map(({ loan, index }) => {
    const left = daysLeft(loan.return);
    const overdueDays = getOverdueDays(loan);

    const status = left < 0
      ? `<span style="color:var(--danger)">Overdue ${overdueDays}d · Fine ${formatMoney(getOverdueFine(loan))}</span>`
      : left === 0
        ? `<span style="color:var(--warning)">Due today</span>`
        : `${left} days left`;

    return `
      <div class="loan-item" data-index="${index}">
        <div class="loan-avatar">${index + 1}</div>
        <div class="loan-info">
          <h3>${formatMoney(loan.amount)}</h3>
          <p>${status} · Return ${formatDate(loan.return)}</p>
        </div>
        <div class="loan-amount"></div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".loan-item").forEach(el => {
    el.onclick = () => openChat(Number(el.dataset.index));
  });
}

function closeHeaderMenu() {
  headerMenu.classList.remove("open");
  headerMore.setAttribute("aria-expanded", "false");
}

headerMore.addEventListener("click", event => {
  event.stopPropagation();

  configureHeaderMenu();
  headerMenu.classList.toggle("open");

  headerMore.setAttribute(
    "aria-expanded",
    headerMenu.classList.contains("open") ? "true" : "false"
  );
});

document.addEventListener("click", event => {
  if (
    !headerMenu.contains(event.target) &&
    event.target !== headerMore
  ) {
    closeHeaderMenu();
  }
});

headerMenu.addEventListener("click", event => {
  const link = event.target.closest("a[href]");

  if (link) {
    closeHeaderMenu();
    return;
  }

  const button = event.target.closest("button[data-menu-index]");
  if (!button) return;

  const item =
    (headerMenu._menuItems || [])[Number(button.dataset.menuIndex)];

  if (!item || typeof item.action !== "function") return;

  closeHeaderMenu();
  item.action();
});


/* =====================================================
   LOGIN
===================================================== */

document.getElementById("login-btn").addEventListener("click", tryLogin);

document.getElementById("password-input").addEventListener("keydown", e => {
  if (e.key === "Enter") tryLogin();
});

function tryLogin() {
  const pass =
    document.getElementById("password-input").value.trim();

  const err = document.getElementById("login-error");
  err.textContent = "";

  if (!pass) {
    err.textContent = "Enter a password";
    return;
  }

  let found = null;

  for (const key in users) {
    if (users[key].password === pass) {
      found = { key, ...users[key] };
      break;
    }
  }

  if (!found) {
    err.textContent = "Invalid password";
    return;
  }

  const sharedParams = new URLSearchParams(window.location.search);

  const sharedOwner = sharedParams.get("owner");
  const sharedLoanParam = sharedParams.get("loan");

  if (sharedOwner && sharedOwner !== found.key) {
    err.textContent =
      "Use the password for the account that shared this loan";
    return;
  }

  currentUser = found;
  loanSortOrder = "default";

  document.getElementById("login-view").style.display = "none";
  document.getElementById("app").style.display = "flex";

  initApp();

  if (
    sharedLoanParam !== null &&
    /^\d+$/.test(sharedLoanParam)
  ) {
    const sharedIndex = Number(sharedLoanParam);

    if (currentUser.loans && currentUser.loans[sharedIndex]) {
      openChat(sharedIndex);
      showToast("Shared loan opened");
    }
  }
}


/* =====================================================
   INITIALIZE APP
===================================================== */

function initApp() {
  const savedTheme =
    localStorage.getItem("bsmfi_theme") || "dark";

  document.body.classList.toggle("light", savedTheme === "light");

  document.getElementById("theme-label").textContent =
    savedTheme === "light" ? "Light" : "Dark";

  const colorSection =
    document.getElementById("color-section");

  if (currentUser.customui === "yes") {
    colorSection.style.display = "block";

    const savedColor =
      localStorage.getItem("bsmfi_primary") || "blue";

    setPrimaryColor(savedColor);

    const picker = document.getElementById("color-picker");
    picker.innerHTML = "";

    COLORS.forEach(c => {
      const sw = document.createElement("div");

      sw.className =
        "color-swatch" +
        (c.toLowerCase() === savedColor.toLowerCase() ? " active" : "");

      sw.style.background = c;
      sw.title = c;

      sw.onclick = () => {
        document.querySelectorAll(".color-swatch").forEach(s =>
          s.classList.remove("active")
        );

        sw.classList.add("active");
        setPrimaryColor(c);

        const customInput =
          document.getElementById("custom-color-input");

        if (customInput) customInput.value = c;
      };

      picker.appendChild(sw);
    });

    const customWrap = document.createElement("div");

    customWrap.className = "color-custom-wrap";

    customWrap.innerHTML = `
      <label>Custom</label>
      <input type="color" id="custom-color-input"
        value="${savedColor}" title="Pick any color">
    `;

    picker.appendChild(customWrap);

    document.getElementById("custom-color-input").oninput = e => {
      document.querySelectorAll(".color-swatch").forEach(s =>
        s.classList.remove("active")
      );

      setPrimaryColor(e.target.value);
    };
  } else {
    colorSection.style.display = "none";
    setPrimaryColor("blue");
    localStorage.removeItem("bsmfi_primary");
  }

  const notice = document.getElementById("special-notice");

  if (
    currentUser.showSpecialNotice === "yes" &&
    currentUser.specialNoticeText
  ) {
    notice.textContent = currentUser.specialNoticeText;
    notice.style.display = "block";
  } else {
    notice.style.display = "none";
  }

  const custom = document.getElementById("custom-content");

  if (
    currentUser.showCustomContent === "yes" &&
    currentUser.customContent
  ) {
    custom.style.display = "block";

    if (currentUser.customContent.type === "image") {
      const image = document.createElement("img");

      image.src = currentUser.customContent.value;
      image.alt = "Offer";

      image.onclick = () => {
        if (currentUser.customContent.url) {
          window.open(
            currentUser.customContent.url,
            "_blank",
            "noopener"
          );
        }
      };

      custom.replaceChildren(image);
    }
  } else {
    custom.style.display = "none";
  }

  renderLoanList();
  renderServices();

  const borrowSearch = document.getElementById("borrow-search");
  borrowSearch.value = "";

  borrowSearch.oninput = () => {
    const query = borrowSearch.value.trim().toLowerCase();

    document.querySelectorAll(
      "#services-grid .service-card"
    ).forEach(card => {
      card.hidden =
        !card.textContent.toLowerCase().includes(query);
    });
  };

  configureBottomNav();
  switchView("amounts");
}


/* =====================================================
   OTHER EXISTING EVENT LISTENERS
===================================================== */

function openApplyAmount() {
  openPage("new-entry");
}

document.getElementById("back-btn").addEventListener("click", () => {
  switchView("amounts");
});

document.querySelectorAll("#bottom-nav button").forEach(btn => {
  btn.addEventListener("click", () => switchView(btn.dataset.view));
});

document.getElementById("borrow-apply").addEventListener("click", openApplyAmount);

document.getElementById("fee-calculator-open").addEventListener("click", () => {
  openPage("fee-calculator");
});

document.getElementById("theme-toggle").addEventListener("click", () => {
  document.body.classList.toggle("light");

  const isLight = document.body.classList.contains("light");

  document.getElementById("theme-label").textContent =
    isLight ? "Light" : "Dark";

  localStorage.setItem(
    "bsmfi_theme",
    isLight ? "light" : "dark"
  );
});


/* =====================================================
   LOGOUT
===================================================== */

function logout() {
  closeHeaderMenu();

  currentUser = null;
  currentLoanIndex = null;
  currentView = "amounts";
  chatWorkflow = null;
  chatMessages = [];

  document.getElementById("app").style.display = "none";
  document.getElementById("login-view").style.display = "flex";

  document.getElementById("password-input").value = "";
  document.getElementById("login-error").textContent = "";

  const cleanUrl = new URL(window.location.href);

  cleanUrl.searchParams.delete("loan");
  cleanUrl.searchParams.delete("owner");

  window.history.replaceState({}, "", cleanUrl.toString());
}

document.getElementById("logout-btn").addEventListener("click", logout);


/* =====================================================
   PAGE OVERLAY
===================================================== */

document.querySelectorAll(".settings-item[data-page]").forEach(item => {
  item.addEventListener("click", () => openPage(item.dataset.page));
});

document.getElementById("page-back").addEventListener("click", () => {
  document.getElementById("page-overlay").classList.remove("active");
});


/* =====================================================
   OPEN PAGE
===================================================== */

function openPage(page) {
  const titles = {
    terms: "Terms & Conditions",
    privacy: "Privacy Policy",
    "new-entry": "New Entry Form",
    "im-late": "I'm Late",
    helper: "Helper",
    issue: "Report an issue",
    "fee-calculator": "Fee Calculator"
  };

  document.getElementById("page-title").textContent =
    titles[page] || page;

  const content = document.getElementById("page-content");

  if (page === "fee-calculator") {
    content.innerHTML = `
      <h2>Calculate service fee</h2>
      <p>Enter an amount to estimate the service fee.</p>

      <div class="form-group" style="margin-top:20px;">
        <label for="fee-service">Select service</label>
        <select id="fee-service">
          <option value="Delay It">Delay It — 6%</option>
          <option value="Split Pay">Split Pay — 6.5%</option>
          <option value="Buy Limit">Buy Limit — 7%</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fee-amount">Amount (₹)</label>
        <input type="number" id="fee-amount"
          min="0" step="0.01" placeholder="Enter amount">
      </div>

      <button class="btn" id="fee-calculate" type="button">
        Calculate fee
      </button>

      <div id="fee-calculation-result"></div>
    `;

    document.getElementById("fee-calculate").onclick = () => {
      const service =
        document.getElementById("fee-service").value;

      const amount =
        Number(document.getElementById("fee-amount").value);

      const result =
        document.getElementById("fee-calculation-result");

      if (!Number.isFinite(amount) || amount <= 0) {
        result.innerHTML = "";
        showToast("Enter a valid amount");
        return;
      }

      const rate = SERVICE_FEES[service];
      const fee = amount * rate / 100;

      result.innerHTML = `
        <div class="fee-result">
          <div class="fee-result-row">
            <span>Amount</span>
            <strong>${formatMoney(amount)}</strong>
          </div>
          <div class="fee-result-row">
            <span>Service fee (${rate}%)</span>
            <strong>${formatMoney(fee)}</strong>
          </div>
          <div class="fee-result-row total">
            <span>Amount + fee</span>
            <strong>${formatMoney(amount + fee)}</strong>
          </div>
        </div>
      `;
    };

  } else if (page === "terms") {
    content.innerHTML = `
      <h2>Terms & Conditions</h2>
      <p>Welcome to BS&MFI services. By using this platform you agree to the following terms.</p>
      <h3>1. Services</h3>
      <p>We provide micro-finance and related digital services subject to eligibility and approval.</p>
      <h3>2. User Responsibilities</h3>
      <p>You must provide accurate information and repay loans according to the agreed schedule.</p>
      <h3>3. Fees & Interest</h3>
      <p>Interest rates, overdue fees and service charges are disclosed before confirmation of any product.</p>
      <h3>4. Changes</h3>
      <p>We may update these terms. Continued use after changes constitutes acceptance.</p>
      <a style="text-decoration:underline;color:var(--primary);font-weight:900;"
        href="https://mfi0212.github.io/mfi.f/privacyandterms#terms">
        Read more
      </a>
    `;

  } else if (page === "privacy") {
    content.innerHTML = `
      <h2>Privacy Policy</h2>
      <p>Your privacy is important to us.</p>
      <h3>Information We Collect</h3>
      <p>We collect account details, loan history and usage data necessary to provide the service.</p>
      <h3>How We Use It</h3>
      <p>Data is used for account management, risk assessment, customer support and service improvement.</p>
      <h3>Sharing</h3>
      <p>We do not sell personal data. Information may be shared with partners only as required to deliver the service or comply with law.</p>
      <h3>Security</h3>
      <p>We apply reasonable technical and organisational measures to protect your data.</p>
      <a style="text-decoration:underline;color:var(--primary);font-weight:900;"
        href="https://mfi0212.github.io/mfi.f/privacyandterms#privacy">
        Read more
      </a>
    `;

  } else if (page === "new-entry") {
    content.innerHTML = `
      <h2>New Entry Form</h2>
      <p style="margin-bottom:20px;">Submit a request for a new loan or service.</p>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="ne-name"
          value="${escapeHTML(currentUser.displayName)}">
      </div>

      <div class="form-group">
        <label>Requested Amount (₹)</label>
        <input type="number" id="ne-amount" placeholder="e.g. 25000">
      </div>

      <div class="form-group">
        <label>Purpose</label>
        <select id="ne-purpose">
          <option value="">Select purpose</option>
          <option>Personal</option>
          <option>Business</option>
          <option>Education</option>
          <option>Medical</option>
          <option>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea id="ne-notes" placeholder="Any additional details..."></textarea>
      </div>

      <button class="btn" id="ne-submit">Submit Request</button>
      <a href="https://mfi0212.github.io/mfi.f/entrysheet">
        <button class="btn" type="button">Boost fast entry</button>
      </a>
    `;

    document.getElementById("ne-submit").onclick = () => {
      const amt = document.getElementById("ne-amount").value;

      if (!amt || Number(amt) <= 0) {
        showToast("Enter a valid amount");
        return;
      }

      showToast("Request submitted successfully");
      document.getElementById("page-overlay").classList.remove("active");
    };

  } else if (page === "im-late") {
    content.innerHTML = `
      <h2>I'm Late</h2>
      <p>If you are <span class="highlight">late in returning the amount</span>, the interest will <span class="highlight">keep adding to the amount</span>.</p>
      <p>To avoid complications, keep the following in mind:</p>
      <ul>
        <li>You must pay before the return date to avoid additional charges.</li>
        <li>You may get the amount on the borrowed date, but the return must be completed before return date or on return date before 10 AM; otherwise, it will be considered late.</li>
        <li>Late payments can quickly increase.</li>
        <li>Contact us if you think you'll be late so we can help you.</li>
      </ul>
      <p class="verify">Verify your total return amount in your account details before returning the amount.</p>
    `;

  } else if (page === "issue") {
    content.innerHTML = `
      <h2>Report an issue</h2>
      <p>Tell us what is not working. Include the page or loan amount if relevant.</p>

      ${currentLoanIndex !== null && currentUser?.loans?.[currentLoanIndex]
        ? `<p style="color:var(--text-secondary);font-size:13px;margin-top:8px;">Related loan: ${formatMoney(currentUser.loans[currentLoanIndex].amount)}</p>`
        : ""}

      <div class="form-group" style="margin-top:18px;">
        <label>Enter your issue</label>
        <textarea id="issue-description" placeholder="Describe the issue..."></textarea>
      </div>

      <button class="btn" id="issue-submit">Continue</button>

      <p style="font-size:12px;color:var(--text-secondary);margin-top:10px;">
        NOTE: Write your password first, then enter the issue you are facing.
      </p>

      <a style="color:var(--primary);font-weight:900;text-decoration:underline;"
        href="https://docs.google.com/forms/d/e/1FAIpQLSdmCSWXieZpqTiUqIVVihwn8vdGl-RyHijMNmovi_Bfc2GRbg/viewform">
        Or fill the form.
      </a>
    `;

    document.getElementById("issue-submit").onclick = () => {
      const issue =
        document.getElementById("issue-description").value.trim();

      if (!issue) {
        showToast("Describe the issue first");
        return;
      }

      const subject = encodeURIComponent("BS&MFI issue report");

      const body = encodeURIComponent(
        `Account: ${currentUser.displayName}\nIssue: ${issue}`
      );

      window.location.href =
        `mailto:?subject=${subject}&body=${body}`;
    };

  } else if (page === "helper") {
    content.innerHTML = `
      <h2>Helper</h2>
      <p>Quick answers to common questions.</p>

      <h3>How do I check my loan details?</h3>
      <p>Go to the Amounts tab and tap any Amount card. A chat-style view will open with options.</p>

      <h3>What is "Delay It"?</h3>
      <p>It allows eligible users to request an extension of the due date (subject to approval and fees).</p>

      <h3>What is Split Pay?</h3>
      <p>Split the outstanding amount into smaller installments if the feature is enabled for your account.</p>

      <h3>Need more help?</h3>
      <p>Contact support through your relationship manager or official channels.</p>

      <a href="https://mfi0212.github.io/mfi.f/abt.hlp">
        <button class="btn btn-outline" style="margin-top:20px;" type="button">
          Read more
        </button>
      </a>
    `;
  }

  document.getElementById("page-overlay").classList.add("active");
}


document.addEventListener("gesturestart", e => e.preventDefault());
  </script>
