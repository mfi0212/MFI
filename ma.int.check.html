<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>వడ్డీ ట్రాకర్</title><link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oswald|Noto+Sans">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0;font-family: "Noto Sans", sans-serif; }
    body {
      background: #fff;
      color: #2b2b2b;
      min-height: 100vh;
    }
    * {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .container {
     max-width: 750px;
    margin: 0 auto;
    padding: 10px;
    }
    .header {
          display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0;
    margin: 15px 0;
    }
    .header h2 {
      font-size: 22px;
      font-weight: 700;
    }
    .today {
      font-size: 15px;
      white-space: nowrap;
    }
    .navigation {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .nav-btn {
     min-height: 38px;
    background: #fff;
    color: #2b2b2b;
    border: 1px solid #2b2b2b;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    width: 85px;
    }
    .nav-btn:hover,
    .nav-btn.active {
      background: #2b2b2b;
      color: #fff;
    }
    .section { display: none; }
    .section.active { display: block; }
    .section-title {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 700;
    }
    .user {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid #2b2b2b;
      border-radius: 5px;
    }
    .user-name {
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 700;
    }
    .entry {
      margin-bottom: 8px;
      padding: 10px;
      border: 1px solid #2b2b2b;
      border-radius: 4px;
    }
    .entry:last-child { margin-bottom: 0; }
    .entry div {
     font-size: 17px;
    line-height: 35px;
    display: flex;
    justify-content: space-between;
    }
    .entry div:nth-child(2){
      display: none;
    }
    .entry .label {
      font-weight: 600;
    }
    .entry .value {
      font-weight: 400;
    }
    .paid-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .paid-input {
     width: 100px;
    padding: 3px 8px;
    border: none;
    border-radius: 3px;
    text-align: right;
    font-size: 17px;
    outline: none;
    }
    .paid-input:focus {
      outline: 2px solid #2b2b2b;
      outline-offset: 1px;
    }
    .remaining {
     margin-top: 6px !important;
    background: #2b2b2b;
    color: #fff !important;
    border-radius: 3px;
    text-align: center;
    padding: 0 5px;
    }
    .notes-box {
      padding: 14px;
      border: 1px solid #2b2b2b;
      border-radius: 5px;
    }
    .note-input {
      display: block;
      width: 100%;
      min-height: 120px;
      padding: 10px;
      resize: vertical;
      border: 1px solid #2b2b2b;
      border-radius: 3px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      outline: none;
    }
    .note-input:focus {
      outline: 2px solid #2b2b2b;
      outline-offset: 1px;
    }
    .save-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: #2b2b2b;
      color: #fff;
      border: 1px solid #2b2b2b;
      border-radius: 3px;
      font-size: 14px;
      cursor: pointer;
    }
    .save-btn:hover {
      background: #fff;
      color: #2b2b2b;
    }
    .notes-list { margin-top: 12px; }
    .note {
      position: relative;
      margin-bottom: 8px;
      padding: 10px 40px 10px 10px;
      border: 1px solid #2b2b2b;
      border-radius: 4px;
    }
    .note:last-child { margin-bottom: 0; }
    .note-text {
     font-size: 24px;
    white-space: pre-wrap;
    word-break: break-word;
    }
    .note-date {
      margin-top: 6px;
      font-size: 11px;
    }
    .delete-note {
          position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    background: red;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 30px;
    cursor: pointer;
    font-weight: 300;
    display: flex;
    justify-content: center;
    align-items: center;
}
footer {
    font-size: 10px;
    text-align: center;
    color: gray;
}
    .empty-notes {
      padding: 16px 5px;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="    text-align: center;
    padding: 10px 0;
    background: #ffdb00;">
      <a href="https://mfi0212.github.io/personal/gold.market.divert.user.html">బంగారం market</a>
    </div>
    <div class="header">
      <h2 id="title">వడ్డీ</h2>
      <div class="today" id="todayDate"></div>
      <button class="nav-btn" onclick="toggleLanguage()">తె/ENG</button>
    </div>
    <div class="navigation">
      <button class="nav-btn active" id="interestNav" onclick="showSection('interest')">వడ్డీ</button>
      <button class="nav-btn" id="notesNav" onclick="showSection('notes')">గమనికలు</button>
    </div>
    <section id="interestSection" class="section active">
      <h3 class="section-title" id="interestTitle">వడ్డీ వివరాలు</h3>
      <div id="app"></div>
    </section>
    <section id="notesSection" class="section">
      <h3 class="section-title" id="notesTitle">గమనికలు</h3>
      <div class="notes-box">
        <textarea id="noteInput" class="note-input" placeholder="ఇక్కడ ఏదైనా రాయండి..."></textarea>
        <button class="save-btn" id="saveButton" onclick="saveNote()">సేవ్ చేయండి</button>
        <div id="notesList" class="notes-list"></div>
      </div>
    </section>
  </div>
  <footer>Black Swan, All right reserved. Version(v.01.11.9)</footer>
  <script>
    // ===================== ONLY EDIT THIS PART =====================
    const users = [
      {
        name: "PAWAN NAIDU",
        entries: [
          { amount: 40000, interest: 2, takenDate: "2026-05-30", interestPaid: 800 },
          { amount: 45000, interest: 2, takenDate: "2026-09-12", interestPaid: 0 },
          { amount: 15000, interest: 2, takenDate: "2026-09-12", interestPaid: 0 },
        ]
      },
    ];
    // ===============================================================
    let currentLang = "te";
    const lang = {
      en: {
        title: "Interest",
        today: "Today",
        interestTitle: "Interest Details",
        notesTitle: "Notes",
        amount: "Amount",
        interest: "Interest",
        takenDate: "Taken Date",
        days: "Days Passed",
        interestPaid: "Interest Paid",
        remaining: "Remaining Interest",
        interestNav: "Interest",
        notesNav: "Notes",
        placeholder: "Write something here...",
        save: "Save",
        emptyNotes: "No notes saved yet.",
        delete: "Delete"
      },
      te: {
        title: "వడ్డీ",
        today: "ఈరోజు",
        interestTitle: "వడ్డీ వివరాలు",
        notesTitle: "గమనికలు",
        amount: "మొత్తం",
        interest: "వడ్డీ",
        takenDate: "తీసుకున్న తేదీ",
        days: "గడిచినా రోజులు",
        interestPaid: "చెల్లించిన వడ్డీ",
        remaining: "మిగిలిన వడ్డీ",
        interestNav: "వడ్డీ",
        notesNav: "గమనికలు",
        placeholder: "ఇక్కడ ఏదైనా రాయండి...",
        save: "సేవ్ చేయండి",
        emptyNotes: "ఇంకా గమనికలు సేవ్ చేయలేదు.",
        delete: "తొలగించు"
      }
    };
    const monthNames = {
      en: ["January","February","March","April","May","June","July","August","September","October","November","December"],
      te: ["జనవరి","ఫిబ్రవరి","మార్చి","ఏప్రిల్","మే","జూన్","జూలై","ఆగస్టు","సెప్టెంబర్","అక్టోబర్","నవంబర్","డిసెంబర్"]
    };
    function showSection(section) {
      const interestSection = document.getElementById("interestSection");
      const notesSection = document.getElementById("notesSection");
      const interestNav = document.getElementById("interestNav");
      const notesNav = document.getElementById("notesNav");
      if (section === "interest") {
        interestSection.classList.add("active");
        notesSection.classList.remove("active");
        interestNav.classList.add("active");
        notesNav.classList.remove("active");
      }
      if (section === "notes") {
        interestSection.classList.remove("active");
        notesSection.classList.add("active");
        interestNav.classList.remove("active");
        notesNav.classList.add("active");
        renderNotes();
      }
    }
    function parseDate(dateStr) {
      const parts = dateStr.split("-");
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }
    function formatDateWithMonth(dateStr) {
      const d = parseDate(dateStr);
      return `${d.getDate()} ${monthNames[currentLang][d.getMonth()]} ${d.getFullYear()}`;
    }
    function getDays(takenDate) {
      const start = parseDate(takenDate);
      const today = new Date();
      start.setHours(0, 0, 0, 0);
      today.setHours(0, 0, 0, 0);
      return Math.max(0, Math.floor((today - start) / 86400000));
    }
    function showToday() {
      const today = new Date();
      document.getElementById("todayDate").innerText =
        `${lang[currentLang].today}: ${today.getDate()} ${monthNames[currentLang][today.getMonth()]} ${today.getFullYear()}`;
    }
    function toggleLanguage() {
      currentLang = currentLang === "en" ? "te" : "en";
      updateLanguage();
      render();
      renderNotes();
    }
    function updateLanguage() {
      const t = lang[currentLang];
      document.documentElement.lang = currentLang;
      document.title = t.title;
      document.getElementById("title").innerText = t.title;
      document.getElementById("interestTitle").innerText = t.interestTitle;
      document.getElementById("notesTitle").innerText = t.notesTitle;
      document.getElementById("interestNav").innerText = t.interestNav;
      document.getElementById("notesNav").innerText = t.notesNav;
      document.getElementById("noteInput").placeholder = t.placeholder;
      document.getElementById("saveButton").innerText = t.save;
      showToday();
    }
    function render() {
      const app = document.getElementById("app");
      const t = lang[currentLang];
      app.innerHTML = "";
      users.forEach((user, userIndex) => {
        const entriesHTML = user.entries.map((entry, entryIndex) => {
          const days = getDays(entry.takenDate);
          const totalInterest = Math.round((entry.amount * entry.interest * days) / (100 * 30));
          const remaining = Math.max(0, totalInterest - entry.interestPaid);
          return `
            <div class="entry">
              <div><span class="label">${t.amount}:</span> <span class="value">₹${Number(entry.amount).toLocaleString("en-IN")}</span></div>
              <div><span class="label">${t.interest}:</span> <span class="value">${entry.interest}%</span></div>
              <div><span class="label">${t.takenDate}:</span> <span class="value">${formatDateWithMonth(entry.takenDate)}</span></div>
              <div><span class="label">${t.days}:</span> <span class="value">${days}</span></div>
              <div class="paid-row">
                <span class="label">${t.interestPaid}:</span>
                <input class="paid-input" type="number" min="0" value="${entry.interestPaid}"
                  oninput="updatePaid(${userIndex}, ${entryIndex}, this.value)">
              </div>
              <div class="remaining"><span class="label">${t.remaining}:</span> <span class="value">₹${remaining.toLocaleString("en-IN")}</span></div>
            </div>
          `;
        }).join("");
        app.innerHTML += `
          <div class="user">
            <div class="user-name">${user.name}</div>
            ${entriesHTML}
          </div>
        `;
      });
    }
    function updatePaid(userIndex, entryIndex, value) {
      users[userIndex].entries[entryIndex].interestPaid = Number(value) || 0;
      render();
    }
    const NOTES_KEY = "interestTrackerNotes";
    function getNotes() {
      try {
        return JSON.parse(localStorage.getItem(NOTES_KEY)) || [];
      } catch {
        return [];
      }
    }
    function saveNote() {
      const input = document.getElementById("noteInput");
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      const notes = getNotes();
      notes.unshift({ id: Date.now(), text, date: new Date().toISOString() });
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      input.value = "";
      renderNotes();
    }
    function deleteNote(id) {
      const notes = getNotes().filter(note => note.id !== id);
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      renderNotes();
    }
    function formatNoteDate(dateString) {
      const date = new Date(dateString);
      const hours = String(date.getHours()).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");
      return `${date.getDate()} ${monthNames[currentLang][date.getMonth()]} ${date.getFullYear()}, ${hours}:${minutes}`;
    }
    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
    function renderNotes() {
      const list = document.getElementById("notesList");
      const notes = getNotes();
      const t = lang[currentLang];
      if (notes.length === 0) {
        list.innerHTML = `<div class="empty-notes">${t.emptyNotes}</div>`;
        return;
      }
      list.innerHTML = notes.map(note => `
        <div class="note">
          <button class="delete-note" onclick="deleteNote(${note.id})" title="${t.delete}">×</button>
          <div class="note-text">${escapeHTML(note.text)}</div>
          <div class="note-date">${formatNoteDate(note.date)}</div>
        </div>
      `).join("");
    }
    updateLanguage();
    render();
    renderNotes();
  </script>
</body>
</html>
